  }

  // Draw one billboard entity, CLIPPED to [clipL, clipR] so walls occlude it
  // per-column (real raycaster sprite clipping). figH/figW are the projected
  // size; (cx, feetY) is the sprite's ground contact on the floor.
  function drawFpvEntityClipped(ctx, e, cx, feetY, figH, figW, clipL, clipR) {
    if (clipR <= clipL) return;
    ctx.save();
    ctx.beginPath();
    // Clip band spans the whole standing figure (feetY up figH) plus headroom for
    // hp pips / a carried heart above, and a little below for the contact shadow.
    ctx.rect(clipL, feetY - figH * 2.0, clipR - clipL, figH * 2.4);
    ctx.clip();
    // Depth dim: distant billboards sink toward ink like the walls do.
    var dim = Math.max(0.35, 1 - (e.d || 0) / FPV_FOG);
    drawFpvEntity(ctx, e, cx, feetY, figH, figW, dim);
    ctx.restore();
  }

  // A cog seen head-on in first person: a chunky team-tinted chassis with a dark
  // visor band carrying TWO glowing cyan eyes (the cog's signature), a pair of
  // side wheels, and a bottom shadow. Enemies get red hp pips; carriers an amber
  // heart above; mates a paper outline ring. `dim` (0..1) applies depth shading.
  function drawFpvEntity(ctx, e, cx, feetY, figH, figW, dim) {
    dim = dim == null ? 1 : dim;
    var baseCol = e.team === 'red' ? RED : (e.team === 'blue' ? BLUE : AMBER);
    var col = shade(baseCol, dim);
    if (e.k === 'item') {
      // Items rest on the floor: center the glyph a little above the contact point.
      var ir = figH * 0.7;
      drawItemGlyph(ctx, e.item, cx, feetY - ir * 0.5, ir, dim);
      return;
    }
    if (e.k === 'heart') {
      // A heart pedestal sits on the floor; lift the glyph so it rests, not floats.
      var hs = figH * 0.9;
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.fillStyle = col;
      ctx.strokeStyle = 'rgba(12,8,5,0.85)';
      ctx.lineWidth = Math.max(1, figH * 0.05);
      heartPath(ctx, cx, feetY - hs * 0.5, hs);
      ctx.fill(); ctx.stroke();
      ctx.restore();
      return;
    }
    var enemy = e.k === 'enemy';
    var feet = feetY;
    var top = feet - figH;
    // Size the blit off the projected figure so distant cogs shrink like the
    // walls. The front master's aspect is ~0.94 w/h; its HEIGHT tracks figH so
    // the cog stands the right size on the floor.
    var artImg = COG_ART[e.team];
    var drawH = figH * 1.02;
    var drawW = drawH * COG_ASPECT;
    var bodyW = drawW;         // for the mate ring + shadow width
    ctx.save();
    ctx.lineJoin = 'round';

    // contact shadow ON the floor, right under the wheels — grounds the figure.
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath();
    ctx.ellipse(cx, feet, bodyW * 0.5, figH * 0.07, 0, 0, Math.PI * 2);
    ctx.fill();

    if (cogArtReady(artImg)) {
      // Blit the cog box (COG_TRIM as fractions of natural size — full-frame for
      // the pre-trimmed front master, a cut-out box for the top-down fallback),
      // centered on cx and standing with its feet on `feet`.
      var iw = artImg.naturalWidth, ih = artImg.naturalHeight;
      var sxp = COG_TRIM.x * iw, syp = COG_TRIM.y * ih;
      var swp = COG_TRIM.w * iw, shp = COG_TRIM.h * ih;
      var dx = cx - drawW / 2, dy = feet - drawH;
      if (dim >= 0.995) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(artImg, sxp, syp, swp, shp, dx, dy, drawW, drawH);
      } else {
        // Depth-dim via an offscreen scratch so only sprite pixels darken.
        var sw = Math.max(1, Math.ceil(drawW)), sh = Math.max(1, Math.ceil(drawH));
        if (cogScratch.width !== sw) cogScratch.width = sw;
        if (cogScratch.height !== sh) cogScratch.height = sh;
        if (!cogScratchCtx) cogScratchCtx = cogScratch.getContext('2d');
        var sc = cogScratchCtx;
        sc.clearRect(0, 0, sw, sh);
        sc.imageSmoothingEnabled = false;
        sc.globalCompositeOperation = 'source-over';
        sc.drawImage(artImg, sxp, syp, swp, shp, 0, 0, sw, sh);
        // ink wash clipped to the sprite silhouette (source-atop)
        sc.globalCompositeOperation = 'source-atop';
        sc.fillStyle = 'rgba(10,7,4,' + (1 - dim).toFixed(3) + ')';
        sc.fillRect(0, 0, sw, sh);
        sc.globalCompositeOperation = 'source-over';
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(cogScratch, dx, dy, drawW, drawH);
      }
    } else {
      // Fallback: procedural chassis until the art loads.
      drawFpvChassis(ctx, cx, feet, figW, figH, col, dim);
    }

    // mate ring: a paper hoop under the chassis so allies read at a glance
    if (e.k === 'mate') {
      ctx.strokeStyle = 'rgba(242,232,216,' + (0.75 * dim).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, figH * 0.04);
      ctx.beginPath();
      ctx.ellipse(cx, feet - figH * 0.02, bodyW * 0.62, figH * 0.09, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // enemy hp pips over the head
    if (enemy && typeof e.hp === 'number' && e.hp >= 0) {
      var pips = Math.min(6, e.hp);
      var pr = Math.max(1, figH * 0.045);
      var pyy = top - pr * 1.6;
      for (var p = 0; p < pips; p++) {
        ctx.fillStyle = RED;
        ctx.beginPath();
        ctx.arc(cx - (pips - 1) * pr * 1.5 / 2 + p * pr * 1.5, pyy, pr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // carrier heart above the head
    if (e.carry) {
      ctx.fillStyle = AMBER;
      ctx.strokeStyle = 'rgba(12,8,5,0.85)';
      ctx.lineWidth = Math.max(1, figH * 0.03);
      var chs = figH * 0.2;
      heartPath(ctx, cx, top - chs * (enemy ? 1.6 : 0.7), chs);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // Procedural cog chassis — the fallback billboard drawn only until the real
  // front-facing art (COG_ART) has loaded. Chunky team-tinted body, side wheels,
  // dark visor band with two glowing cyan eyes. (cx, feet) is the sprite's
  // ground contact; figW/figH the projected size; col the depth-shaded team tint.
  function drawFpvChassis(ctx, cx, feet, figW, figH, col, dim) {
    var bodyW = figW * 0.78;
    var bodyH = figH * 0.72;
    var bodyTop = feet - bodyH;
    var lw = Math.max(1, figH * 0.05);

    // side wheels (dark, behind the chassis edges)
    ctx.fillStyle = shade('#2a211a', dim);
    ctx.strokeStyle = 'rgba(10,7,4,0.9)'; ctx.lineWidth = lw;
    var wheelW = bodyW * 0.2, wheelH = bodyH * 0.62;
    roundRect(ctx, cx - bodyW / 2 - wheelW * 0.5, bodyTop + bodyH * 0.28, wheelW, wheelH, wheelW * 0.4);
    ctx.fill(); ctx.stroke();
    roundRect(ctx, cx + bodyW / 2 - wheelW * 0.5, bodyTop + bodyH * 0.28, wheelW, wheelH, wheelW * 0.4);
    ctx.fill(); ctx.stroke();

    // chassis body (rounded, team-tinted) with a top highlight + bottom shade band
    ctx.fillStyle = col;
    ctx.strokeStyle = 'rgba(10,7,4,0.92)'; ctx.lineWidth = lw;
    roundRect(ctx, cx - bodyW / 2, bodyTop, bodyW, bodyH, bodyW * 0.22);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,240,210,' + (0.14 * dim).toFixed(3) + ')';
    roundRect(ctx, cx - bodyW / 2, bodyTop, bodyW, bodyH * 0.34, bodyW * 0.22);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    roundRect(ctx, cx - bodyW / 2, bodyTop + bodyH * 0.62, bodyW, bodyH * 0.38, bodyW * 0.22);
    ctx.fill();

    // dark visor band across the upper chassis with two glowing cyan eyes
    var visorY = bodyTop + bodyH * 0.26;
    var visorH = bodyH * 0.3;
    ctx.fillStyle = shade('#141b1e', dim);
    roundRect(ctx, cx - bodyW * 0.4, visorY, bodyW * 0.8, visorH, visorH * 0.45);
    ctx.fill();
    var eyeR = Math.max(1, visorH * 0.32);
    var eyeDx = bodyW * 0.18, eyeCy = visorY + visorH * 0.5;
    var eyeCol = 'rgba(120,236,246,' + (0.65 + 0.35 * dim).toFixed(3) + ')';
    for (var s = -1; s <= 1; s += 2) {
      var g = ctx.createRadialGradient(cx + s * eyeDx, eyeCy, 0, cx + s * eyeDx, eyeCy, eyeR * 2.4);
      g.addColorStop(0, eyeCol); g.addColorStop(1, 'rgba(120,236,246,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx + s * eyeDx, eyeCy, eyeR * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d6fbff';
      ctx.beginPath(); ctx.arc(cx + s * eyeDx, eyeCy, eyeR, 0, Math.PI * 2); ctx.fill();
    }
  }

  // rounded-rect helper (older canvases lack ctx.roundRect)
  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  // Tint a #rrggbb by a factor (>1 lighten, <1 darken).
  function shade(hex, f) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (!m) return hex;
    function c(i) { return Math.max(0, Math.min(255, Math.round(parseInt(m[i], 16) * f))); }
    return 'rgb(' + c(1) + ',' + c(2) + ',' + c(3) + ')';
  }

  // Self-status HUD: name (team-tinted), hp pips, carried gear + flag flag.
  var ITEM_LABEL = { grenade: 'GRENADE', medkit: 'MEDKIT', shield: 'SHIELD', plasma: 'PLASMA' };
  function renderFpvHud(self) {
    var hud = $('fpv-hud');
    if (!self) { hud.style.display = 'none'; return; }
    hud.style.display = 'flex';
    hud.classList.toggle('fpv-dead', self.alive === false);
    var nameEl = $('fpv-name');
    nameEl.className = 'fpv-name ' + (self.team || '');
    nameEl.textContent = lastState ? shortName(rosterName(lastState, lastState.pov)) : '';
    // hp pips: fill = remaining, hollow = spent (cap the row so it never wraps)
    var maxHp = Math.max(self.hp || 0, 3);
    var hpEl = $('fpv-hp'), hpHtml = '';
    for (var i = 0; i < maxHp; i++) {
      hpHtml += '<i' + (i < self.hp ? '' : ' class="spent"') + '></i>';
    }
    hpEl.innerHTML = hpHtml;
    // gear: lives count, carried pickups, and the enemy-heart flag
    var gearEl = $('fpv-gear'), bits = [];
    if (typeof self.lives === 'number') bits.push('×' + self.lives);
    (self.items || []).forEach(function (it) { bits.push(ITEM_LABEL[it] || it.toUpperCase()); });
    var html = bits.map(function (b) { return '<span>' + b + '</span>'; }).join('');
    if (self.carry) html += '<span class="carry">♥ HEART</span>';
    gearEl.innerHTML = html;
  }

  // Un-fogged tactical minimap: the whole arena silhouette with every unit, both
  // hearts, present pickups, and the POV seat's vision wedge + bubble. Full
  // spatial context — deliberately NOT fog-limited — so the viewer always knows
  // where the EYES are looking and located.
  var fpvMapEl = $('fpv-map'), fpvMapCanvas = $('fpv-map-canvas'), fpvMapCtx = null;
  function renderFpvMap(fp) {
    var m = fp.map;
    if (!m) { fpvMapEl.style.display = 'none'; return; }
    fpvMapEl.style.display = 'block';
    if (!fpvMapCtx) fpvMapCtx = fpvMapCanvas.getContext('2d');
    var ctx = fpvMapCtx;
    var dpr = window.devicePixelRatio || 1;
    var cssW = fpvMapCanvas.clientWidth || 130, cssH = fpvMapCanvas.clientHeight || 70;
    var W = Math.max(1, Math.round(cssW * dpr)), H = Math.max(1, Math.round(cssH * dpr));
    if (fpvMapCanvas.width !== W) fpvMapCanvas.width = W;
    if (fpvMapCanvas.height !== H) fpvMapCanvas.height = H;
    var sx = W / m.w, sy = H / m.h;              // world px → canvas px
    function px(x) { return x * sx; }
    function py(y) { return y * sy; }

    // floor wash
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(20,15,10,0.55)';
    ctx.fillRect(0, 0, W, H);
    // midline, for a quick sense of sides
    ctx.strokeStyle = 'rgba(242,232,216,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();

    // baked terrain silhouette (stone + glass), stretched to the inset
    if (fpMapBaked) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(fpMapBaked, 0, 0, fpMapBaked.width, fpMapBaked.height, 0, 0, W, H);
    }

    // POV vision wedge (cone + bubble), un-fogged. aimBrads: 0 = east, CCW+, and
    // screen-y grows downward so we negate the angle.
    var here = m.here;
    if (here && here.alive !== false) {
      var ax = px(here.x), ay = py(here.y);
      var aim = (here.aim / 256) * Math.PI * 2;   // brads → radians
      var half = (here.coneDeg || 60) * Math.PI / 180;
      var reach = Math.hypot(W, H);               // cone is unlimited range: fill
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.arc(ax, ay, reach, -aim - half, -aim + half);
      ctx.closePath();
      var amber = ctx.createRadialGradient(ax, ay, 0, ax, ay, reach);
      amber.addColorStop(0, 'rgba(232,163,61,0.34)');
      amber.addColorStop(1, 'rgba(232,163,61,0)');
      ctx.fillStyle = amber;
      ctx.fill();
      // omni bubble
      ctx.beginPath();
      ctx.arc(ax, ay, (here.bubble || 0) * ((sx + sy) / 2), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(232,163,61,0.14)';
      ctx.fill();
      // aim ray
      ctx.strokeStyle = 'rgba(232,163,61,0.7)';
      ctx.lineWidth = Math.max(1, H * 0.02);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax + Math.cos(-aim) * reach, ay + Math.sin(-aim) * reach);
      ctx.stroke();
      ctx.restore();
    }

    // hearts (behind players)
    (m.hearts || []).forEach(function (ht) {
      var col = ht.team === 'red' ? RED : BLUE;
      var hx = px(ht.x), hy = py(ht.y);
      ctx.save();
      ctx.fillStyle = col;
      ctx.strokeStyle = 'rgba(12,8,5,0.8)';
      ctx.lineWidth = 1;
      heartPath(ctx, hx, hy, Math.max(3, H * 0.05));
      ctx.fill(); ctx.stroke();
      ctx.restore();
    });

    // pickups as small dots
    (m.items || []).forEach(function (it) {
      var c = { grenade: '#7fae55', medkit: '#f2e8d8', shield: '#6fa8d6', plasma: '#c77bd6' }[it.item] || AMBER;
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.arc(px(it.x), py(it.y), Math.max(1.4, H * 0.022), 0, Math.PI * 2);
      ctx.fill();
    });

    // players: team-tinted dots; the POV seat gets an amber ring; carriers a pip
    (m.players || []).forEach(function (p) {
      var col = p.team === 'red' ? RED : BLUE;
      var x = px(p.x), y = py(p.y);
      var r = Math.max(2, H * (p.self ? 0.045 : 0.035));
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(12,8,5,0.85)';
      ctx.stroke();
      if (p.self) {
        ctx.strokeStyle = AMBER;
        ctx.lineWidth = Math.max(1, H * 0.02);
        ctx.beginPath();
        ctx.arc(x, y, r + Math.max(2, H * 0.035), 0, Math.PI * 2);
        ctx.stroke();
      }
      if (p.carry) {
        ctx.fillStyle = AMBER;
        ctx.beginPath();
        ctx.arc(x, y - r - Math.max(2, H * 0.03), Math.max(1.2, H * 0.02), 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  function renderMismatch(s) {
    $('mmwarn').classList.toggle('on', s.mm >= 0);
  }

  // ============================================================
  //  Beats → surfaces  (§5)
  // ============================================================
  function applyEvent(e, s) {
    switch (e.k) {
      case 'kill': onKill(e, s); markBeat(e.t, 'kill'); beatPulse(); break;
      case 'steal': onSteal(e, s); markBeat(e.t, 'steal'); beatPulse(); break;
      case 'return': onReturn(e, s); beatPulse(); break;
      case 'capture': onCapture(e, s); markBeat(e.t, 'capture'); beatPulse(); break;
      case 'respawn': /* board rematerialize handles this visually */ break;
      case 'gameover': /* end-card is state-driven */ break;
      case 'phase': /* clock caption handles phase */ break;
    }
  }

  // Slots already drawn as the partner of a provable same-tick trade, so the
  // second half of the pair is suppressed (one linked row, not two). Keyed by
  // "tick:victimSlot"; a tiny ring is plenty since only same-tick pairs matter.
  var tradeConsumed = {};
  function onKill(e, s) {
    var killer = e.killer, victim = e.victim;
    var victimTeam = teamOf(s, victim);
    var killerTeam = killer >= 0 ? teamOf(s, killer) : null;
    var glyph = '▸';
    var badge = '';
    if (e.trade !== undefined && e.trade >= 0) {
      // Provable mutual trade: the server proved these two killed each other
      // this tick (the two killers ARE the two victims). Draw ONE linked row
      // with both names; skip the partner's own event so it isn't doubled.
      if (tradeConsumed[e.t + ':' + victim]) { delete tradeConsumed[e.t + ':' + victim]; return; }
      tradeConsumed[e.t + ':' + e.trade] = true;
      var row = document.createElement('div');
      row.className = 'feed-row';
      row.innerHTML = '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' +
        '<span class="glyph">⇄</span>' +
        '<span class="who ' + (teamOf(s, e.trade) || '') + '">' + esc(shortName(rosterName(s, e.trade))) + '</span>' +
        '<span class="badge">traded</span>';
      pushFeed(row);
      return;
    }
    var row = document.createElement('div');
    row.className = 'feed-row';
    if (e.amb) {
      // Same-tick multi-kill the sim can't pair (a 3-way pileup or two
      // independent kills). Attribution is honestly unknown (F7): show the
      // victim with a neutral marker, never a fabricated killer or "traded".
      badge = '<span class="badge">double KO</span>';
      row.innerHTML = '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' + badge;
    } else {
      if (e.tk) { badge = '<span class="badge tk">team kill</span>'; row.classList.add('flagkill'); }
      var killerName = killer >= 0 ? shortName(rosterName(s, killer)) : 'the arena';
      row.innerHTML = '<span class="who ' + (killerTeam || '') + '">' + esc(killerName) + '</span>' +
        '<span class="glyph">' + glyph + '</span>' +
        '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' + badge;
    }
    pushFeed(row);
  }

  function onSteal(e, s) {
    var heartTeam = e.flag; // the team whose heart was TAKEN (e.flag is the legacy event field)
    var thief = shortName(rosterName(s, e.by));
    banner((heartTeam === 'red' ? 'RED' : 'BLUE') + ' HEART TAKEN', 'steal ' + (heartTeam + '-accent'));
  }
  function onReturn(e, s) {
    var heartTeam = e.flag;
    banner((heartTeam === 'red' ? 'RED' : 'BLUE') + ' HEART RETURNED', 'returned ' + (heartTeam + '-accent'));
  }
  function onCapture(e, s) {
    var byTeam = teamOf(s, e.by);
    banner((byTeam === 'red' ? 'RED' : 'BLUE') + ' CAPTURES', 'wipe ' + (byTeam + '-accent'));
  }

  function teamOf(s, slot) {
    if (slot < 0 || !s.roster) return null;
    for (var i = 0; i < s.roster.length; i++) if (s.roster[i].s === slot) return s.roster[i].team;
    return null;
  }
  function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  // ---------- kill feed queue (fixed reserve, dwell floor) ----------
  var feedEl = $('killfeed');
  var MAX_FEED = 4;
  function pushFeed(row) {
    feedEl.insertBefore(row, feedEl.firstChild);
    while (feedEl.children.length > MAX_FEED) feedEl.removeChild(feedEl.lastChild);
    // Dwell floor (lever 2): a wall-clock minimum so the row reads even at 16×.
    var hold = dwellFloor('feed');
    // animFactor cap (lever 1): the slide-in duration never dips below its
    // read-time, so the row still overshoots-and-settles legibly at high speed.
    row.style.animationDuration = (250 / animFactor()) + 'ms';
    setTimeout(function () {
      if (row.parentNode) { row.classList.add('leaving'); setTimeout(function () { if (row.parentNode) row.parentNode.removeChild(row); }, 300); }
    }, hold);
  }
  function clearFeed() { feedEl.innerHTML = ''; }

  // ---------- banner lane queue (one at a time, min hold) ----------
  var bannerEl = $('bannerlane');
  var bannerQueue = [];
  var bannerBusy = false;
  function banner(text, cls) {
    bannerQueue.push({ text: text, cls: cls });
    pumpBanner();
  }
  function pumpBanner() {
    if (bannerBusy || !bannerQueue.length) return;
    bannerBusy = true;
    var b = bannerQueue.shift();
    var chip = document.createElement('div');
    chip.className = 'banner-chip ' + b.cls;
    chip.textContent = b.text;
    bannerEl.appendChild(chip);
    // lever 1 (animFactor cap): the pop-in never plays faster than 2x, so a
    // fast-forward scrub can't reduce a banner to a subliminal flash.
    chip.style.animationDuration = (300 / animFactor()) + 'ms';
    var hold = dwellFloor('banner'); // lever 2: wall-clock dwell floor (~1.9s)
    setTimeout(function () {
      chip.classList.add('leaving');
      setTimeout(function () {
        if (chip.parentNode) chip.parentNode.removeChild(chip);
        bannerBusy = false;
        pumpBanner();
      }, 260);
    }, hold);
  }
  function clearBanners() {
    bannerQueue = [];
    bannerEl.innerHTML = '';
    bannerBusy = false;
  }

  // ---------- scrubber beat markers ----------
  var scrubEl = $('scrub');
  function markBeat(tick, kind) {
    var mk = tick + '|' + kind;
    if (seenMarkers[mk]) return;
    seenMarkers[mk] = { tick: tick, kind: kind };
    pendingMarkers.push({ tick: tick, kind: kind });
  }
  var pendingMarkers = [];
  function renderBeatMarkers(st, mx) {
    if (!pendingMarkers.length) return;
    var span = Math.max(1, mx - st);
    pendingMarkers.forEach(function (m) {
      var el = document.createElement('div');
      el.className = 'beat-marker ' + m.kind;
      el.style.left = (Math.min(1, Math.max(0, (m.tick - st) / span)) * 100) + '%';
      scrubEl.appendChild(el);
    });
    pendingMarkers = [];
  }

  // ---------- momentum graph (lives-lead over the WHOLE timeline) ----------
  // A step line + difference shading on the SAME 0→maxTicks x-axis as the seek
  // track, so a point's x IS its tick. Positive = Red leads (red shading above
  // the even-lives midline), negative = Blue leads (blue below). Samples are
  // keyed by tick (dedup) and accumulate for the whole replay — NOT a scrolling
  // window — so the curve stays put while only the playhead moves across it.
  var VBW = 1000, VBH = 100, MID = 50; // SVG viewBox (preserveAspectRatio:none)
  var MOM_SVGNS = 'http://www.w3.org/2000/svg';
  var momentumSeen = {};            // tick -> true (dedup)
  var momentumDirty = true;         // rebuild the path only when a new tick lands
  var fullLeadSeries = null;        // full-match [{t,diff}] shipped once by the server
  function recordMomentum(s) {
    if (fullLeadSeries) return;     // full curve already known; nothing to accumulate
    if (s.ph !== 'playing' && s.ph !== 'gameover') return;
    if (momentumSeen[s.t]) return;  // deterministic replay: a tick's diff is fixed
    momentumSeen[s.t] = true;
    var tr = s.teams || {};
    var diff = ((tr.red && tr.red.lives) || 0) - ((tr.blue && tr.blue.lives) || 0);
    momentumSamples.push({ t: s.t, diff: diff });
    momentumDirty = true;
  }
  function renderMomentum() {
    var el = $('momentum');
    // Prefer the full precomputed series (spans the WHOLE timeline from frame 1);
    // fall back to accumulate-as-you-play only if the server didn't ship it.
    var samples = fullLeadSeries || momentumSamples;
    if (!lastState || !samples.length) { if (!samples.length) el.innerHTML = ''; return; }
    if (!momentumDirty && el.childNodes.length) return; // nothing new to draw
    momentumDirty = false;
    // Share the scrubber's trimmed [startTick, maxTick] axis so the momentum
    // curve lines up 1:1 with the playhead (the lobby prefix is flat/even and
    // carries no signal, so dropping it just removes dead leading space).
    var st = Math.max(0, lastState.st || 0);
    var mx = Math.max(st + 1, lastState.mx || 1);

    // Auto-scale to the match's ACTUAL peak lead so the swings fill the band
    // (a fixed ±24 scale squashed every real game — a 5-life lead barely lifted
    // off the midline). Each side of the even-lives midline scales on its OWN
    // extreme, so the biggest Red lead touches the top edge and the deepest Blue
    // lead touches the bottom — while 0 stays pinned at MID, keeping the red/blue
    // shading split honest. Floor at 1 so a dead-even match never divides by zero.
    var maxPos = 1, maxNeg = 1;
    samples.forEach(function (m) {
      if (m.diff > maxPos) maxPos = m.diff;
      if (-m.diff > maxNeg) maxNeg = -m.diff;
    });

    // Sort by tick and build a STEP series across the full [0, mx] axis.
    var pts = samples.slice().sort(function (a, b) { return a.t - b.t; });
    function xOf(t) { return Math.min(1, Math.max(0, (t - st) / (mx - st))) * VBW; }
    function yOf(d) { // 0 → MID; peak Red → top, peak Blue → bottom (2px inset)
      return d >= 0
        ? MID - (d / maxPos) * (MID - 2)
        : MID + (-d / maxNeg) * (MID - 2);
    }
    var line = '', k;
    for (k = 0; k < pts.length; k++) {
      var x = xOf(pts[k].t), y = yOf(pts[k].diff);
      if (k === 0) line += 'M ' + x.toFixed(1) + ' ' + y.toFixed(1);
      else line += ' H ' + x.toFixed(1) + ' V ' + y.toFixed(1); // step: hold then step
    }
    // Shaded area drops from the line to the midline and closes back.
    var lastX = xOf(pts[pts.length - 1].t);
    var area = line + ' L ' + lastX.toFixed(1) + ' ' + MID + ' L ' + xOf(pts[0].t).toFixed(1) + ' ' + MID + ' Z';

    el.setAttribute('viewBox', '0 0 ' + VBW + ' ' + VBH);
    el.innerHTML = '';
    var defs = document.createElementNS(MOM_SVGNS, 'defs');
    // Split fill: red above the midline, blue below — one gradient, hard stop.
    // userSpaceOnUse so the hard 50/50 split lands exactly on the midline
    // (y=MID) — red fills the region above it, blue below, wherever the curve is.
    defs.innerHTML =
      '<linearGradient id="momfill" gradientUnits="userSpaceOnUse" ' +
        'x1="0" y1="0" x2="0" y2="' + VBH + '">' +
      '<stop offset="0%" stop-color="' + RED + '" stop-opacity="0.8"/>' +
      '<stop offset="50%" stop-color="' + RED + '" stop-opacity="0.28"/>' +
      '<stop offset="50%" stop-color="' + BLUE + '" stop-opacity="0.28"/>' +
      '<stop offset="100%" stop-color="' + BLUE + '" stop-opacity="0.8"/>' +
      '</linearGradient>';
    el.appendChild(defs);
    // dark backing so the shading reads against a consistent ground, not the
    // flagstone floor showing through the transport gradient.
    var bg = document.createElementNS(MOM_SVGNS, 'rect');
    bg.setAttribute('x', 0); bg.setAttribute('y', 0);
    bg.setAttribute('width', VBW); bg.setAttribute('height', VBH);
    bg.setAttribute('fill', 'rgba(11,7,4,0.55)');
    el.appendChild(bg);
    // even-lives midline
    var mid = document.createElementNS(MOM_SVGNS, 'line');
    mid.setAttribute('x1', 0); mid.setAttribute('y1', MID);
    mid.setAttribute('x2', VBW); mid.setAttribute('y2', MID);
    mid.setAttribute('stroke', 'rgba(242,232,216,0.22)');
    mid.setAttribute('stroke-width', '0.8');
    el.appendChild(mid);
    var areaEl = document.createElementNS(MOM_SVGNS, 'path');
    areaEl.setAttribute('d', area);
    areaEl.setAttribute('fill', 'url(#momfill)');
    areaEl.setAttribute('stroke', 'none');
    el.appendChild(areaEl);
    var lineEl = document.createElementNS(MOM_SVGNS, 'path');
    lineEl.setAttribute('d', line);
    lineEl.setAttribute('fill', 'none');
    lineEl.setAttribute('stroke', PAPER);
    lineEl.setAttribute('stroke-width', '1.5');
    lineEl.setAttribute('stroke-opacity', '0.95');
    lineEl.setAttribute('vector-effect', 'non-scaling-stroke');
    el.appendChild(lineEl);
  }

  // ============================================================
  //  End-card (§5/§8) — the END SEGMENT: verdict, win condition and match
  //  stats, held on screen by the server for ~10s before a looping restart.
  //  Reads isDraw BEFORE winner (F4); names the key (F3).
  // ============================================================
  function endcardWinCondition(o) {
    // The condition CHIP: how the match ended, in two or three words.
    if (o.draw) return o.timeLimit ? 'TIME LIMIT — DRAW' : 'DRAW';
    if (o.timeLimit) {
      var winL = o.winner === 'red' ? o.redLives : o.blueLives;
      var loseL = o.winner === 'red' ? o.blueLives : o.redLives;
      return winL !== loseL ? 'TIME LIMIT — LIVES TIEBREAK' : 'TIME LIMIT — HEART PROGRESS';
    }
    var loserLives = o.winner === 'red' ? o.blueLives : o.redLives;
    return loserLives <= 0 ? 'ELIMINATION' : 'HEART CAPTURE';
  }

  function endcardOrder(a, b) {
    // Kills lead the board; fewer deaths, then captures, break ties.
    return (b.k || 0) - (a.k || 0) || (a.d || 0) - (b.d || 0) ||
      (b.cap || 0) - (a.cap || 0) || a.s - b.s;
  }

  function endcardBadge(cls, count, title) {
    // One honor icon; repeat events fold into a ·N suffix instead of stacking.
    if (!count) return '';
    return '<span class="ec-badge ' + cls + '" title="' + title + '">' +
      (count > 1 ? '·' + count : '') + '</span>';
  }

  function renderEndcardRows(s, team, el, mvpSlot) {
    // Final per-player stat lines, top killer first. The MVP (winning team's
    // best line) reads in amber — no star prefix, it would break the name
    // column's alignment. Clstr counts grenade/plasma multi-kill events; the
    // Cap column renders the captured enemy heart itself; a dagger icon marks
    // teammate kills.
    var rows = (s.roster || []).filter(function (p) { return p.team === team; })
      .slice().sort(endcardOrder);
    var enemyHeart = team === 'red' ? 'blue' : 'red';
    var html = '';
    rows.forEach(function (p) {
      var mvp = mvpSlot != null && p.s === mvpSlot;
      var marks = endcardBadge('bs', p.tk, 'Backstab — killed a teammate');
      var cluster = (p.mk2 || 0) + (p.mk3 || 0);
      html += '<div class="ec-row' + (mvp ? ' mvp' : '') + '">' +
        '<span class="pcell">' +
        '<span class="pname">' + esc(shortName(rosterName(s, p.s))) + '</span>' +
        marks +
        '</span>' +
        '<span class="n">' + (p.k || 0) + '</span>' +
        '<span class="n">' + (p.d || 0) + '</span>' +
        '<span class="n clstr">' + (cluster > 0 ? cluster : '') + '</span>' +
        '<span class="n cap">' + (p.cap > 0
          ? '<span class="ec-heart ' + enemyHeart + '" title="Captured the enemy heart"></span>'
          : '') + '</span>' +
        '</div>';
    });
    el.innerHTML = html;
  }

  function renderEndcard(s) {
    var card = $('endcard');
    if (!s.over) return;
    card.classList.add('on'); // own the frame at GameOver (§8) — before either verdict branch
    var o = s.over;

    // The loop countdown ticks every second while everything else is frozen,
    // so it renders unconditionally; the static content is keyed and only
    // rebuilt when the verdict frame actually changes (24fps hold, no churn).
    $('ec-replay').innerHTML = s.lp && s.hold > 0
      ? 'Replaying in <b>' + s.hold + '</b>' : '';

    var key = [s.mx, o.winner, o.draw, o.timeLimit, (s.roster || []).length].join('|');
    if (card._key === key) return;
    card._key = key;

    var head = $('ec-headline'), how = $('ec-how');
    var redL = o.redLives, blueL = o.blueLives;
    $('ec-red').textContent = redL;
    $('ec-blue').textContent = blueL;
    $('ec-wincond').textContent = endcardWinCondition(o);
    $('ec-tname-red').textContent = teamName(s, 'red', 'RED');
    $('ec-tname-blue').textContent = teamName(s, 'blue', 'BLUE');
    $('ec-team-red').classList.toggle('win', !o.draw && o.winner === 'red');
    $('ec-team-blue').classList.toggle('win', !o.draw && o.winner === 'blue');

    // MVP: the winning team's best final line (kills > fewer deaths >
    // captures — the capturer keeps their ⚑ mark, the star follows the guns).
    // A draw crowns nobody — the fidelity rules never invent a distinction the
    // sim didn't make (F4).
    var mvpSlot = null;
    if (!o.draw) {
      var winners = (s.roster || []).filter(function (p) { return p.team === o.winner; })
        .sort(endcardOrder);
      if (winners.length) mvpSlot = winners[0].s;
    }
    renderEndcardRows(s, 'red', $('ec-rows-red'), mvpSlot);
    renderEndcardRows(s, 'blue', $('ec-rows-blue'), mvpSlot);

    if (o.draw) {
      head.className = 'headline draw';
      head.textContent = 'DRAW — NO SCORE';
      how.textContent = o.timeLimit
        ? 'Time expired before a capture or a wipe — a scoreless draw, with no tiebreak on lives.'
        : 'The match ended with neither side scoring — no winner.';
      return;
    }

    var winner = o.winner; // 'red' | 'blue'
    var winName = teamName(s, winner, winner === 'red' ? 'RED' : 'BLUE');
    head.className = 'headline ' + winner;
    head.textContent = winName + ' WINS';

    if (o.timeLimit) {
      // Time-limit resolution — name the key and the values (F3).
      var winL = winner === 'red' ? redL : blueL;
      var loseL = winner === 'red' ? blueL : redL;
      if (winL !== loseL) {
        how.textContent = 'Time expired — ' + winName + ' held more lives (' + winL + ' vs ' + loseL + ').';
      } else {
        how.textContent = 'Time expired — lives tied; ' + winName + ' won on heart progress.';
      }
    } else {
      var loserLives = winner === 'red' ? blueL : redL;
      if (loserLives <= 0) {
        head.textContent = winName + ' WIPES OUT ' + teamName(s, winner === 'red' ? 'blue' : 'red', winner === 'red' ? 'BLUE' : 'RED');
        how.textContent = winName + ' eliminated every opposing life.';
      } else {
        how.textContent = winName + ' captured the enemy heart.';
      }
    }
  }

  // ============================================================
  //  Transport wiring — DOM controls emit the legacy chat chars +
  //  the ctf-side s:/v: whole-string commands.
  // ============================================================
  function togglePlay() { send(' '); }
  function setSpeed(s) {
    var map = { 1: '1', 2: '2', 3: '3', 4: '4', 8: '8', 16: '6' };
    if (map[s]) send(map[s]);
  }
  $('btn-play').addEventListener('click', togglePlay);
  $('btn-restart').addEventListener('click', function () { send(','); });
  $('btn-back').addEventListener('click', function () { send('b'); });
  $('btn-fwd').addEventListener('click', function () { send('.'); });
  $('btn-end').addEventListener('click', function () { send('e'); });
  $('btn-loop').addEventListener('click', function () { send('r'); });
  $('btn-skip').addEventListener('click', function () { send('f'); });

  // click-to-seek: map x-fraction to a tick and send s:<tick>
  $('scrub').addEventListener('click', function (ev) {
    if (!lastState || !lastState.en) return;
    var rect = this.getBoundingClientRect();
    var frac = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    // Map the click back onto the shown [startTick, maxTick] axis.
    var st = Math.max(0, lastState.st || 0);
    var mx = Math.max(st + 1, lastState.mx || 1);
    var tick = st + Math.round(frac * (mx - st));
    send('s:' + tick);
  });

  // pov clear
  $('povBadge').addEventListener('click', function () { send('v:-1'); });
  function togglePov(slot) {
    if (lastState && lastState.pov === slot) send('v:-1');
    else send('v:' + slot);
  }

  // keyboard shortcuts mirror the transport
  window.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;
    if (k === ' ') { ev.preventDefault(); togglePlay(); }
    else if (k === ',' || k === '<') send(',');
    else if (k === '.' || k === '>') send('.');
    else if (k === 'b') send('b');
    else if (k === 'e') send('e');
    else if (k === 'r') send('r');
    else if (k === 'f') send('f');
    else if (k === '+' || k === '=') send('+');
    else if (k === '-' || k === '_') send('-');
    else if (k >= '1' && k <= '9') send(k);
  });

  // Click a soldier on the board to select it (mirrors the squad-pip lens, but
  // for anyone visible on the arena). The board canvas draws ONLY the zoomable
  // map layer, letterboxed by broadcast_core; chrome (scoreboard, transport) are
  // HTML overlays, so a canvas click is always a MAP-space click. Invert the
  // core's letterbox transform to recover native map pixels, then hand them to
  // clickMap — the server hit-tests the soldier footprint and toggles selection.
  canvas.addEventListener('click', function (ev) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    // getBoundingClientRect is CSS px; the core's transform lives in the same
    // CSS space (offsetX/offsetY/scale are computed against clientWidth/Height,
    // NOT the dpr-scaled backing store), so no devicePixelRatio factor here.
    var cssX = ev.clientX - rect.left;
    var cssY = ev.clientY - rect.top;
    var t = core.getTransform();
    if (!t || !t.scale) return;
    var mapX = Math.round((cssX - t.offsetX) / t.scale);
    var mapY = Math.round((cssY - t.offsetY) / t.scale);
    // Ignore clicks in the letterbox bands (outside the drawn map).
    if (mapX < 0 || mapY < 0 || mapX >= t.nativeW || mapY >= t.nativeH) return;
    core.clickMap(mapX, mapY);
  });

  // ============================================================
  //  Fixed-aspect fit: size the composition to the board's native aspect
  //  inside the embed box, then scale the whole thing (board + overlays) as
  //  one unit. Chrome sizes off the STAGE width, so overlays stay locked to
  //  the graphics at any container shape (§2, L82 bounded-embed).
  // ============================================================
  function relayout() {
    var boxW = viewport.clientWidth, boxH = viewport.clientHeight;
    if (!boxW || !boxH) return;
    // The board region (game action) fits the board aspect into the box BETWEEN a
    // reserved top band (the scorebug) and bottom band (the transport), so neither
    // ever sits over play. Each band's pixel height depends on --hudscale (→ board
    // width) and the board fit depends on the bands, so iterate twice — the bands
    // are a small fraction of the height, so it converges immediately.
    var scorebug = document.getElementById('scorebug');
    var transport = document.getElementById('transport');
    var root = document.documentElement;
    var topBand = parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band = parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    var stageW = 0, stageH = 0;
    for (var pass = 0; pass < 2; pass++) {
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stageW = boardW; stageH = boardH + topBand + band;
      stage.style.width = stageW + 'px';
      stage.style.height = stageH + 'px';
      // One scale for the whole composition: chrome was authored against a
      // ~760px-wide reference board, so --hudscale is the board's on-screen width
      // over that reference (clamped so a huge featured embed doesn't bloat the
      // chrome and a tiny 360px floor stays legible).
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));
      stage.classList.toggle('tiny', boardW <= 620);
      // Measure each band's natural height → reserve exactly that.
      topBand = scorebug ? scorebug.offsetHeight : 0;
      band = transport ? transport.offsetHeight : 0;
      root.style.setProperty('--topband', topBand + 'px');
      root.style.setProperty('--band', band + 'px');
    }
    core.setViewportFit();
  }
  var ro = new ResizeObserver(relayout);
  ro.observe(viewport);
  window.addEventListener('resize', relayout);

  relayout();
  core.start();
})();
</script>
</body>
</html>
