@font-face {
  font-family: 'rajdhani';
  src: url('./font.ttf') format('truetype');
  font-display: block;
}

:root {
  --stage-lo: #16110d;
  --stage-hi: #241a12;
  --paper: #f2e8d8;
  --paper-dim: #b8ac98;
  --ink: #2a1f16;
  --ink-soft: rgba(20, 14, 9, 0.62);
  --red: #e0523a;
  --blue: #3f7cc4;
  --amber: #e8a33d;
  --ghost: #8a7f72;
  --hudscale: 1;
  /* chrome measures derive off the CONTAINER via --hudscale, not the viewport */
  --u: calc(1px * var(--hudscale));
  --pixfont: 'rajdhani', 'Segoe UI', system-ui, sans-serif;
  --finefont: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* The letterbox around the composition — warm near-black, NEVER pure #000.
     The Observatory embed hands us an arbitrary box; the fixed-aspect stage is
     centered inside it and this warm tone fills whatever is left over. */
  background: #120d09;
  color: var(--paper);
  font-family: var(--finefont);
  -webkit-font-smoothing: antialiased;
}

/* The embed box. The stage is ONE fixed-aspect composition centered inside it;
   board + every overlay live in the stage and scale together as a single unit
   (§2/L82: chrome sizes off the CONTAINER, not the viewport), so overlays never
   drift from the graphics at any embed size. */
#viewport {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#stage {
  position: relative;
  /* width/height are set in px by relayout() to the board's native aspect
     (1235:659) fitted into #viewport; the canvas fills it exactly (matching
     aspect → no internal letterbox) and all chrome is pinned in this space. */
  width: 100%;
  height: 100%;
  background:
    radial-gradient(120% 90% at 50% 38%, var(--stage-hi) 0%, var(--stage-lo) 72%);
  overflow: hidden;
}

/* The board fills the frame ABOVE the reserved transport band; broadcast_core
   letterboxes it to native aspect. --band is the bottom strip (set by relayout)
   where the transport lives, so no chrome ever sits over play. */
#board {
  position: absolute;
  left: 0;
  /* canvas is a replaced element: `inset` won't stretch it, so size explicitly.
     The board sits BETWEEN the reserved scorebug band (top) and transport band
     (bottom), so no chrome ever overlaps play. */
  top: var(--topband, 0px);
  width: 100%;
  height: calc(100% - var(--topband, 0px) - var(--band, 0px));
  display: block;
  image-rendering: pixelated;
}

/* A soft light pool focuses the eye on the arena (not a literal set). Matches
   the board area so it never darkens the reserved transport band below. */
#lightpool {
  position: absolute;
  inset: var(--topband, 0px) 0 var(--band, 0px) 0;
  pointer-events: none;
  background:
    radial-gradient(70% 58% at 50% 46%, transparent 40%, rgba(12, 8, 5, 0.34) 100%);
  z-index: 2;
}

/* CRT phosphor grain drift — ambient, paused under prefers-reduced-motion. */
#grain {
  position: absolute;
  inset: -20%;
  pointer-events: none;
  opacity: 0.05;
  z-index: 3;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0 1px, transparent 1px 3px);
  animation: graindrift 7s steps(4) infinite;
}
@keyframes graindrift { to { transform: translateY(3px); } }

#chrome {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  font-family: var(--pixfont);
}
#chrome > * { pointer-events: auto; }

/* ---------- 1. TOP-BAND SCOREBUG ---------- */
#scorebug {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: grid;
  /* minmax(0,1fr), NOT 1fr: a bare 1fr track floors at its content's min-content
     width, so a long team name would blow the side track out and shove the center
     clock off-center. minmax(0,…) lets each side shrink to 0 and clip via the
     name's own ellipsis at the TRUE track edge — the name then uses all the plate
     room there actually is, instead of an arbitrary hard cap. */
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: stretch;
  /* Shrink the whole scorebug group (names, lives numerals, labels, squad pips,
     clock) 20% by scaling the local unit — every measure below derives from --u,
     so one override rescales the band without touching per-element sizes. */
  --u: calc(1px * var(--hudscale) * 0.8);
  gap: calc(6 * var(--u));
  padding: calc(6 * var(--u)) calc(12 * var(--u)) calc(7 * var(--u));
  /* Dedicated top band: a solid warm-dark strip that lives ABOVE the board (its
     measured height = --topband, reserved by relayout), so the scorebug never
     covers play — grenades/players at the top rows stay fully visible. Mirrors
     the bottom transport band. */
  box-sizing: border-box;
  background: var(--stage-lo);
  box-shadow: inset 0 calc(-1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}

.plate {
  display: flex;
  align-items: center;
  gap: calc(9 * var(--u));
  min-width: 0;
}
.plate.blue { flex-direction: row-reverse; text-align: right; }

.plate .team-id { min-width: 0; }
.plate .team-name {
  font-family: var(--pixfont);
  font-size: calc(16 * var(--u));
  letter-spacing: 0.5px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* Inline with Lives + count on ONE row. Let the name shrink and ellipsis so a
     long policy name never pushes the label/count off the plate; the label and
     numeral hold their size. Full name still reads in the CARRYING line + roster.
     No max-width: the minmax(0,1fr) side track already bounds it, so the name
     grows to the full plate width and only ellipsizes when it genuinely runs out
     of room — not at an arbitrary early cap. */
  flex: 0 1 auto;
  min-width: 0;
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.plate.red .team-name { color: var(--red); }
.plate.blue .team-name { color: var(--blue); }

/* One baseline row with the COLOR NAME innermost (toward the center clock):
   left plate reads "32 LIVES RED", right plate reads "BLUE LIVES 32", so both
   names flank the clock. Red reverses; blue keeps DOM order (name → label → num). */
.plate .lives-line {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
}
.plate.red .lives-line { flex-direction: row-reverse; }
.lives-num {
  font-family: var(--pixfont);
  font-size: calc(20 * var(--u));
  line-height: 1;
  color: var(--paper);
  flex: none;
}
.lives-label {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
  flex: none;
}
/* Squad strip: ONE pip per player (8). Lit = alive, dim = down-but-has-lives,
   hollow = eliminated. The strip is the "who's left" read; the big numeral is
   the exact lives count. Each pip is clickable → POV lens (fog-honesty). */
.squad {
  display: flex;
  gap: calc(3 * var(--u));
  margin-top: calc(3 * var(--u));
}
.plate.blue .squad { justify-content: flex-end; }
.squad-pip {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  background: currentColor;
  opacity: 0.92;
  cursor: pointer;
  position: relative;
  transition: opacity 140ms, transform 140ms;
}
.squad-pip:hover { transform: translateY(calc(-1 * var(--u))); }
.squad-pip.down { opacity: 0.3; }                              /* dead, lives left */
.squad-pip.out {                                              /* eliminated */
  background: transparent;
  box-shadow: inset 0 0 0 calc(1.5 * var(--u)) currentColor;
  opacity: 0.28;
}
.squad-pip.carry {                                            /* has the flag */
  background: var(--amber);
  box-shadow: 0 0 calc(7 * var(--u)) var(--amber);
}
.squad-pip.pov {                                             /* POV lens active */
  box-shadow: 0 0 0 calc(1.5 * var(--u)) var(--paper);
}
.plate.red .squad { color: var(--red); }
.plate.blue .squad { color: var(--blue); }

/* flag-state icon — HOME (on pedestal) / TAKEN (riding a carrier). F2: two states only. */
.flagicon {
  position: relative;
  width: calc(26 * var(--u));
  height: calc(30 * var(--u));
  flex: none;
}
.flagicon svg { width: 100%; height: 100%; display: block; }
/* transform-box:fill-box so SVG transforms pivot about the cloth's own box,
   not the viewBox edge (else the flip mirrors off-screen — invisible-at-vote). */
.flagicon .cloth { transition: transform 90ms steps(3); transform-box: fill-box; transform-origin: left center; }
.flagicon.taken .cloth { transform: scaleX(0.62) skewX(-8deg); }
.flagicon.flip { animation: flagflip 260ms steps(3); transform-box: fill-box; transform-origin: center; }
@keyframes flagflip { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }
.flagicon .carrier-tag {
  position: absolute;
  bottom: calc(-11 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.08em;
  white-space: nowrap;
  color: var(--amber);
  text-transform: uppercase;
}

/* center clock pill + phase */
.clock {
  position: relative; /* anchors the fast-forward mini indicator */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: calc(3 * var(--u));
  padding-top: calc(1 * var(--u));
}
/* Tiny amber ▸▸ riding the right of the match clock while skip-lulls is
   actually fast-forwarding — the at-a-glance "time is compressed" cue. */
.ffwd-mini {
  display: none;
  position: absolute;
  left: calc(100% + 5 * var(--u));
  top: calc(6 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(12 * var(--u));
  color: var(--amber);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.ffwd-mini.show { display: block; }
.clock .time {
  font-family: var(--pixfont);
  /* The clock is the centerpiece: with the name folded into the lives row the
     side plates are one row shorter, so grow the time numeral into that freed
     vertical space and let it anchor the band. */
  font-size: calc(30 * var(--u));
  line-height: 1;
  color: var(--paper);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.clock .caption {
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper-dim);
  white-space: nowrap;
}
.clock.tiebreak-warn .time { color: var(--amber); }

/* Center column holds just the clock now — the capture-chase gauge was retired
   in favor of the two bottom carry indicators. */
.clock-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(4 * var(--u));
}

/* Clock pill soft tick — the third chrome ambient (§11). A near-imperceptible
   breathe on the pill, so the countdown reads as a live instrument, not a label. */
.clock.amb { animation: clocktick 2s ease-in-out infinite; }
@keyframes clocktick { 0%,100% { opacity: 0.94; } 50% { opacity: 1; } }

/* leader pulse when a team's lives lead is >=3 */
.plate.leader .lives-num { animation: leaderpulse 1.9s ease-in-out infinite; }
@keyframes leaderpulse { 0%,100% { text-shadow: none; } 50% { text-shadow: 0 0 calc(10 * var(--u)) var(--amber); } }

/* Beat-pause (§11): idle systems freeze the instant a beat lands, so ambient
   never competes with a kill/steal/capture for the eye. Applied on #stage; the
   engine-driven board (24Hz) is untouched — only chrome ambient pauses. */
#stage.beat-active .amb,
#stage.beat-active .plate.leader .lives-num { animation-play-state: paused; }

/* ---------- 3. BANNER LANE ---------- */
#bannerlane {
  position: absolute;
  top: calc(78 * var(--u));
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 12;
  min-height: calc(26 * var(--u)); /* reserved slot: layout never jumps */
}
.banner-chip {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.06em;
  padding: calc(6 * var(--u)) calc(14 * var(--u));
  color: var(--paper);
  background: var(--ink-soft);
  border-bottom: calc(3 * var(--u)) solid var(--amber);
  text-transform: uppercase;
  white-space: nowrap;
  animation: chippop 300ms cubic-bezier(.2,1.4,.4,1);
}
.banner-chip.steal { border-bottom-color: var(--amber); }
.banner-chip.returned { border-bottom-color: var(--paper-dim); }
.banner-chip.wipe { border-bottom-color: var(--red); font-size: calc(15 * var(--u)); }
.banner-chip.red-accent { box-shadow: inset calc(4 * var(--u)) 0 0 var(--red); }
.banner-chip.blue-accent { box-shadow: inset calc(4 * var(--u)) 0 0 var(--blue); }
.banner-chip.leaving { animation: chipfade 260ms ease-in forwards; }
@keyframes chippop { from { transform: translateY(calc(-8 * var(--u))) scale(0.9); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes chipfade { to { opacity: 0; transform: translateY(calc(-4 * var(--u))); } }

/* ---------- 2. KILL FEED ---------- */
#killfeed {
  position: absolute;
  /* Bottom-right, clear of the blue scorebug/roster (top) and the transport
     bar (bottom). column-reverse so the newest row sits lowest, nearest the
     transport, and older kills stack upward — a broadcast lower-third feed. */
  bottom: calc(76 * var(--u));
  right: calc(12 * var(--u));
  display: flex;
  flex-direction: column-reverse;
  gap: calc(4 * var(--u));
  align-items: flex-end;
  width: calc(228 * var(--u));
  min-height: calc(4 * 22 * var(--u)); /* fixed 4-row reserve */
  z-index: 11;
  /* Rows are display-only (no click handlers) — never let the feed intercept a
     drag meant for the PiP or the board beneath it. */
  pointer-events: none;
}
.feed-row {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  background: var(--ink-soft);
  font-family: var(--pixfont);
  /* A touch smaller than the scorebug type so full 8-char names stay compact;
     everything is in --u so the row scales with the board (responsive). */
  font-size: calc(8 * var(--u));
  line-height: 1;
  /* Size to content so full names never truncate; rows are right-anchored
     (align-items:flex-end on #killfeed) so a long row grows leftward — bounded
     by the small font + the pre-bounded 10-char name, so it can't run away. */
  max-width: none;
  white-space: nowrap;
  animation: feedin 250ms cubic-bezier(.2,1.3,.5,1);
}
.feed-row.leaving { animation: feedout 260ms ease-in forwards; }
@keyframes feedin { from { transform: translateX(calc(30 * var(--u))); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes feedout { to { opacity: 0; transform: translateX(calc(14 * var(--u))); } }
.feed-row .who { white-space: nowrap; }  /* names are pre-bounded to 10 chars by shortName(); show in full, never ellipsize */
.feed-row .who.red { color: var(--red); }
.feed-row .who.blue { color: var(--blue); }
.feed-row .glyph { color: var(--paper); font-size: calc(9 * var(--u)); }
.feed-row .badge {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: calc(1 * var(--u)) calc(4 * var(--u));
  color: var(--stage-lo);
  background: var(--amber);
}
.feed-row .badge.tk { background: var(--red); color: var(--paper); }
.feed-row .badge.carrier { background: var(--amber); }
.feed-row.flagkill { box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }

/* Roster rails removed: per-player state now rides the scorebug squad strip
   (the roster IS the counter, genre convention) and the board's own name tags.
   No floating bordered rails over the arena flanks (in-world, no HUD chrome). */

/* POV eye badge shown when a slot is inspected (fog-honesty lens) */
#povBadge {
  position: absolute;
  top: calc(64 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(9 * var(--u));
  background: var(--ink-soft);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--amber);
  z-index: 12;
  cursor: pointer;
}
#povBadge.on { display: flex; }

/* First-person PiP inset: pinned bottom-LEFT (the killfeed owns bottom-right, so
   they never overlap), responsive width (§2 — sized off the stage so it scales
   with the composition). Hidden until a seat is in POV. One quiet hairline
   frames it as a genuine window, not a decorative card. */
#fpv {
  position: absolute;
  left: calc(12 * var(--u));
  bottom: calc(64 * var(--u));
  /* Sized/positioned in px once dragged or resized; these are the defaults. */
  width: 30%;
  min-width: calc(150 * var(--u));
  max-width: calc(460 * var(--u));
  aspect-ratio: 3 / 2;
  display: none;
  z-index: 11;
  background: rgba(12, 9, 6, 0.42);
  box-shadow: 0 0 0 1px rgba(232, 163, 61, 0.34),
    0 calc(6 * var(--u)) calc(18 * var(--u)) rgba(8, 5, 3, 0.45);
  overflow: hidden;
  /* See-through so it never fully hides the arena beneath; grab anywhere to
     move, drag the corner grip to resize. */
  opacity: 0.82;
  cursor: grab;
  transition: opacity 0.12s ease;
}
#fpv.on { display: block; }
#fpv:hover { opacity: 0.97; }
#fpv.dragging, #fpv.resizing { cursor: grabbing; opacity: 0.99; }
#fpv.resizing { cursor: nwse-resize; }
/* Once dragged/resized we pin via left/top + explicit width and drop the
   left/bottom + aspect-ratio anchors so nothing fights. */
#fpv.moved { left: auto; bottom: auto; }
#fpv.sized { aspect-ratio: auto; max-width: none; min-width: 0; }
#fpv-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  pointer-events: none;   /* clicks fall through to the frame for dragging */
}
/* Resize grip: bottom-right corner (bottom-left is the screen edge when pinned
   bottom-left). The ONLY child that takes pointer events, so drag-to-move works
   everywhere else. */
.fpv-grip {
  position: absolute;
  right: 0; bottom: 0;
  width: calc(16 * var(--u));
  height: calc(16 * var(--u));
  cursor: nwse-resize;
  z-index: 5;
  background:
    linear-gradient(-45deg, transparent 40%, rgba(232, 163, 61, 0.55) 42%,
      rgba(232, 163, 61, 0.55) 46%, transparent 48%,
      transparent 58%, rgba(232, 163, 61, 0.55) 60%,
      rgba(232, 163, 61, 0.55) 64%, transparent 66%);
  opacity: 0.6;
}
.fpv-grip:hover { opacity: 1; }
.fpv-cap {
  position: absolute;
  left: calc(6 * var(--u));
  top: calc(4 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--amber);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  pointer-events: none;
  opacity: 0.85;
  z-index: 3;
}

/* Self-status HUD: a thin bottom bar reading like a soldier's own readout —
   name at the left, hp as pips, carried gear at the right. Sits over the floor
   half of the raycast so it never masks the horizon action. */
.fpv-hud {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  gap: calc(6 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  line-height: 1;
  color: var(--paper);
  background: linear-gradient(0deg, rgba(8, 5, 3, 0.82), rgba(8, 5, 3, 0));
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
  pointer-events: none;
  z-index: 3;
}
.fpv-name {
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45%;
}
.fpv-name.red { color: var(--red); }
.fpv-name.blue { color: var(--blue); }
.fpv-hp {
  display: inline-flex;
  gap: calc(2 * var(--u));
  align-items: center;
}
.fpv-hp i {
  width: calc(6 * var(--u));
  height: calc(6 * var(--u));
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 0 1px rgba(8, 5, 3, 0.7);
  display: inline-block;
}
.fpv-hp i.spent { background: rgba(242, 232, 216, 0.16); box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.28); }
.fpv-gear {
  margin-left: auto;
  display: inline-flex;
  gap: calc(4 * var(--u));
  color: var(--paper-dim);
  letter-spacing: 0.02em;
}
.fpv-gear .carry { color: var(--amber); font-weight: 600; }
.fpv-dead .fpv-hp, .fpv-dead .fpv-gear { opacity: 0.4; }

/* Un-fogged tactical minimap inset: top-right corner, arena aspect. Compact and
   see-through so it reads as an overlay on the raycast, not a lid over it. A
   quiet hairline frames it as a genuine window. pointer-events:none so grabbing
   it still drags the whole PiP. */
.fpv-map {
  position: absolute;
  top: calc(4 * var(--u));
  right: calc(4 * var(--u));
  width: 38%;
  aspect-ratio: 1235 / 659;
  background: rgba(8, 5, 3, 0.42);
  box-shadow: 0 0 0 1px rgba(232, 163, 61, 0.28);
  overflow: hidden;
  z-index: 2;
  opacity: 0.9;
  pointer-events: none;
}
.fpv-map canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}

/* ---------- 5. TRANSPORT ---------- */
#transport {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  /* Sits in the reserved band BELOW the board — relayout() measures this strip's
     natural height and reserves that much (--band) at the bottom of the frame, so
     the scrubber and buttons never overlap play. A solid warm-dark strip, not a
     fade — there is no arena underneath it to wash over. */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  padding: calc(8 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u));
  background: var(--stage-lo);
  box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(242, 232, 216, 0.06);
}
#transport.disabled { opacity: 0.35; pointer-events: none; }

/* scrubber: click-to-seek track (top) over a full-timeline momentum graph.
   The seek track and the momentum graph share the SAME 0→maxTicks x-axis, so
   the playhead crosses the graph 1:1 with the timeline (no scrolling window). */
.scrub {
  position: relative;
  height: calc(34 * var(--u));
  cursor: pointer;
}
.scrub-track {
  position: absolute;
  left: 0; right: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(242, 232, 216, 0.16);
}
.scrub-fill {
  position: absolute;
  left: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: var(--paper);
  width: 0;
}
.scrub-head {
  /* spans track + graph so the playhead reads against the momentum curve */
  position: absolute;
  top: calc(2 * var(--u));
  width: calc(3 * var(--u));
  height: calc(30 * var(--u));
  background: var(--amber);
  transform: translateX(calc(-1.5 * var(--u)));
  left: 0;
  z-index: 3;
}
/* Full-timeline lives-lead graph, occupying the band UNDER the seek track. */
.momentum {
  position: absolute;
  /* An inline <svg> is a REPLACED element: with width:auto it takes its
     intrinsic viewBox ratio (1000×100 = 10:1) × height, NOT the left/right
     box — so it renders ~10× its height wide (a short stub) instead of full
     width. Pin width:100% so it spans the whole seek track, matching the
     0→maxTicks x-axis the playhead rides. (preserveAspectRatio:none, so no
     letterboxing when we override the ratio.) */
  left: 0; width: 100%; top: calc(12 * var(--u));
  height: calc(22 * var(--u));
  display: block;
  overflow: visible;
}
.momentum-label {
  position: absolute;
  left: 0; top: calc(13 * var(--u));
  font-family: var(--finefont);
  font-size: calc(6 * var(--u));
  letter-spacing: 0.12em;
  color: var(--paper-dim);
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
}
.beat-marker {
  position: absolute;
  top: 0;
  width: calc(2 * var(--u));
  height: calc(10 * var(--u));
  transform: translateX(-1px);
  z-index: 2;
}
.beat-marker.kill { background: var(--paper-dim); }
.beat-marker.steal { background: var(--amber); }
.beat-marker.capture { background: var(--red); }

.tbar {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  flex-wrap: wrap;
}
.tbtn {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--paper);
  background: rgba(242, 232, 216, 0.08);
  border: none;
  padding: calc(5 * var(--u)) calc(8 * var(--u));
  min-width: calc(26 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.tbtn:hover { background: rgba(242, 232, 216, 0.2); }
.tbtn.on { color: var(--amber); box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }
.tbtn svg { width: calc(12 * var(--u)); height: calc(12 * var(--u)); display: block; fill: currentColor; }
.tsep { flex: 1; }
/* skip-lulls: dim shading over the quiet scrubber stretches, plus an amber
   "skipping" chip in the tbar while the server is actually fast-forwarding. */
.lull-span {
  position: absolute;
  top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(18, 13, 9, 0.6);
  pointer-events: none;
}
.ffwd-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--amber);
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.ffwd-chip.show { display: inline; }
.speedchips { display: flex; gap: calc(2 * var(--u)); }
.chip {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  background: rgba(242, 232, 216, 0.06);
  border: none;
  padding: calc(4 * var(--u)) calc(5 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.chip.on { color: var(--stage-lo); background: var(--amber); }
.tick-clock {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* hash-mismatch warning (top center) — honest fidelity flag */
#mmwarn {
  position: absolute;
  top: calc(40 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: calc(3 * var(--u)) calc(9 * var(--u));
  background: var(--red);
  color: var(--paper);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  z-index: 20;
}
#mmwarn.on { display: block; }

/* ---------- 6. END-CARD ---------- */
#endcard {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(12 * var(--u));
  background: radial-gradient(80% 70% at 50% 45%, rgba(16, 11, 7, 0.82), rgba(9, 6, 3, 0.95));
  z-index: 30;
  padding: calc(20 * var(--u));
  text-align: center;
}
#endcard.on { display: flex; animation: cardfade 420ms ease-out; }
@keyframes cardfade { from { opacity: 0; } to { opacity: 1; } }
#endcard .headline.red { color: var(--red); }
#endcard .headline.blue { color: var(--blue); }
#endcard .headline.draw { color: var(--ghost); }
#endcard .headline {
  font-family: var(--pixfont);
  font-size: calc(30 * var(--u));
  line-height: 1.05;
  color: var(--paper);
  text-shadow: 0 calc(3 * var(--u)) 0 var(--ink);
  /* headline now carries the (possibly long) policy name — never wrap/overflow */
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .how {
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.05em;
  color: var(--paper-dim);
  max-width: calc(360 * var(--u));
}
/* win-condition chip — names HOW the match ended (heart / elimination / time) */
#endcard .wincond {
  font-family: var(--pixfont);
  font-size: calc(10 * var(--u));
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber);
  padding: calc(3 * var(--u)) calc(10 * var(--u));
  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.5);
}
#endcard .how {
  margin-top: calc(-4 * var(--u));
}
/* match-stats scoreboard — one panel per team, winner ringed in amber */

#endcard .ec-team {
  width: calc(215 * var(--u));
  padding: calc(9 * var(--u)) calc(12 * var(--u));
  background: rgba(20, 14, 9, 0.55);
  box-shadow: inset 0 0 0 1px rgba(242, 232, 216, 0.12);
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  text-align: left;
}

  box-shadow: inset 0 0 0 1px rgba(232, 163, 61, 0.65),
    0 0 calc(14 * var(--u)) rgba(232, 163, 61, 0.18);
}
#endcard .ec-tname {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .ec-tname.red { color: var(--red); }
#endcard .ec-tname.blue { color: var(--blue); }

}

#endcard .ec-row {

/* loop countdown — present only while the server holds the end segment */
#endcard .ec-replay {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  min-height: calc(12 * var(--u));
}
#endcard .ec-replay b { color: var(--paper); font-variant-numeric: tabular-nums; }

/* connection status — fine print, lower-left */
#status {
  position: absolute;
  left: calc(10 * var(--u));
  bottom: calc(62 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ghost);
  z-index: 8;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
}
#status.show { opacity: 1; }

/* ============================================================
   The replay is ONE fixed-aspect composition (relayout() sizes #stage to the
   board's 1235:659 aspect inside the embed box), so there is no portrait/reflow
   case: at every container shape the board and its overlays scale together as a
   single unit and stay pinned. The only responsive lever is chrome DENSITY —
   `.tiny` eases the reserves so the 640×360 floor stays legible.
   ============================================================ */
/* very small floor (≤620px stage): tighten reserves */
#stage.tiny #killfeed { min-height: calc(3 * 20 * var(--u)); width: calc(190 * var(--u)); }
#stage.tiny .plate .squad-pip { width: calc(6 * var(--u)); height: calc(6 * var(--u)); }

@media (prefers-reduced-motion: reduce) {
  #grain, .clock.amb { animation: none; }
  .plate.leader .lives-num { animation: none; }
  .banner-chip, .feed-row { animation-duration: 1ms; }
}

/* ============================================================
   EMBED MODE — inside the League Replayer shell (?embed=1)
   The shell owns the walls + team headers + KDA + standings + transport, drawn
   from the postMessage frame stream. Here we show the board (the lit pit floor)
   PLUS the designed broadcast feedback layer that belongs over the play area —
   the kill feed and the flag-event banner lane (lower-third / center wipes).
   We hide only the chrome the shell re-draws (scorebug/transport) and the
   ambient light-pool/grain/status, and let the board fill the embed box.
   ============================================================ */
body[data-embed] #scorebug,
body[data-embed] #transport,
body[data-embed] #lightpool,
body[data-embed] #grain,
body[data-embed] #status { display: none !important; }
body[data-embed] #board { top: 0; height: 100%; }
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="board"></canvas>
  <div id="lightpool"></div>
  <div id="grain" class="amb"></div>

  <div id="chrome">
    <div id="scorebug">
      <div class="plate red" data-team="red">
        <div class="flagicon" id="flag-red"></div>
        <div class="team-id">
          <!-- One inline row: NAME · Lives · count (e.g. "RED Lives 32"). -->
          <div class="lives-line">
            <span class="team-name" id="name-red">RED</span>
            <span class="lives-label">Lives</span>
            <span class="lives-num" id="lives-red">—</span>
          </div>
          <!-- one pip per player (8): alive / down / eliminated. The roster IS
               the counter (Valorant/R6/Apex). Clickable → POV lens. -->
          <div class="squad" id="squad-red"></div>
        </div>
      </div>

      <div class="clock-col">
        <div class="clock amb" id="clock">
          <div class="time" id="clock-time">0:00</div>
          <span class="ffwd-mini" id="ffwd-mini">▸▸</span>
          <div class="caption" id="clock-caption">Warming up</div>
        </div>
      </div>

      <div class="plate blue" data-team="blue">
        <div class="flagicon" id="flag-blue"></div>
        <div class="team-id">
          <!-- One inline row, mirrored: count · Lives · NAME ("32 Lives BLUE"). -->
          <div class="lives-line">
            <span class="team-name" id="name-blue">BLUE</span>
            <span class="lives-label">Lives</span>
            <span class="lives-num" id="lives-blue">—</span>
          </div>
          <div class="squad" id="squad-blue"></div>
        </div>
      </div>
    </div>

    <div id="mmwarn">Replay hash mismatch — showing recorded inputs</div>
    <div id="povBadge">👁 POV lens — click to clear</div>
    <!-- First-person picture-in-picture: the selected seat's Wolfenstein-style
         raycast view, shown only while a player is in POV. A window into what
         that soldier sees down the barrel, riding alongside their top-down fog.
         Its own inset tactical map (bottom-left) shows the seat's position and
         vision cone against the WHOLE un-fogged arena, so the viewer always
         knows where the EYES are looking and standing. -->
    <div id="fpv">
      <canvas id="fpv-canvas"></canvas>
      <!-- Self-status HUD: this soldier's hp pips, lives, carried gear. -->
      <div class="fpv-hud" id="fpv-hud">
        <span class="fpv-name" id="fpv-name"></span>
        <span class="fpv-hp" id="fpv-hp"></span>
        <span class="fpv-gear" id="fpv-gear"></span>
      </div>
      <!-- Un-fogged tactical minimap: arena walls + all units + hearts + the
           POV seat's vision wedge. Full context, no fog of war. -->
      <div class="fpv-map" id="fpv-map">
        <canvas id="fpv-map-canvas"></canvas>
      </div>
      <div class="fpv-cap" id="fpv-cap">EYES</div>
      <!-- corner grip: drag to resize (bottom-right so it clears the screen edge
           when the PiP is pinned bottom-left) -->
      <div class="fpv-grip" id="fpv-grip" title="Drag to resize"></div>
    </div>
    <div id="bannerlane"></div>
    <div id="killfeed"></div>

    <div id="transport">
      <!-- Buttons on top, scrubber/timeline below (the transport sits in its own
           reserved band under the board, so nothing here overlaps play). -->
      <div class="tbar">
        <button class="tbtn" id="btn-restart" title="Restart (,)">⟲</button>
        <button class="tbtn" id="btn-back" title="Back one tick (b)">◂|</button>
        <button class="tbtn" id="btn-play" title="Play / pause (space)">▶</button>
        <button class="tbtn" id="btn-fwd" title="Skip +5s (.)">+5s</button>
        <button class="tbtn" id="btn-end" title="Jump to end (e)">|▸</button>
        <button class="tbtn" id="btn-loop" title="Loop (r)">↻</button>
        <button class="tbtn" id="btn-skip" title="Auto-skip lulls (f)">▸▸</button>
        <span class="ffwd-chip" id="ffwd-chip">▸▸ SKIPPING LULL</span>
        <span class="tick-clock" id="tick-clock">0 / 0</span>
        <span class="tsep"></span>
        <div class="speedchips" id="speedchips"></div>
      </div>
      <div class="scrub" id="scrub">
        <!-- momentum graph sits UNDERNEATH the seek track, on the SAME tick/mx
             axis, so the playhead crosses it 1:1 with the timeline -->
        <svg class="momentum" id="momentum" viewBox="0 0 1000 100"
             preserveAspectRatio="none" aria-hidden="true"></svg>
        <span class="momentum-label">LIVES LEAD</span>
        <div class="scrub-track"></div>
        <div class="scrub-fill" id="scrub-fill"></div>
        <!-- lull shading rides ABOVE track+fill so the quiet stretches read
             dimmed whether played or not; the amber head still wins (z:3) -->
        <div id="lulls"></div>
        <div class="scrub-head" id="scrub-head"></div>
      </div>
    </div>

    <div id="endcard">
      <div class="headline" id="ec-headline">—</div>
      <div class="wincond" id="ec-wincond"></div>
      <div class="how" id="ec-how"></div>
      <div class="ec-teams">
        <div class="ec-team" id="ec-team-red">
          <div class="ec-tname red" id="ec-tname-red">RED</div>
          <div class="ec-lives">
            <span class="fl-num red" id="ec-red">0</span>
            <span class="fl-cap">Lives left</span>
          </div>
          <div class="ec-thead"><span>Player</span><span>K</span><span>D</span><span>Clstr</span><span>Cap</span></div>
          <div id="ec-rows-red"></div>
        </div>
        <div class="ec-team" id="ec-team-blue">
          <div class="ec-tname blue" id="ec-tname-blue">BLUE</div>
          <div class="ec-lives">
            <span class="fl-num blue" id="ec-blue">0</span>
            <span class="fl-cap">Lives left</span>
          </div>
          <div class="ec-thead"><span>Player</span><span>K</span><span>D</span><span>Clstr</span><span>Cap</span></div>
          <div id="ec-rows-blue"></div>
        </div>
      </div>
      <div class="ec-replay" id="ec-replay"></div>
    </div>
  </div>

  <div id="status">connecting</div>
</div>
</div>

<!-- BROADCAST_CORE -->

<script>
(function () {
  'use strict';

  // ---- palette (mirrors board tints so chrome matches the arena) ----
  var RED = '#e0523a', BLUE = '#3f7cc4', AMBER = '#e8a33d', PAPER = '#f2e8d8';

  // ---- eye-level cog art for the EYES PiP billboards ----
  // The PiP is an eye-level raycaster, so its billboards need art drawn from a
  // HORIZONTAL camera: soldier_{red,blue}_front.png is the real cog standing on
  // its wheels, square to the viewer, with the cyan smile visor tilted up toward
  // the camera (built by scripts/art/build_cvc_front.py, served as a static PNG).
  //
  // The plain soldier_{red,blue}.png masters are the TOP-DOWN BOARD sprites (the
  // cog as seen from ABOVE). Blitting those here is what made a near cog read as
  // a flat team-coloured plate with the smile squashed onto its bottom edge —
  // "a head on the ground". No trim or pose math fixes that; it is the wrong
  // camera. They stay only as the pre-load fallback, ranked behind the front art.
  //
  // Loaded once; drawFpvEntity blits the matching team image scaled to the
  // projected figure so distant cogs shrink like everything else.
  var COG_ART = { red: new Image(), blue: new Image() };
  COG_ART.red.src = '/client/soldier_red_front.png';
  COG_ART.blue.src = '/client/soldier_blue_front.png';
  function cogArtReady(img) { return img && img.complete && img.naturalWidth > 0; }
  // The front masters are trimmed to their opaque box at build time and carry NO
  // baked drop shadow (the billboard draws its own contact shadow), so the whole
  // image IS the cog — a full-frame trim, unlike the top-down master which bakes
  // a soft shadow into its right third and needs the box cut out.
  var COG_TRIM = { x: 0, y: 0, w: 1, h: 1 };
  var COG_ASPECT = 180 / 192;   // 0.9375 — w/h of the front master (build script prints it)
  // Offscreen scratch for depth-dimming the cog sprite: draw the art in, then
  // darken with a source-atop ink wash so ONLY the sprite pixels dim (never the
  // floor/walls already painted behind it). Reused across draws.
  var cogScratch = document.createElement('canvas'), cogScratchCtx = null;
  var SPEEDS = [1, 2, 3, 4, 8, 16];
  var FPS = 24;

  // Two independent tempo levers (§11, L20):
  //  (1) ANIM_MAX_FACTOR — chrome beat animations never play faster than this
  //      no matter the replay speed, so feed rows / flips / banners keep their
  //      read time at 8-16×. Applied as an animationFactor cap on durations.
  //  (2) DWELL_FLOOR_MS — a beat's on-screen hold has a wall-clock minimum
  //      (feed row / banner / curtain), collapsing only the dead time between
  //      contacts. These are NOT one speed knob — one caps motion, one floors dwell.
  var ANIM_MAX_FACTOR = 2;
  var DWELL_FLOOR_MS = { feed: 2600, banner: 1900, curtain: 2400, read: 600 };
  function animFactor() {
    // Lever 1 — the chrome plays at min(replaySpeed, cap): at 16× the board flies
    // but a kill row still slides in at 2×-equivalent so a human can read it.
    var sp = (lastState && lastState.sp) || 1;
    return Math.min(sp, ANIM_MAX_FACTOR);
  }
  function dwellFloor(kind) {
    // Lever 2 — a beat's on-screen hold has a wall-clock minimum regardless of
    // replay speed; speed collapses only the dead time between contacts, never
    // the read time of a beat itself. Independent of the animFactor cap.
    return DWELL_FLOOR_MS[kind] || DWELL_FLOOR_MS.read;
  }
  // Beat-pause (§11): freeze chrome ambient the instant a beat lands so idle
  // life never competes with a kill/steal/capture. Held for the READ_PAUSE floor
  // (≥600ms wall-clock), then released. The board's own 24Hz is never touched.
  var beatPulseTimer = null;
  function beatPulse() {
    stage.classList.add('beat-active');
    if (beatPulseTimer) clearTimeout(beatPulseTimer);
    beatPulseTimer = setTimeout(function () {
      stage.classList.remove('beat-active');
      beatPulseTimer = null;
    }, dwellFloor('read'));
  }

  var $ = function (id) { return document.getElementById(id); };
  var viewport = $('viewport');
  var stage = $('stage');
  var canvas = $('board');
  var statusEl = $('status');

  // ---- embed mode (League Replayer) ----------------------------------------
  // When loaded inside the League Replayer shell (?embed=1), this client renders
  // ONLY the board (its own scorebug/transport/feed chrome is hidden by CSS via
  // body[data-embed]) and streams each parsed state frame up to the parent shell
  // over postMessage. The shell owns the walls + scorebug + KDA + standings and
  // draws them from this stream, so there is ONE websocket / ONE transport /
  // perfect tick-sync between the embedded game and the wall HUD.
  var EMBED = false;
  try { EMBED = new URLSearchParams(location.search).get('embed') === '1'; } catch (e) {}
  if (EMBED) document.body.setAttribute('data-embed', '1');
  function postToShell(type, payload) {
    if (!EMBED || window.parent === window) return;
    try { window.parent.postMessage({ src: 'ctf-replay', type: type, data: payload }, '*'); } catch (e) {}
  }

  // The whole replay is ONE fixed-aspect composition locked to the board's
  // native size (sim.nim MapWidth×MapHeight = 1235×659). The stage is sized to
  // this aspect inside the embed box and every overlay scales with it, so the
  // chrome can never drift off the graphics regardless of the Observatory
  // container's shape (§2 real-container-target, L82 bounded-embed).
  var BOARD_W = 1235, BOARD_H = 659;
  var BOARD_ASPECT = BOARD_W / BOARD_H;

  // ---- flag icon svg (HOME/TAKEN are the only two states — F2) ----
  function buildFlag(el, color) {
    el.innerHTML =
      '<svg viewBox="0 0 26 30" aria-hidden="true">' +
      '<rect x="4" y="2" width="2" height="26" fill="#2a1f16"/>' +
      '<g class="cloth"><path d="M6 3 L22 3 L18 9 L22 15 L6 15 Z" fill="' + color + '"/></g>' +
      '<rect x="1" y="26" width="10" height="3" fill="#8a7f72"/>' +
      '</svg>' +
      '<div class="carrier-tag"></div>';
  }
  buildFlag($('flag-red'), RED);
  buildFlag($('flag-blue'), BLUE);

  // ---- speed chips ----
  var speedChipsEl = $('speedchips');
  var speedChipEls = {};
  SPEEDS.forEach(function (s) {
    var b = document.createElement('button');
    b.className = 'chip';
    b.textContent = s + '×';
    b.setAttribute('aria-label', s + 'x speed');
    b.addEventListener('click', function () { setSpeed(s); });
    speedChipsEl.appendChild(b);
    speedChipEls[s] = b;
  });

  // ---- core (board renderer + WS) ----
  var lastState = null;
  var replayAdapter = window.CtfStaticReplay || null;
  var core = window.BroadcastCore.create({
    canvas: canvas,
    onText: function (txt) { onFrame(txt); },
    onStatus: function (st) { onStatus(st); },
    onFirstFrame: function () { core.setViewportFit(); },
    websocket: !replayAdapter,
    onSendPacket: replayAdapter ? function (bytes) {
      replayAdapter.sendPacket(bytes);
    } : null
  });
  if (replayAdapter) replayAdapter.attachCore(core);

  function send(cmd) { core.sendCommand(cmd); }

  // Transport commands relayed DOWN from the League Replayer shell (embed mode):
  // the shell's wall-mounted transport buttons/scrubber postMessage a command
  // string, which we forward to the single shared replay websocket. Same command
  // vocabulary the local transport uses, so the shell drives playback 1:1.
  if (EMBED) {
    window.addEventListener('message', function (ev) {
      var m = ev.data;
      if (!m || m.src !== 'ctf-shell') return;
      if (m.type === 'cmd' && typeof m.cmd === 'string') send(m.cmd);
      else if (m.type === 'seek' && m.tick != null) send('s:' + m.tick);
      else if (m.type === 'pov' && m.slot != null) send('v:' + m.slot);
    });
  }

  function onStatus(st) {
    statusEl.textContent = st;
    statusEl.classList.toggle('show', st !== 'open');
    if (st === 'open') {
      // Opt in to the JSON chrome channel (REPLAY-ONLY; legacy client never sends this).
      send('hud:on');
    }
  }

  // ============================================================
  //  Frame ingest
  // ============================================================
  var lastTick = -1;
  var seenMarkers = {}; // tick|kind -> true, for scrubber beat markers
  var momentumSamples = []; // {t, diff}
  var lastFf = false;   // previous frame's fast-forward flag (jump detection)
  var lullSpans = null; // full-match [[a,b]] quiet spans, shipped once
  var lullsRendered = false;

  function onFrame(txt) {
    var s;
    try { s = JSON.parse(txt); } catch (e) { return; }
    lastState = s;

    // Stream the parsed frame to the League Replayer shell (embed mode). The
    // shell reads roster/KDA, clock, lives, flags and pov straight off this to
    // paint the wall-mounted scorebug + KDA tables in lockstep with the board.
    postToShell('frame', s);

    // Detect a jump (seek/loop): clear transient beats so nothing phantoms.
    // A skip-lulls fast-forward frame legitimately advances up to 64 ticks
    // (this frame or the previous one, which may have crossed OUT of the
    // lull), so widen the expected stride accordingly instead of misreading
    // the boost as a seek.
    var stride = (s.ff || lastFf) ? Math.min((s.sp || 1) * 8, 64) : (s.sp || 1);
    var jumped = (s.t < lastTick) || (lastTick >= 0 && s.t - lastTick > stride * 4 + 2);
    if (jumped) { clearFeed(); clearBanners(); }
    lastFf = !!s.ff;

    renderScorebug(s);
    renderClock(s);
    renderTransport(s);
    renderPov(s);
    renderMismatch(s);

    if (s.events && s.events.length && !jumped) {
      for (var i = 0; i < s.events.length; i++) applyEvent(s.events[i], s);
    }
    // Even on a jump, register beat markers we can place from state? Markers
    // come from events only; on a jump the tracker resync'd (no events), so we
    // keep whatever markers we already collected.
    ingestLeadSeries(s);
    ingestFpMap(s);
    ingestLullSpans(s);
    recordMomentum(s);

    if (s.ph === 'gameover') { renderEndcard(s); }
    else { $('endcard').classList.remove('on'); }

    lastTick = s.t;
  }

  // The server ships the full-match lives-lead change-point series ONCE (on the
  // first HUD frame). Cache it so the momentum graph draws its whole-timeline
  // shape immediately, with the playhead riding across a curve that's already
  // there — a broadcast win-probability graph, not a line that grows as it plays.
  function ingestLeadSeries(s) {
    if (!s.lead || fullLeadSeries) return;
    fullLeadSeries = s.lead.map(function (p) { return { t: p[0], diff: p[1] }; });
    momentumDirty = true;
  }

  // The lull spans ride the same first HUD frame. Cache them once; the
  // scrubber shades them so "the grayed stretches are what ▸▸ skips" is
  // visible before ever toggling the mode.
  function ingestLullSpans(s) {
    if (!s.lulls || lullSpans) return;
    lullSpans = s.lulls;
  }

  // The server ships the static minimap wall silhouette ONCE (RLE of a coarse
  // floor/stone/glass grid). Decode it into an offscreen canvas keyed to the
  // arena, so the tactical map blits terrain in one drawImage per frame instead
  // of re-rasterizing the grid. Cached for the whole match.
  var fpMapMeta = null, fpMapBaked = null;
  function ingestFpMap(s) {
    if (!s.fpmap || fpMapBaked) return;
    var m = s.fpmap, gw = m.gw, gh = m.gh, rle = m.rle || [];
    var off = document.createElement('canvas');
    off.width = gw; off.height = gh;
    var octx = off.getContext('2d');
    var img = octx.createImageData(gw, gh);
    var data = img.data;
    // Palette: floor = transparent (the inset's own dark shows through), stone =
    // warm slate, glass = pale translucent pane so see-through cover reads.
    var pal = [
      [0, 0, 0, 0],            // 0 floor
      [92, 78, 62, 235],       // 1 stone
      [150, 172, 178, 150]     // 2 glass
    ];
    var cell = 0;
    for (var k = 0; k + 1 < rle.length; k += 2) {
      var st = rle[k], run = rle[k + 1], c = pal[st] || pal[0];
      for (var r = 0; r < run; r++) {
        var p = (cell + r) * 4;
        data[p] = c[0]; data[p + 1] = c[1]; data[p + 2] = c[2]; data[p + 3] = c[3];
      }
      cell += run;
    }
    octx.putImageData(img, 0, 0);
    fpMapMeta = { w: m.w, h: m.h, gw: gw, gh: gh };
    fpMapBaked = off;
  }

  // ---------- scorebug ----------
  // One pip per PLAYER (8), keyed by stable join slot: lit = alive, dim = down
  // but has lives left, hollow = eliminated. The strip is the "who's left"
  // read (the roster IS the counter); the numeral is the exact lives count.
  // Each pip is clickable → POV lens. NEVER shows kills (F1: kills ≠ score).
  function renderSquad(el, players, pov) {
    var key = players.map(function (p) { return p.s; }).join(',');
    if (el._key !== key) {
      el.innerHTML = ''; el._pips = {};
      players.forEach(function (p) {
        var pip = document.createElement('span');
        pip.className = 'squad-pip';
        pip.title = shortName(p.name);
        pip.addEventListener('click', function () { togglePov(p.s); });
        el.appendChild(pip);
        el._pips[p.s] = pip;
      });
      el._key = key;
    }
    players.forEach(function (p) {
      var pip = el._pips[p.s];
      if (!pip) return;
      var eliminated = !p.alive && p.lives <= 0;
      pip.classList.toggle('down', !p.alive && p.lives > 0);
      pip.classList.toggle('out', eliminated);
      pip.classList.toggle('carry', !!p.carry);
      pip.classList.toggle('pov', pov === p.s);
    });
  }

  function renderScorebug(s) {
    var tr = s.teams || {};
    var red = tr.red || {}, blue = tr.blue || {};
    var rl = red.lives || 0, bl = blue.lives || 0;

    setName('name-red', teamName(s, 'red', 'RED'));
    setName('name-blue', teamName(s, 'blue', 'BLUE'));

    $('lives-red').textContent = rl;
    $('lives-blue').textContent = bl;

    // squad pips per team (one per player), sorted by stable join slot
    var reds = [], blues = [];
    (s.roster || []).forEach(function (p) { (p.team === 'red' ? reds : blues).push(p); });
    reds.sort(function (a, b) { return a.s - b.s; });
    blues.sort(function (a, b) { return a.s - b.s; });
    renderSquad($('squad-red'), reds, s.pov);
    renderSquad($('squad-blue'), blues, s.pov);

    updateFlag('flag-red', 'red', red, s);
    updateFlag('flag-blue', 'blue', blue, s);

    // leader pulse when lead >= 3
    var rp = document.querySelector('.plate.red');
    var bp = document.querySelector('.plate.blue');
    rp.classList.toggle('leader', rl - bl >= 3 && s.ph === 'playing');
    bp.classList.toggle('leader', bl - rl >= 3 && s.ph === 'playing');
  }

  function teamName(s, team, fallback) {
    // The scorebug headline is the POLICY name, not the color (the plate color +
    // board already say which side is which). In a hosted league every player on
    // a side is the SAME policy, so the whole team shares one name — show it.
    // In local self-play each baseline bot has a distinct generated name
    // (Player1, Player2, …) with no shared identity, so fall back to the color
    // label rather than pinning the whole team to one arbitrary bot.
    if (!s.roster) return fallback;
    var name = null, mixed = false;
    for (var i = 0; i < s.roster.length; i++) {
      var p = s.roster[i];
      if (p.team !== team) continue;
      // Strip the per-seat " (N)" suffix the hosted runtime appends to the SAME
      // policy's multiple connections ("softmaxwell (2)", "softmaxwell (7)"…) so
      // every seat of one policy collapses to a single shared name here. The
      // killfeed shows the full per-seat name (it colors names per event and
      // never compares them); the headline needs one shared identity, and this
      // suffix was tripping the "mixed" check and pinning the header to RED/BLUE.
      // Distinct local self-play names (Player1, Player2) carry no such suffix,
      // so they still differ and correctly fall back to the color.
      var nm = String(p.name || '').replace(/\s*\(\d+\)\s*$/, '');
      if (name === null) name = nm;
      else if (nm !== name) { mixed = true; break; }
    }
    if (name === null || mixed || name === '') return fallback;
    return teamHeadline(name);
  }
  function teamHeadline(n) {
    // Format a policy identity for the scorebug headline: drop any host:port
    // suffix, restore the spaces the server encodes as underscores, and let the
    // plate's CSS ellipsis clip anything still too wide (no hard char cut, so a
    // full name reads whole when it fits).
    n = String(n || '');
    var at = n.indexOf('@'); if (at > 0) n = n.slice(0, at);
    n = n.replace(/_/g, ' ').trim();
    return (n || '?').toUpperCase();
  }
  function setName(id, txt) { var el = $(id); if (el.textContent !== txt) el.textContent = txt; }

  function updateFlag(id, team, tstate, s) {
    var el = $(id);
    var taken = tstate.flag === 'taken';
    var was = el.classList.contains('taken');
    el.classList.toggle('taken', taken);
    if (was !== taken) { el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); }
    var tag = el.querySelector('.carrier-tag');
    if (tag) {
      if (taken && tstate.carrier >= 0) {
        tag.textContent = shortName(rosterName(s, tstate.carrier));
      } else { tag.textContent = ''; }
    }
  }

  function rosterName(s, slot) {
    if (!s.roster) return '#' + slot;
    for (var i = 0; i < s.roster.length; i++) {
      if (s.roster[i].s === slot) return s.roster[i].name || ('#' + slot);
    }
    return '#' + slot;
  }
  function shortName(n) {
    n = String(n || '');
    // Names are player addresses; keep them short + readable.
    var at = n.indexOf('@'); if (at > 0) n = n.slice(0, at);
    if (n.length > 10) n = n.slice(0, 10);
    return n || '?';
  }

  // ---------- clock ----------
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), r = sec % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function renderClock(s) {
    var timeEl = $('clock-time'), capEl = $('clock-caption'), clk = $('clock');
    if (s.ph === 'lobby') {
      timeEl.textContent = s.lob > 0 ? (':' + (s.lob < 10 ? '0' : '') + s.lob) : '--';
      capEl.textContent = s.lob > 0 ? 'Starting in' : 'Waiting for players';
      clk.classList.remove('tiebreak-warn');
    } else if (s.ph === 'gameover') {
      timeEl.textContent = 'FINAL';
      capEl.textContent = 'Game over';
      clk.classList.remove('tiebreak-warn');
    } else {
      // Playing: an HONEST countdown to the scheduled draw limit, not to the
      // replay's end. The game is scheduled to end at absolute tick st + mt
      // (gameStartTick + maxTicks, the scoreless-draw ceiling); the clock counts
      // down to that. A game decided early by a capture or wipe FREEZES the
      // clock at whatever was left and flips to FINAL — so a nonzero freeze
      // reads as "ended it early", and only a genuine grind to the limit ever
      // reaches 0:00. (Old behavior pinned the end to mx = the replay's last
      // tick, so every game counted to zero and the race-to-zero was an
      // artifact.) When no limit is configured (mt <= 0) there is no scheduled
      // end to count toward, so fall back to the replay span.
      var end = (s.mt && s.mt > 0) ? ((s.st || 0) + s.mt) : s.mx;
      var remain = Math.max(0, (end - s.t)) / FPS;
      timeEl.textContent = fmt(remain);
      capEl.textContent = 'Time left';
      clk.classList.toggle('tiebreak-warn', remain <= 30);
    }
  }

  // ---------- transport ----------
  function renderTransport(s) {
    $('transport').classList.toggle('disabled', !s.en);
    var playBtn = $('btn-play');
    playBtn.textContent = s.pl ? '❘❘' : '▶';
    $('btn-loop').classList.toggle('on', !!s.lp);
    $('btn-skip').classList.toggle('on', !!s.sk);
    $('ffwd-chip').classList.toggle('show', !!s.ff);
    $('ffwd-mini').classList.toggle('show', !!s.ff);

    // speed chips
    SPEEDS.forEach(function (sp) { speedChipEls[sp].classList.toggle('on', sp === s.sp); });

    // scrubber. The x-axis skips the dead lobby: it spans [startTick, maxTick]
    // so tick 0 on-screen is the first frame of actual play, not "WAITING FOR
    // PLAYERS". All the derived geometry (fill, head, clock, beats, momentum)
    // shares this offset origin.
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    var span = mx - st;
    var frac = Math.min(1, Math.max(0, (s.t - st) / span));
    $('scrub-fill').style.width = (frac * 100) + '%';
    $('scrub-head').style.left = (frac * 100) + '%';
    $('tick-clock').textContent = Math.max(0, s.t - st) + ' / ' + span;

    renderBeatMarkers(st, mx);
    renderLullSpans(st, mx);
    renderMomentum();
  }

  // Shade the precomputed quiet stretches on the seek track. Spans are static
  // per replay, so this renders once when they arrive.
  function renderLullSpans(st, mx) {
    if (!lullSpans || lullsRendered) return;
    lullsRendered = true;
    var span = Math.max(1, mx - st);
    var box = $('lulls');
    lullSpans.forEach(function (p) {
      var el = document.createElement('div');
      el.className = 'lull-span';
      var a = Math.min(1, Math.max(0, (p[0] - st) / span));
      var b = Math.min(1, Math.max(0, (p[1] - st) / span));
      el.style.left = (a * 100) + '%';
      el.style.width = ((b - a) * 100) + '%';
      box.appendChild(el);
    });
  }

  // ---------- pov + mismatch ----------
  function renderPov(s) {
    var badge = $('povBadge');
    badge.classList.toggle('on', s.pov >= 0);
    if (s.pov >= 0) badge.textContent = '👁 POV: ' + shortName(rosterName(s, s.pov)) + ' — click to clear';
    renderFpv(s);
  }

  // First-person picture-in-picture: draw the selected seat's raycast view into
  // the bottom-right inset. Wolfenstein-style — each column is one wall slice
  // whose height is inversely proportional to distance (walls are "full-screen
  // high" so an enemy running across the mouth of a lane reads as a figure
  // sweeping between wall faces), with billboarded soldiers/hearts drawn on top.
  var fpvEl = $('fpv'), fpvCanvas = $('fpv-canvas'), fpvCtx = null;

  // Drag-to-reposition the first-person inset. Grab it anywhere; we pin via
  // left/top (dropping the right/bottom anchor) and clamp inside the stage so it
  // can never be dragged off-screen. Purely a viewer convenience — no state sent.
  // Drag the inset anywhere to reposition; drag the corner grip to resize. The
  // FPV keeps a 3:2 aspect on resize. Both pin via left/top+width once used, so
  // the CSS right/bottom/aspect anchors are dropped. Purely a viewer convenience.
  (function makeFpvInteractive() {
    var grip = $('fpv-grip');
    var mode = null;                       // 'move' | 'resize' | null
    var startX = 0, startY = 0, baseLeft = 0, baseTop = 0, baseW = 0, baseH = 0;
    var FPV_ASPECT = 3 / 2, MINW = 150;

    function beginPin() {
      var rect = fpvEl.getBoundingClientRect();
      var host = (fpvEl.offsetParent || document.body).getBoundingClientRect();
      baseLeft = rect.left - host.left;
      baseTop = rect.top - host.top;
      baseW = rect.width; baseH = rect.height;
      fpvEl.classList.add('moved', 'sized');
      fpvEl.style.left = baseLeft + 'px';
      fpvEl.style.top = baseTop + 'px';
      fpvEl.style.width = baseW + 'px';
      fpvEl.style.height = baseH + 'px';
    }

    grip.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0) return;
      beginPin();
      mode = 'resize';
      startX = ev.clientX; startY = ev.clientY;
      fpvEl.classList.add('resizing');
      grip.setPointerCapture(ev.pointerId);
      ev.preventDefault(); ev.stopPropagation();
    });

    fpvEl.addEventListener('pointerdown', function (ev) {
      if (ev.button !== 0 || mode) return;
      beginPin();
      mode = 'move';
      startX = ev.clientX; startY = ev.clientY;
      fpvEl.classList.add('dragging');
      fpvEl.setPointerCapture(ev.pointerId);
      ev.preventDefault();
    });

    function onMove(ev) {
      if (!mode) return;
      var host = (fpvEl.offsetParent || document.body).getBoundingClientRect();
      if (mode === 'move') {
        var nx = baseLeft + (ev.clientX - startX);
        var ny = baseTop + (ev.clientY - startY);
        nx = Math.max(0, Math.min(nx, host.width - fpvEl.offsetWidth));
        ny = Math.max(0, Math.min(ny, host.height - fpvEl.offsetHeight));
        fpvEl.style.left = nx + 'px';
        fpvEl.style.top = ny + 'px';
      } else {
        // Grip is bottom-RIGHT: dragging right/down grows it, keeping the
        // top-LEFT corner (baseLeft, baseTop) fixed. Clamp to the host and a
        // sane min/max.
        var nw = baseW + (ev.clientX - startX);
        nw = Math.max(MINW, Math.min(nw, host.width - baseLeft, host.width * 0.9));
        var nh = nw / FPV_ASPECT;
        var maxH = host.height * 0.9;
        if (nh > maxH) { nh = maxH; nw = nh * FPV_ASPECT; }
        fpvEl.style.width = nw + 'px';
        fpvEl.style.height = nh + 'px';
        // left/top stay fixed (baseLeft, baseTop)
      }
    }
    function endAll(ev) {
      if (!mode) return;
      mode = null;
      fpvEl.classList.remove('dragging', 'resizing');
      try { fpvEl.releasePointerCapture(ev.pointerId); } catch (e) {}
      try { grip.releasePointerCapture(ev.pointerId); } catch (e) {}
    }
    fpvEl.addEventListener('pointermove', onMove);
    grip.addEventListener('pointermove', onMove);
    fpvEl.addEventListener('pointerup', endAll);
    fpvEl.addEventListener('pointercancel', endAll);
    grip.addEventListener('pointerup', endAll);
    grip.addEventListener('pointercancel', endAll);
  })();

  // Column distance can be a scalar stone hit or a [stoneHit, glassDist] pair
  // (glass is see-through, so it rides in front of the stone behind it).
  function colStone(c) { return (c instanceof Array) ? c[0] : c; }
  function colGlass(c) { return (c instanceof Array) ? c[1] : -1; }

  // --- raycaster projection constants (real FPS math) ---
  // A world object of height WALL_H at perpendicular distance d projects to
  // (PROJ * WALL_H / d) screen px, where PROJ = (W/2)/tan(halfFov). This is the
  // exact pinhole-camera relation Wolf3D/DOOM use, so near walls tower and far
  // walls shrink smoothly — real depth, not a clamp. WALL_H is the corridor wall
  // height in world px; tuned so a wall ~one corridor away fills the frame.
  var FPV_WALL_H = 150;      // world px: conceptual corridor wall height
  // The camera eye sits at half a wall's height (walls are drawn centered on the
  // horizon), so the visible FLOOR at distance d is horizon + projH(FPV_EYE, d).
  // Every figure plants its feet on THAT line — no more floating at eye level.
  var FPV_EYE = FPV_WALL_H / 2;
  var FPV_COG_H = 90;        // world px: a cog stands ~0.6x a corridor wall tall
  var FPV_FOG = 900;         // px at which depth shading bottoms out to ink

  // --- paint-splatter-on-hit state ---
  // Tracks the POV seat's last PAINT-hit tick (server-sent self.paintTick) so a
  // fresh paint hit fires a splat; the splat itself is a set of blobs in [0..1]
  // canvas-space with a fire TICK, faded over SPLAT_TICKS so it decays as the
  // replay plays (scrub-safe, wall-clock independent). Keyed on paintTick — NOT
  // raw hp — so only paintball/grenade paint splashes the visor; the plasma
  // sword drains hp with no paint and must never trigger it.
  var fpvPrev = { pov: -1, paint: -1, tick: -1 };
  var fpvSplat = null;
  var SPLAT_TICKS = 30;      // ~1.25s at 24fps: splat lingers then clears
  // Build ONE cohesive, cartoony paint splat: a single main gob with a few small
  // lobes hugging it (an organic outline, not a shotgun-scatter) plus a couple of
  // drips. Anchored OFF-CENTER — one of a handful of side/corner spots — so the
  // view center stays clear. Placed DETERMINISTICALLY off the fire tick (no RNG),
  // so re-scrubbing to the same tick paints the identical splat.
  function makeSplat(tick, color) {
    function rnd(i) { var x = Math.sin((tick * 13.13 + i * 7.77)) * 43758.5453; return x - Math.floor(x); }
    // Off-center anchors: four corners + two side-mids. Never the center, so the
    // action stays readable through the splash.
    var anchors = [
      { x: 0.26, y: 0.30 }, { x: 0.74, y: 0.30 },
      { x: 0.26, y: 0.70 }, { x: 0.74, y: 0.70 },
      { x: 0.20, y: 0.50 }, { x: 0.80, y: 0.50 }
    ];
    var a = anchors[Math.floor(rnd(0) * anchors.length) % anchors.length];
    var mainR = 0.15 + rnd(1) * 0.04;
    var blobs = [{ x: a.x, y: a.y, r: mainR, drip: 0.8 + rnd(2) * 0.5 }];
    // 3–4 satellite lobes hugging the main gob so the silhouette reads as ONE
    // torn splat, not many separate hits.
    var count = 3 + Math.floor(rnd(3) * 2);
    for (var i = 0; i < count; i++) {
      var ang = rnd(i * 3 + 4) * Math.PI * 2;
      blobs.push({
        x: a.x + Math.cos(ang) * mainR * (0.7 + rnd(i * 3 + 5) * 0.5),
        y: a.y + Math.sin(ang) * mainR * (0.6 + rnd(i * 3 + 6) * 0.5),
        r: mainR * (0.32 + rnd(i * 3 + 7) * 0.34),
        drip: rnd(i * 5 + 8) * 0.7
      });
    }
    return { tick: tick, color: color, blobs: blobs, cx: a.x, cy: a.y, mainR: mainR };
  }

  function renderFpv(s) {
    var show = s.pov >= 0 && s.fp && s.fp.cols;
    fpvEl.classList.toggle('on', !!show);
    if (!show) return;
    if (!fpvCtx) fpvCtx = fpvCanvas.getContext('2d');

    var fp = s.fp;

    // Paint-splatter-on-hit: when the POV cog takes a PAINT hit (paintball gun or
    // grenade — server stamps self.paintTick; the plasma sword leaves no paint,
    // so it never advances), splash the enemy team's paint across the "visor".
    // Keyed + faded by TICK (not wall-clock) so it is replay-deterministic and
    // scrub-safe. A new paint hit replaces any fading splat.
    var self = fp.self;
    if (self) {
      var jump = fpvPrev.tick < 0 || s.t < fpvPrev.tick || (s.t - fpvPrev.tick) > 6;
      var paint = (typeof self.paintTick === 'number') ? self.paintTick : -1;
      if (s.pov !== fpvPrev.pov || jump) {
        // POV change or scrub/loop: resync baseline, don't fire, drop stale splat.
        fpvSplat = null;
      } else if (paint >= 0 && paint !== fpvPrev.paint && paint <= s.t) {
        // A fresh paint hit landed on the POV seat → enemy paint hits the screen.
        var enemyCol = self.team === 'red' ? BLUE : RED;
        fpvSplat = makeSplat(paint, enemyCol);
      }
      fpvPrev.pov = s.pov;
      fpvPrev.paint = paint;
      fpvPrev.tick = s.t;
    }

    var cols = fp.cols, n = cols.length;
    var dpr = window.devicePixelRatio || 1;
    var cssW = fpvCanvas.clientWidth || 200, cssH = fpvCanvas.clientHeight || 133;
    var W = Math.max(1, Math.round(cssW * dpr)), H = Math.max(1, Math.round(cssH * dpr));
    if (fpvCanvas.width !== W) fpvCanvas.width = W;
    if (fpvCanvas.height !== H) fpvCanvas.height = H;
    var ctx = fpvCtx;
    ctx.imageSmoothingEnabled = false;

    var horizon = H * 0.5;
    // Projection scale from the real half-FOV (server-sent, in brads → radians).
    var halfFov = (fp.hfov != null ? fp.hfov : 128 * (60 / 180)) * Math.PI / 128;
    var PROJ = (W / 2) / Math.tan(Math.max(0.15, halfFov));

    // Ceiling (upper) over floor (lower): darker at the horizon line, lifting
    // toward the frame edges — a subtle vertical gradient reads as depth even on
    // empty lanes. Near-black warm ink, distinct from wall stone.
    var ceil = ctx.createLinearGradient(0, 0, 0, horizon);
    ceil.addColorStop(0, '#20180f'); ceil.addColorStop(1, '#0d0a06');
    ctx.fillStyle = ceil; ctx.fillRect(0, 0, W, horizon);
    var floor = ctx.createLinearGradient(0, horizon, 0, H);
    floor.addColorStop(0, '#0d0a06'); floor.addColorStop(1, '#241a10');
    ctx.fillStyle = floor; ctx.fillRect(0, horizon, W, H - horizon);

    // Per-column wall DEPTH z-buffer (perpendicular distance to the nearest
    // OPAQUE wall in that column, Infinity for open sky). Sprites test against
    // this so a cog behind a pillar is clipped. Glass is see-through → it does
    // NOT write depth (you can shoot-block on it but you can see past it).
    var colW = W / n;
    var zbuf = new Array(n);
    function projH(worldH, d) { return PROJ * worldH / Math.max(4, d); }

    for (var i = 0; i < n; i++) {
      var x = Math.round(i * colW);
      var w = Math.ceil(colW) + 1;
      var dist = colStone(cols[i]);
      zbuf[i] = dist >= 0 ? dist : Infinity;
      if (dist >= 0) {
        var h = projH(FPV_WALL_H, dist);
        var top = horizon - h / 2;
        // Depth shading: near = warm lit stone, far = sink to ink. Exponential-ish
        // falloff over corridor distances gives a legible near/far ramp.
        var lit = Math.max(0.12, 1 - dist / FPV_FOG);
        lit = lit * lit;                          // steepen so pillars pop forward
        // Vertical-edge shading: darken columns whose neighbour is much nearer/
        // farther — that depth discontinuity is a WALL CORNER; a seam sells 3D.
        var seam = 1;
        if (i > 0 && i < n - 1) {
          var dl = colStone(cols[i - 1]), dr = colStone(cols[i + 1]);
          var jump = Math.max(
            dl >= 0 ? Math.abs(dist - dl) : 0,
            dr >= 0 ? Math.abs(dist - dr) : 0);
          if (jump > 40) seam = 0.55;             // dark ink line at the corner
        }
        var r = Math.round((150 * lit + 26) * seam);
        var g = Math.round((116 * lit + 18) * seam);
        var b = Math.round((84 * lit + 12) * seam);
        ctx.fillStyle = 'rgb(' + r + ',' + g + ',' + b + ')';
        ctx.fillRect(x, top, w, h);
        // A soft top-edge highlight + bottom shadow give the slab thickness.
        ctx.fillStyle = 'rgba(255,236,200,' + (0.10 * lit).toFixed(3) + ')';
        ctx.fillRect(x, top, w, Math.max(1, h * 0.04));
        ctx.fillStyle = 'rgba(0,0,0,0.22)';
        ctx.fillRect(x, top + h - Math.max(1, h * 0.05), w, Math.max(1, h * 0.05));
      }
      // Glass pane: translucent slice in front (drawn over stone, no depth write).
      var gd = colGlass(cols[i]);
      if (gd >= 0) {
        var gh = projH(FPV_WALL_H, gd);
        var gtop = horizon - gh / 2;
        var glit = Math.max(0.25, 1 - gd / FPV_FOG);
        ctx.fillStyle = 'rgba(150,178,186,' + (0.26 * glit).toFixed(3) + ')';
        ctx.fillRect(x, gtop, w, gh);
        ctx.fillStyle = 'rgba(226,236,230,' + (0.30 * glit).toFixed(3) + ')';
        ctx.fillRect(x, gtop, w, Math.max(1, gh * 0.05));
      }
    }

    // Sprites: project each entity to its true screen height and column span,
    // then draw column-by-column CLIPPED against the wall z-buffer — a cog behind
    // a nearer wall is hidden per-column, exactly like a real raycaster. Sorted
    // far→near so nearer figures overdraw.
    var ents = (fp.ents || []).slice().sort(function (a, b) { return b.d - a.d; });
    for (var j = 0; j < ents.length; j++) {
      var e = ents[j];
      var ed = Math.max(4, e.d);
      var worldH = (e.k === 'item' || e.k === 'heart') ? FPV_COG_H * 0.55 : FPV_COG_H;
      var figH = projH(worldH, ed);
      // Screen-x from the true view angle: o∈[-1,1] maps across ±halfFov, and the
      // horizontal position is PROJ*tan(angle) — matched to the wall projection.
      var ang = (e.o || 0) * halfFov;
      var ex = W / 2 + PROJ * Math.tan(ang);
      var figW = figH * ((e.k === 'item' || e.k === 'heart') ? 0.85 : 0.9);
      // Plant the figure on the visible FLOOR: the floor at this depth projects to
      // horizon + projH(FPV_EYE, d). Feet sit there; the body rises figH above it.
      // (Previously feet were pinned near the horizon, so cogs floated at eye level.)
      var feetY = horizon + projH(FPV_EYE, ed);
      // Occlusion is a DEPTH test, so compare like-for-like: zbuf holds fisheye-
      // corrected PERPENDICULAR wall distance, while e.d is the RADIAL range to the
      // entity. Convert the entity to perpendicular depth (radial·cos(angle)) before
      // testing, or edge sprites leak through nearer walls.
      var edPerp = ed * Math.cos(ang);
      // Occlusion: clip the sprite to the sub-range of its columns that are NOT
      // blocked by a nearer wall. Draw into a clip rect spanning visible columns.
      var xL = ex - figW / 2, xR = ex + figW / 2;
      var ci0 = Math.max(0, Math.floor(xL / colW));
      var ci1 = Math.min(n - 1, Math.ceil(xR / colW));
      // Build visible x-spans where zbuf (wall depth) is farther than the sprite.
      var spanStart = -1;
      for (var ci = ci0; ci <= ci1 + 1; ci++) {
        var visible = ci <= ci1 && zbuf[ci] > edPerp - 2;   // wall behind sprite → show
        if (visible && spanStart < 0) spanStart = ci;
        else if (!visible && spanStart >= 0) {
          drawFpvEntityClipped(ctx, e, ex, feetY, figH, figW,
            Math.max(xL, spanStart * colW), Math.min(xR, ci * colW));
          spanStart = -1;
        }
      }
    }

    // Aim reticle at view center.
    ctx.save();
    ctx.strokeStyle = 'rgba(242,232,216,0.55)';
    ctx.lineWidth = Math.max(1, H * 0.006);
    var rc = H * 0.03;
    ctx.beginPath();
    ctx.moveTo(W / 2 - rc, horizon); ctx.lineTo(W / 2 - rc * 0.35, horizon);
    ctx.moveTo(W / 2 + rc * 0.35, horizon); ctx.lineTo(W / 2 + rc, horizon);
    ctx.moveTo(W / 2, horizon - rc); ctx.lineTo(W / 2, horizon - rc * 0.35);
    ctx.moveTo(W / 2, horizon + rc * 0.35); ctx.lineTo(W / 2, horizon + rc);
    ctx.stroke();
    ctx.restore();

    // Paint-splatter overlay: enemy paint splashed across the camera on a hit,
    // fading out over SPLAT_TICKS as the replay advances. Drawn LAST so it sits
    // in front of the world like paint on a visor.
    if (fpvSplat) {
      var age = s.t - fpvSplat.tick;
      if (age < 0 || age > SPLAT_TICKS) { fpvSplat = null; }
      else { drawSplat(ctx, W, H, fpvSplat, 1 - age / SPLAT_TICKS); }
    }

    renderFpvHud(fp.self);
    renderFpvMap(fp);
  }

  // Draw the paint splatter: gooey team-colored blobs with soft edges + drips,
  // faded by `life` (1 → fresh, 0 → gone). A quick white rim on the freshest
  // frames reads as a wet impact flash.
  function drawSplat(ctx, W, H, splat, life) {
    if (life <= 0) return;
    ctx.save();
    // ease-out: near-opaque at impact, then fall off. Capped well below 1 so the
    // action still reads through the paint (a splash on the lens, not a
    // blackout) — and since the splat sits off-center, the view center stays clear.
    var a = Math.min(0.7, life * 1.05);
    ctx.globalAlpha = a;
    var col = splat.color;
    for (var i = 0; i < splat.blobs.length; i++) {
      var b = splat.blobs[i];
      var bx = b.x * W, by = b.y * H, br = b.r * Math.min(W, H);
      // soft radial body so edges feather like wet paint
      var g = ctx.createRadialGradient(bx, by, br * 0.15, bx, by, br);
      g.addColorStop(0, col); g.addColorStop(0.7, col);
      g.addColorStop(1, hexA(col, 0));
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill();
      // a drip running down from the blob
      if (b.drip > 0.35) {
        var dl = br * (0.8 + b.drip * 1.6);
        var dw = br * 0.32;
        var dg = ctx.createLinearGradient(bx, by, bx, by + dl);
        dg.addColorStop(0, col); dg.addColorStop(1, hexA(col, 0));
        ctx.fillStyle = dg;
        ctx.beginPath();
        ctx.moveTo(bx - dw, by);
        ctx.quadraticCurveTo(bx - dw * 0.4, by + dl * 0.6, bx, by + dl);
        ctx.quadraticCurveTo(bx + dw * 0.4, by + dl * 0.6, bx + dw, by);
        ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.arc(bx, by + dl, dw * 0.5, 0, Math.PI * 2); ctx.fill();
      }
    }
    // wet-impact rim flash on the freshest frames, hugging the main gob
    if (life > 0.72) {
      ctx.globalAlpha = (life - 0.72) / 0.28 * 0.5;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.006);
      ctx.beginPath();
      ctx.arc(splat.cx * W, splat.cy * H, splat.mainR * Math.min(W, H) * 1.08, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }
  // #rrggbb → rgba() with alpha a (0..1). Used for feathered paint edges.
  function hexA(hex, a) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (!m) return hex;
    return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' + parseInt(m[3], 16) + ',' + a + ')';
  }

  // A four-lobed heart glyph (two arcs + a point) — the flag/heart icon, matched
  // to the board art rather than a bare diamond.
  function heartPath(ctx, cx, cy, s) {
    ctx.beginPath();
    ctx.moveTo(cx, cy + s * 0.5);
    ctx.bezierCurveTo(cx - s * 0.95, cy - s * 0.15, cx - s * 0.45, cy - s * 0.72, cx, cy - s * 0.22);
    ctx.bezierCurveTo(cx + s * 0.45, cy - s * 0.72, cx + s * 0.95, cy - s * 0.15, cx, cy + s * 0.5);
    ctx.closePath();
  }

  // Item glyphs for the first-person billboards, drawn in a figH-scaled box.
  // `dim` (0..1, default 1) applies depth shading like the wall/cog draws.
  function drawItemGlyph(ctx, kind, cx, cy, r, dim) {
    dim = dim == null ? 1 : dim;
    ctx.save();
    ctx.globalAlpha = Math.max(0.4, dim);
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(1, r * 0.14);
    ctx.strokeStyle = 'rgba(12,8,5,0.9)';
    if (kind === 'grenade') {
      ctx.fillStyle = '#4f6b3a';
      ctx.beginPath(); ctx.arc(cx, cy + r * 0.15, r * 0.6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(cx - r * 0.18, cy - r * 0.75, r * 0.36, r * 0.4);
    } else if (kind === 'medkit') {
      ctx.fillStyle = PAPER;
      ctx.beginPath(); ctx.rect(cx - r * 0.62, cy - r * 0.5, r * 1.24, r * 1.0); ctx.fill(); ctx.stroke();
      ctx.fillStyle = RED;
      ctx.fillRect(cx - r * 0.13, cy - r * 0.34, r * 0.26, r * 0.68);
      ctx.fillRect(cx - r * 0.34, cy - r * 0.13, r * 0.68, r * 0.26);
    } else if (kind === 'shield') {
      ctx.fillStyle = '#6fa8d6';
      ctx.beginPath();
      ctx.moveTo(cx, cy - r * 0.7);
      ctx.lineTo(cx + r * 0.6, cy - r * 0.4);
      ctx.lineTo(cx + r * 0.42, cy + r * 0.55);
      ctx.lineTo(cx, cy + r * 0.78);
      ctx.lineTo(cx - r * 0.42, cy + r * 0.55);
      ctx.lineTo(cx - r * 0.6, cy - r * 0.4);
      ctx.closePath(); ctx.fill(); ctx.stroke();
    } else if (kind === 'plasma') {
      ctx.fillStyle = '#c77bd6';
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = 'rgba(242,232,216,0.85)';
      ctx.lineWidth = Math.max(1, r * 0.1);
      for (var a = 0; a < 4; a++) {
        var ang = a * Math.PI / 2 + Math.PI / 4;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ang) * r * 0.5, cy + Math.sin(ang) * r * 0.5);
        ctx.lineTo(cx + Math.cos(ang) * r * 0.85, cy + Math.sin(ang) * r * 0.85);
        ctx.stroke();
      }
    } else {
      ctx.fillStyle = AMBER;
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
