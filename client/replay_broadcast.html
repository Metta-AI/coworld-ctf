      ctx.fillStyle = PAPER;
      ctx.fillRect(cx - r * 0.44, cy - r * 0.04, r * 0.88, r * 0.32);
      ctx.strokeRect(cx - r * 0.44, cy - r * 0.04, r * 0.88, r * 0.32);
      ctx.fillStyle = '#7fc4d6';
      ctx.beginPath(); ctx.rect(cx - r * 0.2, cy - r * 0.68, r * 0.4, r * 0.26);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(242,232,216,0.85)';
      ctx.beginPath(); ctx.arc(cx + r * 0.4, cy - r * 0.72, r * 0.17, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx + r * 0.66, cy - r * 0.58, r * 0.1, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = AMBER;
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // Draw one billboard entity, CLIPPED to [clipL, clipR] so walls occlude it
  // per-column (real raycaster sprite clipping). figH/figW are the projected
  // size; (cx, feetY) is the sprite's ground contact on the floor.
  function drawFpvEntityClipped(ctx, e, cx, feetY, figH, figW, clipL, clipR) {
    if (clipR <= clipL) return;
    ctx.save();
    ctx.beginPath();
    // Clip band spans the whole standing figure (feetY up figH) plus headroom for
    // hp pips / a carried heart above, and a little below for the contact shadow.
    ctx.rect(clipL, feetY - figH * 2.0, clipR - clipL, figH * 2.4);
    ctx.clip();
    // Depth dim: distant billboards sink toward ink like the walls do.
    var dim = Math.max(0.35, 1 - (e.d || 0) / FPV_FOG);
    drawFpvEntity(ctx, e, cx, feetY, figH, figW, dim);
    ctx.restore();
  }

  // ---- paintball comets in 3D ----
  // The server sends each in-flight beam as a polyline of (bearing o, range d)
  // samples, with nulls where the beam leaves this seat's vision. We project
  // every sample the same way the walls and cogs are projected, so a beam
  // genuinely recedes: the far end converges toward the horizon and thins, the
  // near end is fat and low. That's what makes it read as a shot flying through
  // the room rather than a line drawn on the glass.
  //
  // Shape (matching the board's comet, global.nim): a bright paintball HEAD at
  // the impact end, a trail behind it whose alpha rises as t^SHOT_TRAIL_FALLOFF
  // toward that head, a muzzle flash at the shooter's end, and a wet splat where
  // it lands. Age fades the whole comet over SHOT_FX_TICKS; a miss starts
  // SHOT_MISS_AGE ticks "older" so hits are the ones that pop.
  function drawFpvShots(ctx, fp, W, H, horizon, halfFov, PROJ, colW, n, zbuf,
                        projH) {
    var shots = fp.shots;
    if (!shots || !shots.length) return;

    // Project one sample to screen space. The beam rides SHOT_EYE_DROP below the
    // eye line, so it sits at chest height like a real muzzle.
    function project(p) {
      var d = Math.max(4, p.d);
      var ang = (p.o || 0) * halfFov;
      return {
        x: W / 2 + PROJ * Math.tan(ang),
        y: horizon + projH(SHOT_EYE_DROP, d),
        d: d,
        perp: d * Math.cos(ang)      // for the wall z-test, like the sprites
      };
    }
    // A sample is hidden when a nearer wall covers its column.
    function occluded(pt) {
      var ci = Math.floor(pt.x / colW);
      if (ci < 0 || ci >= n) return true;
      return zbuf[ci] <= pt.perp - 2;
    }

    for (var s = 0; s < shots.length; s++) {
      var sh = shots[s];
      var pts = sh.pts || [];
      if (pts.length < 2) continue;
      var team = sh.team === 'red' ? 'red' : (sh.team === 'blue' ? 'blue' : null);
      var paint = team === 'red' ? RED : (team === 'blue' ? BLUE : AMBER);
      // Age fade, with misses pre-aged so hits read brighter.
      var age = (sh.age || 0) + (sh.hit ? 0 : SHOT_MISS_AGE);
      var life = Math.max(0, 1 - age / SHOT_FX_TICKS);
      if (life <= 0.02) continue;

      // Project every visible sample; nulls (fog) and wall-occluded samples
      // break the polyline into separate runs so the trail never draws through
      // something it shouldn't.
      var runs = [], run = null;
      for (var i = 0; i < pts.length; i++) {
        var p = pts[i];
        var ok = false, pr = null;
        if (p) {
          pr = project(p);
          ok = !occluded(pr);
        }
        if (ok) {
          pr.t = pts.length > 1 ? i / (pts.length - 1) : 1;   // 0 muzzle → 1 impact
          if (!run) { run = []; runs.push(run); }
          run.push(pr);
        } else {
          run = null;
        }
      }
      if (!runs.length) continue;

      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // INCOMING shots are a special visual case. A beam fired toward the camera
      // projects almost to a POINT (every sample shares a bearing), so the
      // generic trail degenerates into a vertical smear — geometrically right,
      // but it reads as a blob, not as paint coming at your face. Detect it from
      // the projected spread vs the depth it covers, and draw it as a paintball
      // rushing the lens instead: one hot ball with a tight halo, scaled by how
      // close the nearest sample is.
      var flatSpan = 0, dSpan = 0;
      var allPts = [];
      for (var q = 0; q < runs.length; q++) allPts = allPts.concat(runs[q]);
      if (allPts.length) {
        var xs = allPts.map(function (p) { return p.x; });
        var ds = allPts.map(function (p) { return p.d; });
        flatSpan = Math.max.apply(null, xs) - Math.min.apply(null, xs);
        dSpan = Math.max.apply(null, ds) - Math.min.apply(null, ds);
      }
      // Lots of depth travelled but almost no screen movement = head-on.
      var incoming = dSpan > 60 && flatSpan < W * 0.10;
      if (incoming) {
        var nearest = allPts[0];
        for (var w2 = 1; w2 < allPts.length; w2++) {
          if (allPts[w2].d < nearest.d) nearest = allPts[w2];
        }
        // Cap the ball: a beam that ENDS at the camera has d≈4, and projH blows
        // up as d→0, so an uncapped radius swallows the whole inset. A paintball
        // about to hit your visor should read as a fat ball, not a red curtain —
        // the visor paint-splat is what sells the actual impact.
        var br = Math.min(H * SHOT_MAX_HEAD_H,
                          Math.max(1.5, projH(SHOT_HEAD_WORLD * 1.35, nearest.d) * 0.5));
        var bDim = Math.max(0.45, 1 - nearest.d / FPV_FOG);
        var bg = ctx.createRadialGradient(nearest.x, nearest.y, 0,
                                          nearest.x, nearest.y, br * 3.0);
        bg.addColorStop(0, withAlpha(paint, 0.62 * life * bDim));
        bg.addColorStop(1, withAlpha(paint, 0));
        ctx.fillStyle = bg;
        ctx.beginPath();
        ctx.arc(nearest.x, nearest.y, br * 3.0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = withAlpha(paint, Math.min(1, 0.95 * life * bDim + 0.1));
        ctx.beginPath(); ctx.arc(nearest.x, nearest.y, br, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,248,236,' + (0.72 * life * bDim).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(nearest.x - br * 0.28, nearest.y - br * 0.28, br * 0.34,
                0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
        continue;
      }

      // Fog often clips a beam to a SHORT visible run (the shooter is in another
      // room, we only glimpse the paint crossing a doorway). Lift the along-beam
      // fade for those so a 1-3 sample glimpse still reads as paint in flight
      // instead of an invisible sliver: `lift` rescales t across what we can
      // actually see. A fully visible beam (t spanning ~0..1) is unaffected.
      var tSeen = 0;
      for (var r0 = 0; r0 < runs.length; r0++) {
        var sg = runs[r0];
        tSeen = Math.max(tSeen, sg[sg.length - 1].t - sg[0].t);
      }
      var lift = tSeen < 0.35 ? 0.55 : 0;   // floor on the along-beam brightness

      // --- trail: segment-by-segment, so width AND alpha track depth ---
      for (var r = 0; r < runs.length; r++) {
        var seg = runs[r];
        // A run of ONE visible sample has no segment to stroke, so give it a
        // short stub along the beam's local direction — otherwise a glimpsed
        // shot renders as nothing at all.
        if (seg.length === 1) {
          var only = seg[0];
          var stub = Math.min(H * SHOT_MAX_TRAIL_H * 3,
                              Math.max(1.5, projH(SHOT_TRAIL_WORLD * 2.2, only.d)));
          var sDim = Math.max(0.35, 1 - only.d / FPV_FOG);
          ctx.strokeStyle = withAlpha(paint, 0.8 * life * sDim);
          ctx.lineWidth = Math.min(H * SHOT_MAX_TRAIL_H,
                                   Math.max(0.8, projH(SHOT_TRAIL_WORLD, only.d) * 0.9));
          ctx.beginPath();
          ctx.moveTo(only.x - stub / 2, only.y);
          ctx.lineTo(only.x + stub / 2, only.y);
          ctx.stroke();
          continue;
        }
        for (var k = 0; k + 1 < seg.length; k++) {
          var a = seg[k], b = seg[k + 1];
          // Along-beam brightness: faint at the muzzle, bright behind the head.
          var t = (a.t + b.t) / 2;
          var beam = lift + (1 - lift) * Math.pow(t, SHOT_TRAIL_FALLOFF);
          // Depth: nearer trail is thicker, and distance dims it like the walls.
          var wide = projH(SHOT_TRAIL_WORLD, Math.min(a.d, b.d));
          var depthDim = Math.max(0.35, 1 - Math.min(a.d, b.d) / FPV_FOG);
          var alpha = 0.9 * life * beam * depthDim;
          if (alpha < 0.04) continue;
          ctx.strokeStyle = withAlpha(paint, alpha);
          ctx.lineWidth = Math.min(H * SHOT_MAX_TRAIL_H,
                                   Math.max(0.6, wide * (0.45 + 0.55 * t)));
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }

      // --- leading paintball head at the impact end ---
      var last = runs[runs.length - 1];
      var head = last[last.length - 1];
      // Only crown the head when the beam's impact end is genuinely the one we
      // can see (a beam clipped by fog shouldn't sprout a head mid-air).
      var headIsImpact = head.t > 0.92;
      if (headIsImpact) {
        // Capped like the incoming ball: projH diverges as depth → 0, and a
        // point-blank impact must not paint over the whole inset.
        var hr = Math.min(H * SHOT_MAX_HEAD_H,
                          Math.max(1.2, projH(SHOT_HEAD_WORLD, head.d) * 0.5));
        var hDim = Math.max(0.4, 1 - head.d / FPV_FOG);
        // wet glow, then the solid ball, then a bright wet highlight
        var g = ctx.createRadialGradient(head.x, head.y, 0, head.x, head.y, hr * 2.6);
        g.addColorStop(0, withAlpha(paint, 0.55 * life * hDim));
        g.addColorStop(1, withAlpha(paint, 0));
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(head.x, head.y, hr * 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = withAlpha(paint, Math.min(1, 0.95 * life * hDim + 0.1));
        ctx.beginPath(); ctx.arc(head.x, head.y, hr, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,248,236,' + (0.7 * life * hDim).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(head.x - hr * 0.3, head.y - hr * 0.3, hr * 0.36, 0, Math.PI * 2);
        ctx.fill();

        // Impact burst: a few short paint flecks kicking off the surface, only
        // while the shot is fresh — it marks WHERE the paint landed.
        if (sh.hit && life > 0.55) {
          ctx.strokeStyle = withAlpha(paint, 0.75 * life);
          ctx.lineWidth = Math.max(0.6, hr * 0.28);
          for (var f = 0; f < 5; f++) {
            var fa = (f / 5) * Math.PI * 2 + head.d;   // deterministic off depth
            var fl = hr * (1.5 + 0.9 * ((f % 3) / 2));
            ctx.beginPath();
            ctx.moveTo(head.x + Math.cos(fa) * hr * 0.9,
                       head.y + Math.sin(fa) * hr * 0.9);
            ctx.lineTo(head.x + Math.cos(fa) * fl, head.y + Math.sin(fa) * fl);
            ctx.stroke();
          }
        }
      }

      // --- muzzle flash at the shooter's end, brightest on the freshest shot ---
      var first = runs[0][0];
      if (first.t < 0.12 && life > 0.5) {
        var mr = Math.min(H * SHOT_MAX_HEAD_H,
                          Math.max(1, projH(SHOT_HEAD_WORLD * 1.5, first.d) * 0.5));
        var mg = ctx.createRadialGradient(first.x, first.y, 0,
                                          first.x, first.y, mr * 2.2);
        var flash = (life - 0.5) / 0.5;          // only the first ticks flash
        mg.addColorStop(0, 'rgba(255,242,214,' + (0.7 * flash).toFixed(3) + ')');
        mg.addColorStop(0.45, withAlpha(paint, 0.42 * flash));
        mg.addColorStop(1, withAlpha(paint, 0));
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(first.x, first.y, mr * 2.2, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }
  }

  // A cog seen head-on in first person: a chunky team-tinted chassis with a dark
  // visor band carrying TWO glowing cyan eyes (the cog's signature), a pair of
  // side wheels, and a bottom shadow. Enemies get red hp pips; carriers an amber
  // heart above; mates a paper outline ring. `dim` (0..1) applies depth shading.
  function drawFpvEntity(ctx, e, cx, feetY, figH, figW, dim) {
    dim = dim == null ? 1 : dim;
    var baseCol = e.team === 'red' ? RED : (e.team === 'blue' ? BLUE : AMBER);
    var col = shade(baseCol, dim);
    if (e.k === 'item') {
      // Items rest on the floor: center the glyph a little above the contact point.
      var ir = figH * 0.7;
      drawItemGlyph(ctx, e.item, cx, feetY - ir * 0.5, ir, dim);
      return;
    }
    if (e.k === 'heart') {
      // A heart pedestal sits on the floor; lift the glyph so it rests, not floats.
      var hs = figH * 0.9;
      ctx.save();
      ctx.lineJoin = 'round';
      ctx.fillStyle = col;
      ctx.strokeStyle = 'rgba(12,8,5,0.85)';
      ctx.lineWidth = Math.max(1, figH * 0.05);
      heartPath(ctx, cx, feetY - hs * 0.5, hs);
      ctx.fill(); ctx.stroke();
      ctx.restore();
      return;
    }
    var enemy = e.k === 'enemy';
    var feet = feetY;
    var top = feet - figH;
    // Size the blit off the projected figure so distant cogs shrink like the
    // walls. The front master's aspect is ~0.94 w/h; its HEIGHT tracks figH so
    // the cog stands the right size on the floor.
    // Live cogs carry their paintball marker, so they get the armed pose; both
    // poses share the same aspect and trim, so the geometry is unchanged.
    var artImg = cogArtFor(e.team, true);
    var drawH = figH * 1.02;
    var drawW = drawH * COG_ASPECT;
    var bodyW = drawW;         // for the mate ring + shadow width
    ctx.save();
    ctx.lineJoin = 'round';

    // contact shadow ON the floor, right under the wheels — grounds the figure.
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath();
    ctx.ellipse(cx, feet, bodyW * 0.5, figH * 0.07, 0, 0, Math.PI * 2);
    ctx.fill();

    if (cogArtReady(artImg)) {
      // Blit the cog box (COG_TRIM as fractions of natural size — full-frame for
      // the pre-trimmed front master, a cut-out box for the top-down fallback),
      // centered on cx and standing with its feet on `feet`.
      var iw = artImg.naturalWidth, ih = artImg.naturalHeight;
      var sxp = COG_TRIM.x * iw, syp = COG_TRIM.y * ih;
      var swp = COG_TRIM.w * iw, shp = COG_TRIM.h * ih;
      var dx = cx - drawW / 2, dy = feet - drawH;
      if (dim >= 0.995) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(artImg, sxp, syp, swp, shp, dx, dy, drawW, drawH);
      } else {
        // Depth-dim via an offscreen scratch so only sprite pixels darken.
        var sw = Math.max(1, Math.ceil(drawW)), sh = Math.max(1, Math.ceil(drawH));
        if (cogScratch.width !== sw) cogScratch.width = sw;
        if (cogScratch.height !== sh) cogScratch.height = sh;
        if (!cogScratchCtx) cogScratchCtx = cogScratch.getContext('2d');
        var sc = cogScratchCtx;
        sc.clearRect(0, 0, sw, sh);
        sc.imageSmoothingEnabled = false;
        sc.globalCompositeOperation = 'source-over';
        sc.drawImage(artImg, sxp, syp, swp, shp, 0, 0, sw, sh);
        // ink wash clipped to the sprite silhouette (source-atop)
        sc.globalCompositeOperation = 'source-atop';
        sc.fillStyle = 'rgba(10,7,4,' + (1 - dim).toFixed(3) + ')';
        sc.fillRect(0, 0, sw, sh);
        sc.globalCompositeOperation = 'source-over';
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(cogScratch, dx, dy, drawW, drawH);
      }
    } else {
      // Fallback: procedural chassis until the art loads.
      drawFpvChassis(ctx, cx, feet, figW, figH, col, dim);
    }

    // mate ring: a paper hoop under the chassis so allies read at a glance
    if (e.k === 'mate') {
      ctx.strokeStyle = 'rgba(242,232,216,' + (0.75 * dim).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, figH * 0.04);
      ctx.beginPath();
      ctx.ellipse(cx, feet - figH * 0.02, bodyW * 0.62, figH * 0.09, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // enemy hp pips over the head
    if (enemy && typeof e.hp === 'number' && e.hp >= 0) {
      var pips = Math.min(6, e.hp);
      var pr = Math.max(1, figH * 0.045);
      var pyy = top - pr * 1.6;
      for (var p = 0; p < pips; p++) {
        ctx.fillStyle = RED;
        ctx.beginPath();
        ctx.arc(cx - (pips - 1) * pr * 1.5 / 2 + p * pr * 1.5, pyy, pr, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    // carrier heart above the head
    if (e.carry) {
      ctx.fillStyle = AMBER;
      ctx.strokeStyle = 'rgba(12,8,5,0.85)';
      ctx.lineWidth = Math.max(1, figH * 0.03);
      var chs = figH * 0.2;
      heartPath(ctx, cx, top - chs * (enemy ? 1.6 : 0.7), chs);
      ctx.fill(); ctx.stroke();
    }
    ctx.restore();
  }

  // Procedural cog chassis — the fallback billboard drawn only until the real
  // front-facing art (COG_ART) has loaded. Chunky team-tinted body, side wheels,
  // dark visor band with two glowing cyan eyes. (cx, feet) is the sprite's
  // ground contact; figW/figH the projected size; col the depth-shaded team tint.
  function drawFpvChassis(ctx, cx, feet, figW, figH, col, dim) {
    var bodyW = figW * 0.78;
    var bodyH = figH * 0.72;
    var bodyTop = feet - bodyH;
    var lw = Math.max(1, figH * 0.05);

    // side wheels (dark, behind the chassis edges)
    ctx.fillStyle = shade('#2a211a', dim);
    ctx.strokeStyle = 'rgba(10,7,4,0.9)'; ctx.lineWidth = lw;
    var wheelW = bodyW * 0.2, wheelH = bodyH * 0.62;
    roundRect(ctx, cx - bodyW / 2 - wheelW * 0.5, bodyTop + bodyH * 0.28, wheelW, wheelH, wheelW * 0.4);
    ctx.fill(); ctx.stroke();
    roundRect(ctx, cx + bodyW / 2 - wheelW * 0.5, bodyTop + bodyH * 0.28, wheelW, wheelH, wheelW * 0.4);
    ctx.fill(); ctx.stroke();

    // chassis body (rounded, team-tinted) with a top highlight + bottom shade band
    ctx.fillStyle = col;
    ctx.strokeStyle = 'rgba(10,7,4,0.92)'; ctx.lineWidth = lw;
    roundRect(ctx, cx - bodyW / 2, bodyTop, bodyW, bodyH, bodyW * 0.22);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(255,240,210,' + (0.14 * dim).toFixed(3) + ')';
    roundRect(ctx, cx - bodyW / 2, bodyTop, bodyW, bodyH * 0.34, bodyW * 0.22);
    ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    roundRect(ctx, cx - bodyW / 2, bodyTop + bodyH * 0.62, bodyW, bodyH * 0.38, bodyW * 0.22);
    ctx.fill();

    // dark visor band across the upper chassis with two glowing cyan eyes
    var visorY = bodyTop + bodyH * 0.26;
    var visorH = bodyH * 0.3;
    ctx.fillStyle = shade('#141b1e', dim);
    roundRect(ctx, cx - bodyW * 0.4, visorY, bodyW * 0.8, visorH, visorH * 0.45);
    ctx.fill();
    var eyeR = Math.max(1, visorH * 0.32);
    var eyeDx = bodyW * 0.18, eyeCy = visorY + visorH * 0.5;
    var eyeCol = 'rgba(120,236,246,' + (0.65 + 0.35 * dim).toFixed(3) + ')';
    for (var s = -1; s <= 1; s += 2) {
      var g = ctx.createRadialGradient(cx + s * eyeDx, eyeCy, 0, cx + s * eyeDx, eyeCy, eyeR * 2.4);
      g.addColorStop(0, eyeCol); g.addColorStop(1, 'rgba(120,236,246,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(cx + s * eyeDx, eyeCy, eyeR * 2.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#d6fbff';
      ctx.beginPath(); ctx.arc(cx + s * eyeDx, eyeCy, eyeR, 0, Math.PI * 2); ctx.fill();
    }
  }

  // rounded-rect helper (older canvases lack ctx.roundRect)
  function roundRect(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  // Tint a #rrggbb by a factor (>1 lighten, <1 darken).
  function shade(hex, f) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    if (!m) return hex;
    function c(i) { return Math.max(0, Math.min(255, Math.round(parseInt(m[i], 16) * f))); }
    return 'rgb(' + c(1) + ',' + c(2) + ',' + c(3) + ')';
  }

  // Same hex, given alpha — for the paint tracers, which fade by age and depth.
  function withAlpha(hex, a) {
    var m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
    var al = Math.max(0, Math.min(1, a)).toFixed(3);
    if (!m) return hex;
    return 'rgba(' + parseInt(m[1], 16) + ',' + parseInt(m[2], 16) + ',' +
      parseInt(m[3], 16) + ',' + al + ')';
  }

  // Self-status HUD: name (team-tinted), hp pips, carried gear + flag flag.
  var ITEM_LABEL = { grenade: 'GRENADE', medkit: 'MEDKIT', shield: 'SHIELD', spray: 'SPRAY CAN' };
  function renderFpvHud(self) {
    var hud = $('fpv-hud');
    if (!self) { hud.style.display = 'none'; return; }
    hud.style.display = 'flex';
    hud.classList.toggle('fpv-dead', self.alive === false);
    var nameEl = $('fpv-name');
    nameEl.className = 'fpv-name ' + (self.team || '');
    nameEl.textContent = lastState ? shortName(rosterName(lastState, lastState.pov)) : '';
    // hp pips: fill = remaining, hollow = spent (cap the row so it never wraps)
    var maxHp = Math.max(self.hp || 0, 3);
    var hpEl = $('fpv-hp'), hpHtml = '';
    for (var i = 0; i < maxHp; i++) {
      hpHtml += '<i' + (i < self.hp ? '' : ' class="spent"') + '></i>';
    }
    hpEl.innerHTML = hpHtml;
    // gear: lives count, carried pickups, and the enemy-heart flag
    var gearEl = $('fpv-gear'), bits = [];
    if (typeof self.lives === 'number') bits.push('×' + self.lives);
    (self.items || []).forEach(function (it) { bits.push(ITEM_LABEL[it] || it.toUpperCase()); });
    var html = bits.map(function (b) { return '<span>' + b + '</span>'; }).join('');
    if (self.carry) html += '<span class="carry">♥ HEART</span>';
    gearEl.innerHTML = html;
  }

  // Un-fogged tactical minimap: the whole arena silhouette with every unit, both
  // hearts, present pickups, and the POV seat's vision wedge + bubble. Full
  // spatial context — deliberately NOT fog-limited — so the viewer always knows
  // where the EYES are looking and located.
  var fpvMapEl = $('fpv-map'), fpvMapCanvas = $('fpv-map-canvas'), fpvMapCtx = null;
  function renderFpvMap(fp) {
    var m = fp.map;
    if (!m) { fpvMapEl.style.display = 'none'; return; }
    fpvMapEl.style.display = 'block';
    if (!fpvMapCtx) fpvMapCtx = fpvMapCanvas.getContext('2d');
    var ctx = fpvMapCtx;
    var dpr = window.devicePixelRatio || 1;
    var cssW = fpvMapCanvas.clientWidth || 130, cssH = fpvMapCanvas.clientHeight || 70;
    var W = Math.max(1, Math.round(cssW * dpr)), H = Math.max(1, Math.round(cssH * dpr));
    if (fpvMapCanvas.width !== W) fpvMapCanvas.width = W;
    if (fpvMapCanvas.height !== H) fpvMapCanvas.height = H;
    var sx = W / m.w, sy = H / m.h;              // world px → canvas px
    function px(x) { return x * sx; }
    function py(y) { return y * sy; }

    // floor wash
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(20,15,10,0.55)';
    ctx.fillRect(0, 0, W, H);
    // midline, for a quick sense of sides
    ctx.strokeStyle = 'rgba(242,232,216,0.10)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W / 2, 0); ctx.lineTo(W / 2, H); ctx.stroke();

    // baked terrain silhouette (stone + glass), stretched to the inset
    if (fpMapBaked) {
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(fpMapBaked, 0, 0, fpMapBaked.width, fpMapBaked.height, 0, 0, W, H);
    }

    // POV vision wedge (cone + bubble), un-fogged. aimBrads: 0 = east, CCW+, and
    // screen-y grows downward so we negate the angle.
    var here = m.here;
    if (here && here.alive !== false) {
      var ax = px(here.x), ay = py(here.y);
      var aim = (here.aim / 256) * Math.PI * 2;   // brads → radians
      var half = (here.coneDeg || 60) * Math.PI / 180;
      var reach = Math.hypot(W, H);               // cone is unlimited range: fill
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.arc(ax, ay, reach, -aim - half, -aim + half);
      ctx.closePath();
      var amber = ctx.createRadialGradient(ax, ay, 0, ax, ay, reach);
      amber.addColorStop(0, 'rgba(232,163,61,0.34)');
      amber.addColorStop(1, 'rgba(232,163,61,0)');
      ctx.fillStyle = amber;
      ctx.fill();
      // omni bubble
      ctx.beginPath();
      ctx.arc(ax, ay, (here.bubble || 0) * ((sx + sy) / 2), 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(232,163,61,0.14)';
      ctx.fill();
      // aim ray
      ctx.strokeStyle = 'rgba(232,163,61,0.7)';
      ctx.lineWidth = Math.max(1, H * 0.02);
      ctx.beginPath();
      ctx.moveTo(ax, ay);
      ctx.lineTo(ax + Math.cos(-aim) * reach, ay + Math.sin(-aim) * reach);
      ctx.stroke();
      ctx.restore();
    }

    // hearts (behind players)
    (m.hearts || []).forEach(function (ht) {
      var col = ht.team === 'red' ? RED : BLUE;
      var hx = px(ht.x), hy = py(ht.y);
      ctx.save();
      ctx.fillStyle = col;
      ctx.strokeStyle = 'rgba(12,8,5,0.8)';
      ctx.lineWidth = 1;
      heartPath(ctx, hx, hy, Math.max(3, H * 0.05));
      ctx.fill(); ctx.stroke();
      ctx.restore();
    });

    // pickups as small dots
    (m.items || []).forEach(function (it) {
      var c = { grenade: '#7fae55', medkit: '#f2e8d8', shield: '#6fa8d6', spray: '#c8503f' }[it.item] || AMBER;
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.arc(px(it.x), py(it.y), Math.max(1.4, H * 0.022), 0, Math.PI * 2);
      ctx.fill();
    });

    // players: team-tinted dots; the POV seat gets an amber ring; carriers a pip
    (m.players || []).forEach(function (p) {
      var col = p.team === 'red' ? RED : BLUE;
      var x = px(p.x), y = py(p.y);
      var r = Math.max(2, H * (p.self ? 0.045 : 0.035));
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = col;
      ctx.fill();
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'rgba(12,8,5,0.85)';
      ctx.stroke();
      if (p.self) {
        ctx.strokeStyle = AMBER;
        ctx.lineWidth = Math.max(1, H * 0.02);
        ctx.beginPath();
        ctx.arc(x, y, r + Math.max(2, H * 0.035), 0, Math.PI * 2);
        ctx.stroke();
      }
      if (p.carry) {
        ctx.fillStyle = AMBER;
        ctx.beginPath();
        ctx.arc(x, y - r - Math.max(2, H * 0.03), Math.max(1.2, H * 0.02), 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }

  function renderMismatch(s) {
    $('mmwarn').classList.toggle('on', s.mm >= 0);
  }

  // ============================================================
  //  Beats → surfaces  (§5)
  // ============================================================
  function applyEvent(e, s) {
    switch (e.k) {
      case 'kill': onKill(e, s); markBeat(e.t, 'kill', killMarkerTeam(e, s)); beatPulse(); break;
      case 'steal': onSteal(e, s); markBeat(e.t, 'steal', e.flag); beatPulse(); break;
      case 'return': onReturn(e, s); markBeat(e.t, 'return', e.flag); beatPulse(); break;
      case 'capture': onCapture(e, s); markBeat(e.t, 'capture', otherTeam(e.flag)); beatPulse(); break;
      case 'achv': onAchievement(e, s); markBeat(e.t, 'achv', e.team); break;
      case 'respawn': /* board rematerialize handles this visually */ break;
      case 'gameover': /* end-card is state-driven */ break;
      case 'phase': /* clock caption handles phase */ break;
    }
  }

  // Slots already drawn as the partner of a provable same-tick trade, so the
  // second half of the pair is suppressed (one linked row, not two). Keyed by
  // "tick:victimSlot"; a tiny ring is plenty since only same-tick pairs matter.
  var tradeConsumed = {};
  function onKill(e, s) {
    var killer = e.killer, victim = e.victim;
    var victimTeam = teamOf(s, victim);
    var killerTeam = killer >= 0 ? teamOf(s, killer) : null;
    var glyph = '▸';
    var badge = '';
    if (e.trade !== undefined && e.trade >= 0) {
      // Provable mutual trade: the server proved these two killed each other
      // this tick (the two killers ARE the two victims). Draw ONE linked row
      // with both names; skip the partner's own event so it isn't doubled.
      if (tradeConsumed[e.t + ':' + victim]) { delete tradeConsumed[e.t + ':' + victim]; return; }
      tradeConsumed[e.t + ':' + e.trade] = true;
      var row = document.createElement('div');
      row.className = 'feed-row';
      row.innerHTML = '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' +
        '<span class="glyph">⇄</span>' +
        '<span class="who ' + (teamOf(s, e.trade) || '') + '">' + esc(shortName(rosterName(s, e.trade))) + '</span>' +
        '<span class="badge">traded</span>';
      pushFeed(row);
      return;
    }
    var row = document.createElement('div');
    row.className = 'feed-row';
    if (e.amb) {
      // Same-tick multi-kill the sim can't pair (a 3-way pileup or two
      // independent kills). Attribution is honestly unknown (F7): show the
      // victim with a neutral marker, never a fabricated killer or "traded".
      badge = '<span class="badge">DOUBLE SPLAT</span>';
      row.innerHTML = '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' + badge;
    } else {
      if (e.tk) { badge = '<span class="badge tk">OWN PAINT</span>'; row.classList.add('flagkill'); }
      var killerName = killer >= 0 ? shortName(rosterName(s, killer)) : 'the arena';
      row.innerHTML = '<span class="who ' + (killerTeam || '') + '">' + esc(killerName) + '</span>' +
        '<span class="glyph">' + glyph + '</span>' +
        '<span class="who ' + (victimTeam || '') + '">' + esc(shortName(rosterName(s, victim))) + '</span>' + badge;
    }
    pushFeed(row);
  }

  // An achievement claim. ONE transient lane: the claiming team's corner
  // TOAST, plus the scrubber mark applyEvent already sets. The banner lane is
  // gone deliberately — the claim is popped OVER THE COG THAT EARNED IT,
  // sim-side (sim.gloryPops, drawn by global.addGloryPops), and a top-middle
  // toast saying the same words a moment later just pulls the eye off the cog
  // the pop is pointing at. The KILL FEED row this used to push is gone too:
  // the blue toast lane stacks directly above the feed's reserve, so feeding
  // the same claim into both would double the record in one corner — the feed
  // is kills again, the pop is the moment and the pointer, the toast is the
  // corner record, the panel header is the state.
  function onAchievement(e, s) {
    var team = e.team === 'red' ? 'red' : 'blue';
    // A FIRST (first team in the Episode to complete that tier) or a deep tier
    // still gets the heartbeat pulse: it is a rarer moment and the transport
    // should say so. It just no longer takes over the top of the frame.
    if (e.first || (e.tier || 0) >= 3) beatPulse();
    achToast(team, e);
  }

  function onSteal(e, s) {
    var heartTeam = e.flag; // the team whose heart was TAKEN (e.flag is the legacy event field)
    var thief = shortName(rosterName(s, e.by));
    banner((heartTeam === 'red' ? 'RED' : 'BLUE') + ' HEART STOLEN!', 'steal ' + (heartTeam + '-accent'));
  }
  function onReturn(e, s) {
    var heartTeam = e.flag;
    banner((heartTeam === 'red' ? 'RED' : 'BLUE') + ' HEART RETURNED', 'returned ' + (heartTeam + '-accent'));
  }
  function onCapture(e, s) {
    var byTeam = teamOf(s, e.by);
    banner('CAPTURE!', 'wipe ' + (byTeam + '-accent'),
      { sub: (byTeam === 'red' ? 'RED' : 'BLUE') + ' TEAM' });
  }

  function teamOf(s, slot) {
    if (slot < 0 || !s.roster) return null;
    for (var i = 0; i < s.roster.length; i++) if (s.roster[i].s === slot) return s.roster[i].team;
    return null;
  }
  function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

  // ---------- kill feed queue (fixed reserve, dwell floor) ----------
  var feedEl = $('killfeed');
  var MAX_FEED = 4;
  function pushFeed(row) {
    feedEl.insertBefore(row, feedEl.firstChild);
    while (feedEl.children.length > MAX_FEED) feedEl.removeChild(feedEl.lastChild);
    // Dwell floor (lever 2): a wall-clock minimum so the row reads even at 16×.
    var hold = dwellFloor('feed');
    // animFactor cap (lever 1): the slide-in duration never dips below its
    // read-time, so the row still overshoots-and-settles legibly at high speed.
    row.style.animationDuration = (250 / animFactor()) + 'ms';
    setTimeout(function () {
      if (row.parentNode) { row.classList.add('leaving'); setTimeout(function () { if (row.parentNode) row.parentNode.removeChild(row); }, 300); }
    }, hold);
  }
  function clearFeed() { feedEl.innerHTML = ''; }

  // ---------- banner lane queue (one at a time, min hold) ----------
  var bannerEl = $('bannerlane');
  var bannerQueue = [];
  var bannerBusy = false;
  function banner(text, cls, opts) {
    bannerQueue.push({ text: text, cls: cls,
      sub: (opts && opts.sub) || '', flames: (opts && opts.flames) || 0,
      hold: (opts && opts.hold) || 'banner' });
    pumpBanner();
  }
  function pumpBanner() {
    if (bannerBusy || !bannerQueue.length) return;
    bannerBusy = true;
    var b = bannerQueue.shift();
    var chip = document.createElement('div');
    chip.className = 'banner-chip ' + b.cls;
    var text = document.createElement('span');
    text.className = 'slam-text';
    if (b.flames) {
      // heat callout: the scorebug flame glyph sized up, beside the words
      var fl = document.createElement('span');
      fl.className = 'slam-flames';
      fl.innerHTML = new Array(b.flames + 1).join(FLAME_SVG);
      text.appendChild(fl);
    }
    text.appendChild(document.createTextNode(b.text));
    chip.appendChild(text);
    if (b.sub) {
      var sub = document.createElement('span');
      sub.className = 'slam-sub';
      sub.textContent = b.sub;
      chip.appendChild(sub);
    }
    var rule = document.createElement('span');
    rule.className = 'slam-rule';
    chip.appendChild(rule);
    bannerEl.appendChild(chip);
    // lever 1 (animFactor cap): --bf scales every slam duration/delay in CSS
    // up to the 2x ceiling, so a fast-forward scrub can't reduce the slam to
    // a subliminal flash.
    chip.style.setProperty('--bf', animFactor());
    // lever 2: wall-clock dwell floor -- event banners ~1.9s, heat callouts
    // ~3.6s (Maxwell: a streak chip that flashes reads as UI noise, not news;
    // RAMPAGE is rare now, so the longer dwell can never queue-jam).
    var hold = dwellFloor(b.hold);
    setTimeout(function () {
      chip.classList.add('leaving');
      setTimeout(function () {
        if (chip.parentNode) chip.parentNode.removeChild(chip);
        bannerBusy = false;
        pumpBanner();
      }, 180);
    }, hold);
  }
  function clearBanners() {
    bannerQueue = [];
    bannerEl.innerHTML = '';
    bannerBusy = false;
  }

  // ---------- heat-streak callouts (client-side rung-UP detection) ----------
  // The wire already ships per-team heat every frame (s.teams.*.heat:
  // 1/2/4/8) and the scorebug flames it silently; the CALLOUT is the state
  // transition detected here. Rung-downs are silent, both teams can streak
  // (the banner queue serialises collisions), and the dwell floor keeps each
  // slam readable at 16x.
  var HEAT_CALLS = ['', 'HEATING UP', 'ON A TEAR', 'RAMPAGE!'];
  var heatSeen = { red: 0, blue: 0 };  // current rung, for edge detection
  // FIRST-ASCENT-ONLY (Maxwell's ruling): a streak that oscillates around one
  // waterline is ONE story, not three. heatCalled is the announced high-water
  // rung -- a demotion never calls out and never resets it, so dropping a
  // flame and bouncing straight back to the same rung is silent. It re-arms
  // two ways: a HIGHER rung (a genuinely new chapter), or the same rung after
  // HEAT_RECALL_TICKS of match time (the streak cooled long enough that
  // "heating up" is news again).
  var heatCalled = { red: 0, blue: 0 };
  var heatCallTick = { red: -1e9, blue: -1e9 };
  var HEAT_RECALL_TICKS = 60 * FPS;
  function heatRungOf(h) { return h >= 8 ? 3 : h >= 4 ? 2 : h >= 2 ? 1 : 0; }
  function trackHeat(s, resync) {
    if (!s.teams) return;
    ['red', 'blue'].forEach(function (team) {
      var t = s.teams[team];
      if (!t) return;
      var rung = heatRungOf(t.heat || 1);
      var prev = heatSeen[team];
      heatSeen[team] = rung;
      if (resync) {
        // A seek lands mid-story: adopt the current rung as already-told
        // (announcing a stale streak the viewer never watched build would be
        // noise) and stamp NOW so a bounce-back stays silent until it cools.
        heatCalled[team] = rung;
        heatCallTick[team] = s.t;
        return;
      }
      if (rung <= prev) return;              // only an ascent can call out
      // RAMPAGE-ONLY (Maxwell): the lower tiers fired too often to narrate --
      // dark pending threshold tuning (their per-episode frequency is being
      // measured off fullGlorySeries; see the round notes). The top tier is
      // the only rung that is always a story.
      if (rung < 3) return;
      var cooled = (s.t - heatCallTick[team]) > HEAT_RECALL_TICKS;
      if (rung <= heatCalled[team] && !cooled) return;  // already told
      heatCalled[team] = rung;
      heatCallTick[team] = s.t;
      banner(HEAT_CALLS[rung], 'heat ' + team + '-accent',
        { sub: team.toUpperCase() + ' TEAM', flames: rung, hold: 'heat' });
    });
  }

  // ---------- per-team claim toast lanes (chat stacks, ~4s fade) ----------
  // Event-driven transient FX like the feed and the banner lane above; cleared
  // by the SAME jump guard (see the `jumped` block in onFrame), so a seek or a
  // loop can never leave a phantom claim on screen. Chat-style per team: RED
  // stacks in the bottom-left, BLUE in the bottom-right above the killfeed's
  // reserve. Newest APPENDS at the bottom and the stack grows upward; each
  // toast holds the 'achtoast' dwell floor (~4s) then fades; over the visible
  // cap the OLDEST fades early, so a burst reads as scrolling chat, not a wall.
  var achToastLanes = { red: $('achtoast-red'), blue: $('achtoast-blue') };
  var ACH_TOAST_MAX = 4; // visible cap per side
  var achToastGen = 0;   // bumped by clearAchToasts so a cleared toast's
                         // pending timers can't touch a lane that moved on
  var REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
  function achToastLeave(t, gen) {
    if (gen !== achToastGen || !t.parentNode || t.classList.contains('leaving')) return;
    t.classList.add('leaving');
    setTimeout(function () {
      if (gen === achToastGen && t.parentNode) t.parentNode.removeChild(t);
    }, 300);
  }
  function achToast(team, e) {
    var lane = achToastLanes[team];
    if (!lane) return;
    var gen = achToastGen;
    var t = document.createElement('div');
    t.className = 'ach-toast ' + team + (e.first ? ' first' : '');
    // The ledger row's exact vocabulary: stars, name, right-anchored payout.
    t.innerHTML = '<span class="at-stars">' +
      new Array((e.tier || 0) + 2).join('*') + '</span>' +
      '<span class="at-name">' + esc(e.name) + '</span>' +
      '<span class="at-pay">+' + (e.glory || 0) + 'g</span>';
    lane.appendChild(t); // append = newest at the BOTTOM (chat order)
    // lever 1 (animFactor cap) — but never as an inline style under reduced
    // motion, where it would override the media rule that stills the toast.
    if (!(REDUCED_MOTION && REDUCED_MOTION.matches))
      t.style.animationDuration = (250 / animFactor()) + 'ms';
    // over the cap: the oldest still-live toasts (top of the stack) fade early
    var live = [];
    for (var i = 0; i < lane.children.length; i++)
      if (!lane.children[i].classList.contains('leaving')) live.push(lane.children[i]);
    for (var k = 0; k < live.length - ACH_TOAST_MAX; k++) achToastLeave(live[k], gen);
    var hold = dwellFloor('achtoast'); // lever 2: wall-clock ~4s chat dwell
    setTimeout(function () { achToastLeave(t, gen); }, hold);
  }
  function clearAchToasts() {
    achToastGen++;
    if (achToastLanes.red) achToastLanes.red.innerHTML = '';
    if (achToastLanes.blue) achToastLanes.blue.innerHTML = '';
  }

  // ---------- scrubber beat markers ----------
  var scrubEl = $('scrub');
  function markBeat(tick, kind, team) {
    var mk = tick + '|' + kind;
    if (seenMarkers[mk]) return;
    seenMarkers[mk] = { tick: tick, kind: kind, team: team || '' };
    pendingMarkers.push(seenMarkers[mk]);
  }
  // A kill tick is colored by the KILLER's team; a team-kill or an
  // unattributable same-tick pileup stays honestly neutral.
  function killMarkerTeam(e, s) {
    if (e.amb || e.tk || e.killer < 0) return '';
    return teamOf(s, e.killer) || '';
  }
  var pendingMarkers = [];
  function renderBeatMarkers(st, mx) {
    if (!pendingMarkers.length) return;
    var span = Math.max(1, mx - st);
    pendingMarkers.forEach(function (m) {
      var el = document.createElement('div');
      el.className = 'beat-marker ' + m.kind + (m.team ? ' ' + m.team : '');
      el.style.left = (Math.min(1, Math.max(0, (m.tick - st) / span)) * 100) + '%';
      scrubEl.appendChild(el);
    });
    pendingMarkers = [];
  }

  // ---------- glory line (the scrub's ONE momentum lane) ----------
  // The engine ships the full-match glory change-point series ONCE on the
  // first HUD frame — s.gloryLine, entries [tick, redGlory, blueGlory] or
  // [tick, rG, bG, rHeat, bHeat]. This used to be the SECOND lane, under a
  // lives-lead momentum graph (SVG, step line + midline shading) that lived
  // here; that graph and its accumulation state (recordMomentum/
  // ingestLeadSeries, samples keyed by tick) are gone — glory is the score,
  // so glory is the one momentum read now. The lane draws red-minus-blue as
  // a differential area in the scrub's track:
  // the leading team's color owns the bulge, zero is a quiet hairline
  // mid-band, and the shared amber playhead rides a curve that is fully drawn
  // from frame one (seek-safe by construction — only the head moves). An
  // absent series (old bundle) means the lane never mounts at all.
  var fullGlorySeries = null;
  var gloryDirty = false;
  var glorySeenHeat = false;
  function hexRgba(hex, a) {
    // canvas gradients have no stop-opacity: derive rgba from the shared hex
    var n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')';
  }
  function ingestGlorySeries(s) {
    if (!s.gloryLine || fullGlorySeries) return;
    fullGlorySeries = s.gloryLine.map(function (p) {
      return { t: p[0] || 0, r: p[1] || 0, b: p[2] || 0, rh: p[3] || 0, bh: p[4] || 0 };
    });
    if (!fullGlorySeries.length) return; // shipped-but-empty: keep the lane down
    glorySeenHeat = fullGlorySeries.some(function (p) { return p.rh || p.bh; });
    gloryDirty = true;
    $('scrub').classList.add('has-glory');
    relayout(); // the band grew a lane: re-reserve --band so it never overlaps play
  }
  function renderGloryLine() {
    if (!fullGlorySeries || !fullGlorySeries.length || !lastState) return;
    // end-of-line readout: the LIVE numbers (same source as the scorebug),
    // refreshed every frame even though the finished curve never redraws
    var ro = $('glory-readout');
    var tr = lastState.teams || {};
    var rg = (tr.red && tr.red.glory) || 0, bg = (tr.blue && tr.blue.glory) || 0;
    var roKey = rg + '|' + bg;
    if (ro._key !== roKey) {
      ro._key = roKey;
      ro.innerHTML = '<span class="gr-red">' + rg + '</span> · <span class="gr-blue">' + bg + '</span>';
    }
    var cv = $('glorytrack');
    var w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return; // tiny stage (lane hidden) or pre-layout
    var dpr = window.devicePixelRatio || 1;
    var pw = Math.round(w * dpr), ph = Math.round(h * dpr);
    if (cv.width !== pw || cv.height !== ph) { cv.width = pw; cv.height = ph; gloryDirty = true; }
    if (!gloryDirty) return;
    gloryDirty = false;
    var ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    // same dark backing as the lives-lead lane: both tracks read on one ground
    ctx.fillStyle = 'rgba(11,7,4,0.55)';
    ctx.fillRect(0, 0, w, h);
    var mid = h / 2;
    // the seek track's trimmed [startTick, maxTick] axis, 1:1 with the playhead
    var st = Math.max(0, lastState.st || 0);
    var mx = Math.max(st + 1, lastState.mx || 1);
    function xOf(t) { return Math.min(1, Math.max(0, (t - st) / (mx - st))) * w; }
    // per-side autoscale with zero pinned mid — same policy as the lives lane:
    // the biggest lead touches its edge while the red/blue split stays honest
    var pts = fullGlorySeries;
    var maxPos = 1, maxNeg = 1, i, d;
    for (i = 0; i < pts.length; i++) {
      d = pts[i].r - pts[i].b;
      if (d > maxPos) maxPos = d;
      if (-d > maxNeg) maxNeg = -d;
    }
    function yOf(dd) {
      return dd >= 0 ? mid - (dd / maxPos) * (mid - 1.5)
                     : mid + (-dd / maxNeg) * (mid - 1.5);
    }
    // change-point semantics: hold each value, step at the next entry, and
    // hold the last value to the end of the axis
    function traceStep() {
      var py = yOf(pts[0].r - pts[0].b);
      ctx.moveTo(xOf(pts[0].t), py);
      for (var k = 1; k < pts.length; k++) {
        var xk = xOf(pts[k].t);
        ctx.lineTo(xk, py);
        py = yOf(pts[k].r - pts[k].b);
        ctx.lineTo(xk, py);
      }
      ctx.lineTo(w, py);
    }
    // zero axis: the quiet hairline the bulge reads against
    ctx.strokeStyle = hexRgba(PAPER, 0.22);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(0, mid);
    ctx.lineTo(w, mid);
    ctx.stroke();
    // differential area: the leading team's color owns the bulge (hard
    // gradient stop at the midline, exactly like the lives lane's momfill)
    ctx.beginPath();
    traceStep();
    ctx.lineTo(w, mid);
    ctx.lineTo(xOf(pts[0].t), mid);
    ctx.closePath();
    var grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, hexRgba(RED, 0.8));
    grad.addColorStop(0.5, hexRgba(RED, 0.28));
    grad.addColorStop(0.5, hexRgba(BLUE, 0.28));
    grad.addColorStop(1, hexRgba(BLUE, 0.8));
    ctx.fillStyle = grad;
    ctx.fill();
    // the step line itself, paper like the lives lane's stroke
    ctx.beginPath();
    traceStep();
    ctx.strokeStyle = hexRgba(PAPER, 0.85);
    ctx.lineWidth = 1.25;
    ctx.stroke();
    // x4+ heat windows: subtle flame-amber ticks along the lane's top edge.
    // Skipped cleanly when the series ships without the heat columns.
    if (glorySeenHeat) {
      ctx.strokeStyle = hexRgba(AMBER, 0.75);
      ctx.lineWidth = 2;
      ctx.setLineDash([2.5, 3]);
      ctx.beginPath();
      for (i = 0; i < pts.length; i++) {
        if (Math.max(pts[i].rh, pts[i].bh) < 4) continue;
        ctx.moveTo(xOf(pts[i].t), 1);
        ctx.lineTo(i + 1 < pts.length ? xOf(pts[i + 1].t) : w, 1);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // ============================================================
  //  End-card (§5/§8) — the END SEGMENT: verdict, win condition and match
  //  stats, held on screen by the server for ~10s before a looping restart.
  //  Reads isDraw BEFORE winner (F4); names the key (F3).
  // ============================================================
  function endcardWinCondition(o) {
    // The condition CHIP: how the match ended, in two or three words.
    if (o.draw) return o.timeLimit ? 'TIME LIMIT — DRAW' : 'DRAW';
    if (o.timeLimit) {
      var winL = o.winner === 'red' ? o.redLives : o.blueLives;
      var loseL = o.winner === 'red' ? o.blueLives : o.redLives;
      return winL !== loseL ? 'TIME LIMIT — LIVES TIEBREAK' : 'TIME LIMIT — HEART PROGRESS';
    }
    var loserLives = o.winner === 'red' ? o.blueLives : o.redLives;
    return loserLives <= 0 ? 'ELIMINATION' : 'HEART CAPTURE';
  }

  function endcardOrder(a, b) {
    // Kills lead the board; fewer deaths, then captures, break ties.
    return (b.k || 0) - (a.k || 0) || (a.d || 0) - (b.d || 0) ||
      (b.cap || 0) - (a.cap || 0) || a.s - b.s;
  }

  function endcardBadge(cls, count, title) {
    // One honor icon; repeat events fold into a ·N suffix instead of stacking.
    if (!count) return '';
    return '<span class="ec-badge ' + cls + '" title="' + title + '">' +
      (count > 1 ? '·' + count : '') + '</span>';
  }

  function renderEndcardRows(s, team, el, mvpSlot) {
    // Final per-player stat lines, top killer first. The MVP (winning team's
    // best line) reads in amber — no star prefix, it would break the name
    // column's alignment. Clstr counts grenade/spray multi-kill events; the
    // Cap column renders the captured enemy heart itself; a dagger icon marks
    // teammate kills.
    var rows = (s.roster || []).filter(function (p) { return p.team === team; })
      .slice().sort(endcardOrder);
    var enemyHeart = team === 'red' ? 'blue' : 'red';
    var html = '';
    rows.forEach(function (p) {
      var mvp = mvpSlot != null && p.s === mvpSlot;
      var marks = endcardBadge('bs', p.tk, 'Own paint — tagged a teammate');
      var cluster = (p.mk2 || 0) + (p.mk3 || 0);
      html += '<div class="ec-row' + (mvp ? ' mvp' : '') + '">' +
        '<span class="pcell">' +
        '<span class="pname">' + esc(shortName(rosterName(s, p.s))) + '</span>' +
        marks +
        '</span>' +
        '<span class="n">' + (p.k || 0) + '</span>' +
        '<span class="n">' + (p.d || 0) + '</span>' +
        '<span class="n clstr">' + (cluster > 0 ? cluster : '') + '</span>' +
        '<span class="n cap">' + (p.cap > 0
          ? '<span class="ec-heart ' + enemyHeart + '" title="Captured the enemy heart"></span>'
          : '') + '</span>' +
        '</div>';
    });
    el.innerHTML = html;
  }

  // ── MATCH GLORY splash ─────────────────────────────────────────────
  // The combined red+blue glory total. Design law (Maxwell, verbatim):
  // "both teams being high in glory is a REALLY GLORIOUS match! So it
  // isn't about 'killing your enemy' like fighting, it is more about
  // having a 'glorious match' like wrestling." The match itself is the
  // performance; the combined total measures how much SHOW was
  // delivered — so a close slugfest outranks a stomp, and a draw can
  // still be one for the archives.
  //
  // TIER THRESHOLDS — approx quintiles of the REAL field, not guesses:
  // tools/ladder/gloryscore.py's scoring path run over the ~/.ctf/scout
  // cache (2026-08-25: n=120 two-team episodes, glory v4, derived path
  // plus the inferred dWipe mint on wipe-ended episodes — the live sim
  // mints dWipe in-engine, so the wipe-corrected numbers are the scale
  // this endcard's s.teams.*.glory actually reads).
  // Combined per-episode glory: p20=1983 p40=2296 p60=2616 p80=3101
  // (min 1363, median 2403, max 4739). Cuts rounded to 2000 / 2300 /
  // 2600 / 3100. Line pick is total % pool.length — deterministic, so
  // a replay always reviews its own show the same way.
  var GLORY_TIERS = [
    { floor: 3100, lines: [ // legendary — top quintile
      'ONE FOR THE ARCHIVES',
      'AN ABSOLUTE CLASSIC',
      "THEY'LL TALK ABOUT THIS ONE",
      'FRAME IT AND HANG IT'] },
    { floor: 2600, lines: [ // great
      'A BARNBURNER!',
      "THE CROWD GOT THEIR MONEY'S WORTH",
      'PAINT ON THE RAFTERS'] },
    { floor: 2300, lines: [ // good
      "NOW THAT'S A PAINT FIGHT",
      'WORTH THE TICKET',
      'THE CANVAS EARNED ITS KEEP'] },
    { floor: 2000, lines: [ // decent
      "AN HONEST NIGHT'S PAINT",
      'SOLID CARD, NO CLASSIC',
      'A FAIR SCRAP, FAIRLY PAINTED'] },
    { floor: 0, lines: [ // dud — bottom quintile
      'A QUIET NIGHT AT THE SHOP',
      'BOTH COATS CAME HOME CLEAN',
      'THE PAINT STAYED IN THE CANS'] }
  ];

  function matchGloryLine(total) {
    for (var i = 0; i < GLORY_TIERS.length; i++) {
      if (total >= GLORY_TIERS[i].floor) {
        var pool = GLORY_TIERS[i].lines;
        return pool[total % pool.length];
      }
    }
    return '';
  }

  function renderEndcard(s) {
    var card = $('endcard');
    if (!s.over) return;
    card.classList.add('on'); // own the frame at GameOver (§8) — before either verdict branch
    var o = s.over;

    // The loop countdown ticks every second while everything else is frozen,
    // so it renders unconditionally; the static content is keyed and only
    // rebuilt when the verdict frame actually changes (24fps hold, no churn).
    $('ec-replay').innerHTML = s.lp && s.hold > 0
      ? 'Replaying in <b>' + s.hold + '</b>' : '';

    var key = [s.mx, o.winner, o.draw, o.timeLimit, (s.roster || []).length].join('|');
    if (card._key === key) return;
    card._key = key;

    var head = $('ec-headline'), how = $('ec-how');
    var redL = o.redLives, blueL = o.blueLives;
    $('ec-red').textContent = redL;
    $('ec-blue').textContent = blueL;
    // The final glory ledger, from the same shipped teams block the scorebug
    // reads -- a match that scores glory all game must settle it at the end.
    var gRed = (s.teams && s.teams.red && s.teams.red.glory) || 0;
    var gBlue = (s.teams && s.teams.blue && s.teams.blue.glory) || 0;
    $('ec-glory-red').textContent = gRed + 'g';
    $('ec-glory-blue').textContent = gBlue + 'g';
    // The achievements ledger settles HERE (the in-match panel is gone):
    // count over the curriculum plus what it PAID, per team, from the same
    // teams.*.claims state the toasts announced. Absent claims (a pre-glory
    // recording) leave the line empty rather than printing a false 0/40.
    ['red', 'blue'].forEach(function (team) {
      var el = $('ec-ach-' + team);
      if (!el) return;
      var claims = s.teams && s.teams[team] && s.teams[team].claims;
      if (!claims) { el.textContent = ''; return; }
      var paid = 0;
      for (var j = 0; j < claims.length; j++) paid += (claims[j].g || 0);
      el.innerHTML = 'Achievements ' + claims.length + '/' + ACH_TOTAL +
        (paid ? ' &middot; <span class="amber">+' + paid + 'g</span>' : '');
    });
    // MATCH GLORY: the COMBINED total (see GLORY_TIERS for the design law
    // and threshold provenance). Winner-agnostic on purpose — it renders
    // identically for draws, and observer mode reads the same teams block.
    // Hidden only when the replay predates the glory ledger entirely: a
    // real 0 is an honest dud, an absent field is not a dud.
    var hasGlory = !!(s.teams && s.teams.red && s.teams.red.glory != null &&
      s.teams.blue && s.teams.blue.glory != null);
    $('mg-splash').style.display = hasGlory ? '' : 'none';
    if (hasGlory) {
      var mg = gRed + gBlue;
      $('mg-num').textContent = mg;
      $('mg-red').textContent = gRed;
      $('mg-blue').textContent = gBlue;
      $('mg-line').textContent = matchGloryLine(mg);
    }
    $('ec-wincond').textContent = endcardWinCondition(o);
    $('ec-tname-red').textContent = teamName(s, 'red', 'RED');
    $('ec-tname-blue').textContent = teamName(s, 'blue', 'BLUE');
    $('ec-team-red').classList.toggle('win', !o.draw && o.winner === 'red');
    $('ec-team-blue').classList.toggle('win', !o.draw && o.winner === 'blue');

    // MVP: the winning team's best final line (kills > fewer deaths >
    // captures — the capturer keeps their ⚑ mark, the star follows the guns).
    // A draw crowns nobody — the fidelity rules never invent a distinction the
    // sim didn't make (F4).
    var mvpSlot = null;
    if (!o.draw) {
      var winners = (s.roster || []).filter(function (p) { return p.team === o.winner; })
        .sort(endcardOrder);
      if (winners.length) mvpSlot = winners[0].s;
    }
    renderEndcardRows(s, 'red', $('ec-rows-red'), mvpSlot);
    renderEndcardRows(s, 'blue', $('ec-rows-blue'), mvpSlot);

    if (o.draw) {
      head.className = 'headline draw';
      head.textContent = 'DRAW — NO SCORE';
      how.textContent = o.timeLimit
        ? 'Time expired before a capture or a whitewash — a scoreless draw, with no tiebreak on lives.'
        : 'The match ended with neither side scoring — no winner.';
      return;
    }

    var winner = o.winner; // 'red' | 'blue'
    var winName = teamName(s, winner, winner === 'red' ? 'RED' : 'BLUE');
    head.className = 'headline ' + winner;
    head.textContent = winName + ' WINS';

    if (o.timeLimit) {
      // Time-limit resolution — name the key and the values (F3).
      var winL = winner === 'red' ? redL : blueL;
      var loseL = winner === 'red' ? blueL : redL;
      if (winL !== loseL) {
        how.textContent = 'Time expired — ' + winName + ' held more lives (' + winL + ' vs ' + loseL + ').';
      } else {
        how.textContent = 'Time expired — lives tied; ' + winName + ' won on heart progress.';
      }
    } else {
      var loserLives = winner === 'red' ? blueL : redL;
      if (loserLives <= 0) {
        head.textContent = winName + ' WHITEWASHES ' + teamName(s, winner === 'red' ? 'blue' : 'red', winner === 'red' ? 'BLUE' : 'RED');
        how.textContent = winName + ' eliminated every opposing life.';
      } else {
        how.textContent = winName + ' captured the enemy heart.';
      }
    }
  }

  // ============================================================
  //  Transport wiring — DOM controls emit the legacy chat chars +
  //  the ctf-side s:/v: whole-string commands.
  // ============================================================
  function togglePlay() { send(' '); }
  function setSpeed(s) {
    var map = { 1: '1', 2: '2', 3: '3', 4: '4', 8: '8', 16: '6' };
    if (map[s]) send(map[s]);
  }
  $('btn-play').addEventListener('click', togglePlay);
  $('btn-restart').addEventListener('click', function () { send(','); });
  $('btn-back').addEventListener('click', function () { send('b'); });
  $('btn-fwd').addEventListener('click', function () { send('.'); });
  $('btn-end').addEventListener('click', function () { send('e'); });
  $('btn-loop').addEventListener('click', function () { send('r'); });
  $('btn-skip').addEventListener('click', function () { send('f'); });

  // click-to-seek: map x-fraction to a tick and send s:<tick>
  $('scrub').addEventListener('click', function (ev) {
    if (!lastState || !lastState.en) return;
    var rect = this.getBoundingClientRect();
    var frac = Math.min(1, Math.max(0, (ev.clientX - rect.left) / rect.width));
    // Map the click back onto the shown [startTick, maxTick] axis.
    var st = Math.max(0, lastState.st || 0);
    var mx = Math.max(st + 1, lastState.mx || 1);
    var tick = st + Math.round(frac * (mx - st));
    send('s:' + tick);
  });

  // pov clear
  $('povBadge').addEventListener('click', function () { send('v:-1'); });
  function togglePov(slot) {
    if (lastState && lastState.pov === slot) send('v:-1');
    else send('v:' + slot);
  }

  // keyboard shortcuts mirror the transport
  window.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var k = ev.key;
    if (k === ' ') { ev.preventDefault(); togglePlay(); }
    else if (k === ',' || k === '<') send(',');
    else if (k === '.' || k === '>') send('.');
    else if (k === 'b') send('b');
    else if (k === 'e') send('e');
    else if (k === 'r') send('r');
    else if (k === 'f') send('f');
    else if (k === '+' || k === '=') send('+');
    else if (k === '-' || k === '_') send('-');
    else if (k >= '1' && k <= '9') send(k);
  });

  // Click a soldier to PIN its inspector card. The card used to follow the
  // hover and the EYES view used to be the click -- both replaced together:
  // a cog outruns the cursor in under a second (Maxwell watched the card
  // vanish mid-read), and a hover card can never carry buttons, because
  // moving toward it unhovers the cog. Now the click pins, the pinned card
  // holds while the cog fights on, and the EYES view lives ON the card as a
  // button. Clicking empty board clears the pin. The hit test stays in Nim:
  // the streamed cursor is already there, and `i:@` just says "resolve it".
  canvas.addEventListener('click', function (ev) {
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    // getBoundingClientRect is CSS px; the core's transform lives in the same
    // CSS space (offsetX/offsetY/scale are computed against clientWidth/Height,
    // NOT the dpr-scaled backing store), so no devicePixelRatio factor here.
    var cssX = ev.clientX - rect.left;
    var cssY = ev.clientY - rect.top;
    var t = core.getTransform();
    if (!t || !t.scale) return;
    var mapX = Math.round((cssX - t.offsetX) / t.scale);
    var mapY = Math.round((cssY - t.offsetY) / t.scale);
    // Ignore clicks in the letterbox bands (outside the drawn map).
    if (mapX < 0 || mapY < 0 || mapX >= t.nativeW || mapY >= t.nativeH) return;
    // Deliver the exact click coordinate BEFORE the pin command, so the hit
    // test cannot run against a stale rAF-coalesced cursor position.
    if (replayAdapter && replayAdapter.setPointer) replayAdapter.setPointer(mapX, mapY);
    send('i:@');
  });

  // The cursor is streamed to the wasm as a pair of scalars (ctf_set_pointer)
  // rather than as a viewer message. It no longer drives the card -- the card
  // is click-PINNED (see the click handler above) -- but the stream stays,
  // because the `i:@` pin command hit-tests against exactly this position,
  // in Nim, where every other hit test lives.
  var pointerPending = null;   // {x, y} coalesced to one send per frame
  var pointerRaf = 0;
  function flushPointer() {
    pointerRaf = 0;
    var p = pointerPending;
    pointerPending = null;
    if (!p) return;
    if (!replayAdapter || !replayAdapter.setPointer) return;
    replayAdapter.setPointer(p.x, p.y);
  }
  function queuePointer(x, y) {
    // pointermove fires far faster than the board redraws; coalescing to one
    // send per animation frame keeps a 100Hz trackpad from crossing the wasm
    // boundary 100 times a second for a card that repaints at 24Hz.
    pointerPending = { x: x, y: y };
    if (!pointerRaf) pointerRaf = requestAnimationFrame(flushPointer);
  }
  canvas.addEventListener('pointermove', function (ev) {
    if (!replayAdapter || !replayAdapter.setPointer) return;
    var rect = canvas.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    // Same inverse-letterbox math as the click handler above, and the same CSS
    // pixel space (no devicePixelRatio factor).
    var t = core.getTransform();
    if (!t || !t.scale) return;
    var mapX = Math.round((ev.clientX - rect.left - t.offsetX) / t.scale);
    var mapY = Math.round((ev.clientY - rect.top - t.offsetY) / t.scale);
    // In the letterbox bands the cursor is not over the arena at all, so PARK
    // it rather than clamping — a clamped coordinate would hover whatever cog
    // happens to sit against that edge.
    if (mapX < 0 || mapY < 0 || mapX >= t.nativeW || mapY >= t.nativeH) {
      queuePointer(-1, -1);
      return;
    }
    queuePointer(mapX, mapY);
  });
  canvas.addEventListener('pointerleave', function () {
    if (!replayAdapter || !replayAdapter.setPointer) return;
    queuePointer(-1, -1);
  });

  // ============================================================
  //  Fixed-aspect fit: size the composition to the board's native aspect
  //  inside the embed box, then scale the whole thing (board + overlays) as
  //  one unit. Chrome sizes off the STAGE width, so overlays stay locked to
  //  the graphics at any container shape (§2, L82 bounded-embed).
  // ============================================================
  function relayout() {
    var boxW = viewport.clientWidth, boxH = viewport.clientHeight;
    if (!boxW || !boxH) return;
    // The board region (game action) fits the board aspect into the box BETWEEN a
    // reserved top band (the scorebug) and bottom band (the transport), so neither
    // ever sits over play. Each band's pixel height depends on --hudscale (→ board
    // width) and the board fit depends on the bands, so iterate twice — the bands
    // are a small fraction of the height, so it converges immediately.
    var scorebug = document.getElementById('scorebug');
    var transport = document.getElementById('transport');
    var root = document.documentElement;
    var topBand = parseFloat(getComputedStyle(root).getPropertyValue('--topband')) || 0;
    var band = parseFloat(getComputedStyle(root).getPropertyValue('--band')) || 0;
    var stageW = 0, stageH = 0;
    for (var pass = 0; pass < 2; pass++) {
      var availH = Math.max(1, boxH - topBand - band);
      var boardW, boardH;
      if (boxW / availH > BOARD_ASPECT) {
        boardH = availH; boardW = Math.round(availH * BOARD_ASPECT);
      } else {
        boardW = boxW; boardH = Math.round(boxW / BOARD_ASPECT);
      }
      stageW = boardW; stageH = boardH + topBand + band;
      stage.style.width = stageW + 'px';
      stage.style.height = stageH + 'px';
      // One scale for the whole composition: chrome was authored against a
      // ~760px-wide reference board, so --hudscale is the board's on-screen width
      // over that reference (clamped so a huge featured embed doesn't bloat the
      // chrome and a tiny 360px floor stays legible).
      var scale = Math.max(0.5, Math.min(1.6, boardW / 760));
      root.style.setProperty('--hudscale', scale.toFixed(3));
      stage.classList.toggle('tiny', boardW <= 620);
      // Measure each band's natural height → reserve exactly that.
      topBand = scorebug ? scorebug.offsetHeight : 0;
      band = transport ? transport.offsetHeight : 0;
      root.style.setProperty('--topband', topBand + 'px');
      root.style.setProperty('--band', band + 'px');
    }
    core.setViewportFit();
    // A resize while paused would otherwise leave the glory lane's canvas
    // stale/blank (renderGloryLine normally runs on ingested frames only).
    renderGloryLine();
  }
  var ro = new ResizeObserver(relayout);
  ro.observe(viewport);
  window.addEventListener('resize', relayout);

  relayout();
  core.start();
})();
</script>
</body>
</html>
