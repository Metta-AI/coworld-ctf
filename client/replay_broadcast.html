@font-face {
  font-family: 'rajdhani';
  src: url('./font.ttf') format('truetype');
  font-display: block;
}

:root {
  --stage-lo: #16110d;
  /* -rgb companions exist ONLY where the file needs the same ink at a second
     alpha (a wash, a hairline, a hover tint) -- every such spot used to repeat
     the literal triplet by hand, which drifts silently the day the hex above
     is retuned. Derive, don't duplicate. */
  --stage-lo-rgb: 22, 17, 13;
  --stage-hi: #241a12;
  --paper: #f2e8d8;
  --paper-rgb: 242, 232, 216;
  --paper-dim: #b8ac98;
  --ink: #2a1f16;
  --ink-soft-rgb: 20, 14, 9;
  --ink-soft: rgba(var(--ink-soft-rgb), 0.62);
  --red: #e0523a;
  --blue: #3f7cc4;
  --amber: #e8a33d;
  --amber-rgb: 232, 163, 61;
  --ghost: #8a7f72;
  --hudscale: 1;
  /* chrome measures derive off the CONTAINER via --hudscale, not the viewport */
  --u: calc(1px * var(--hudscale));
  --pixfont: 'rajdhani', 'Segoe UI', system-ui, sans-serif;
  --finefont: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  /* The letterbox around the composition — warm near-black, NEVER pure #000.
     The Observatory embed hands us an arbitrary box; the fixed-aspect stage is
     centered inside it and this warm tone fills whatever is left over. */
  background: #120d09;
  color: var(--paper);
  font-family: var(--finefont);
  -webkit-font-smoothing: antialiased;
}

/* The embed box. The stage is ONE fixed-aspect composition centered inside it;
   board + every overlay live in the stage and scale together as a single unit
   (§2/L82: chrome sizes off the CONTAINER, not the viewport), so overlays never
   drift from the graphics at any embed size. */
#viewport {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

#stage {
  position: relative;
  /* width/height are set in px by relayout() to the board's native aspect
     (1235:659) fitted into #viewport; the canvas fills it exactly (matching
     aspect → no internal letterbox) and all chrome is pinned in this space. */
  width: 100%;
  height: 100%;
  background:
    radial-gradient(120% 90% at 50% 38%, var(--stage-hi) 0%, var(--stage-lo) 72%);
  overflow: hidden;
}

/* The board fills the frame ABOVE the reserved transport band; broadcast_core
   letterboxes it to native aspect. --band is the bottom strip (set by relayout)
   where the transport lives, so no chrome ever sits over play. */
#board {
  position: absolute;
  left: 0;
  /* canvas is a replaced element: `inset` won't stretch it, so size explicitly.
     The board sits BETWEEN the reserved scorebug band (top) and transport band
     (bottom), so no chrome ever overlaps play. */
  top: var(--topband, 0px);
  width: 100%;
  height: calc(100% - var(--topband, 0px) - var(--band, 0px));
  display: block;
  image-rendering: pixelated;
}

/* A soft light pool focuses the eye on the arena (not a literal set). Matches
   the board area so it never darkens the reserved transport band below. */
#lightpool {
  position: absolute;
  inset: var(--topband, 0px) 0 var(--band, 0px) 0;
  pointer-events: none;
  background:
    radial-gradient(70% 58% at 50% 46%, transparent 40%, rgba(12, 8, 5, 0.34) 100%);
  z-index: 2;
}

/* CRT phosphor grain drift — ambient, paused under prefers-reduced-motion. */
#grain {
  position: absolute;
  inset: -20%;
  pointer-events: none;
  opacity: 0.05;
  z-index: 3;
  background-image:
    repeating-linear-gradient(0deg, rgba(0,0,0,0.5) 0 1px, transparent 1px 3px);
  animation: graindrift 7s steps(4) infinite;
}
@keyframes graindrift { to { transform: translateY(3px); } }

#chrome {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  font-family: var(--pixfont);
}
#chrome > * { pointer-events: auto; }

/* ---------- 1. TOP-BAND SCOREBUG ---------- */
#scorebug {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: grid;
  /* minmax(0,1fr), NOT 1fr: a bare 1fr track floors at its content's min-content
     width, so a long team name would blow the side track out and shove the center
     clock off-center. minmax(0,…) lets each side shrink to 0 and clip via the
     name's own ellipsis at the TRUE track edge — the name then uses all the plate
     room there actually is, instead of an arbitrary hard cap. */
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
  align-items: stretch;
  /* Shrink the whole scorebug group (names, lives numerals, labels, squad pips,
     clock) 20% by scaling the local unit — every measure below derives from --u,
     so one override rescales the band without touching per-element sizes. */
  --u: calc(1px * var(--hudscale) * 0.8);
  gap: calc(6 * var(--u));
  padding: calc(6 * var(--u)) calc(12 * var(--u)) calc(7 * var(--u));
  /* Dedicated top band: a solid warm-dark strip that lives ABOVE the board (its
     measured height = --topband, reserved by relayout), so the scorebug never
     covers play — grenades/players at the top rows stay fully visible. Mirrors
     the bottom transport band. */
  box-sizing: border-box;
  background: var(--stage-lo);
  box-shadow: inset 0 calc(-1 * var(--u)) 0 rgba(var(--paper-rgb), 0.06);
}

.plate {
  display: flex;
  align-items: center;
  gap: calc(9 * var(--u));
  min-width: 0;
}
.plate.blue { flex-direction: row-reverse; text-align: right; }

.plate .team-id { min-width: 0; }
.plate .team-name {
  font-family: var(--pixfont);
  font-size: calc(16 * var(--u));
  letter-spacing: 0.5px;
  line-height: 1;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  /* Inline with Lives + count on ONE row. Let the name shrink and ellipsis so a
     long policy name never pushes the label/count off the plate; the label and
     numeral hold their size. Full name still reads in the CARRYING line + roster.
     No max-width: the minmax(0,1fr) side track already bounds it, so the name
     grows to the full plate width and only ellipsizes when it genuinely runs out
     of room — not at an arbitrary early cap. */
  flex: 0 1 auto;
  min-width: 0;
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.plate.red .team-name { color: var(--red); }
.plate.blue .team-name { color: var(--blue); }

/* One baseline row with the COLOR NAME innermost (toward the center clock),
   GLORY beside it — GLORY IS THE SCORE, so it is the headline numeral of the
   row now; lives is a resource and rides the squad-pip row below instead
   (see .squad-row / .lives-mini). Red reverses; blue keeps DOM order
   (name → label → num). */
.plate .lives-line {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
}
.plate.red .lives-line { flex-direction: row-reverse; }
/* The demoted LIVES numeral (squad-pip row): a quiet secondary read, well
   under the glory headline it used to outrank. */
.lives-num {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  line-height: 1;
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  flex: none;
}
.lives-label {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
  flex: none;
}
/* GLORY owns this row outright now (lives moved out to the squad-pip row),
   so growing it still costs play area — relayout() writes
   #scorebug.offsetHeight straight into --topband, subtracted from the board
   height at every embed size — but that cost buys back legibility for the
   actual score.
   Sized independently at 26u, well above the demoted .lives-num's 11u:
   #scorebug overrides --u to 0.8x locally, so any measure copied in from the
   bottom band lands 20% small. */
.lives-num.glory {
  font-size: calc(26 * var(--u));
  font-variant-numeric: tabular-nums;
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
/* Team ink, not amber. Amber is this chrome's one "you earned this" accent
   (carrier pip, .tbtn.on, the heat flames, achievement pops/toasts) — it
   means glory PAID, and only that. The glory numeral is the score, not a
   payout, so it takes team ink, and amber's job stays narrow: marking the
   events that fed the ledger, never the running total. */
.plate.red .lives-num.glory { color: var(--red); }
.plate.blue .lives-num.glory { color: var(--blue); }
/* HEAT is suppressed at x1 — the sim already refuses to print it there
   (global.nim's team score line), because the resting state is noise on every
   frame of every replay. Show/hide on the .show class, the same pattern the
   fast-forward mini indicator uses. Amber because amber is already this
   chrome's "earned / active" accent (carrier pip, .tbtn.on, .win-chip); a
   rampage does not get a new colour. */
.heat-chip {
  display: none;
  flex: none;
  align-self: center;
  gap: calc(1 * var(--u));
}
.heat-chip.show { display: flex; }
/* The flames ride the headline now: sized up from 9x12u to track the 26u
   glory numeral beside them (was sized against the old 20u lives numeral). */
.heat-chip svg {
  width: calc(12 * var(--u));
  height: calc(16 * var(--u));
  display: block;
}
/* The flames breathe: a rampage is ALIVE, and a static glyph reads like an
   inert badge. Subtle scale flicker, staggered per flame. */
.heat-chip svg { transform-origin: 50% 100%; animation: heat-flick 0.9s ease-in-out infinite alternate; }
.heat-chip svg:nth-child(2) { animation-delay: 0.3s; }
.heat-chip svg:nth-child(3) { animation-delay: 0.6s; }
@keyframes heat-flick { from { transform: scaleY(0.92); } to { transform: scaleY(1.06); } }
/* squad-row: the pip strip plus the demoted Lives read, trailing it. Wraps
   both so the row-level margin-top applies once instead of misaligning the
   two flex children against each other. */
.squad-row {
  display: flex;
  align-items: center;
  gap: calc(8 * var(--u));
  margin-top: calc(3 * var(--u));
}
/* Squad strip: ONE pip per player (8). Lit = alive, dim = down-but-has-lives,
   hollow = eliminated. The strip is the "who's left" read; GLORY (above) is
   now the big numeral — this row just says who's left and how many lives.
   Each pip is clickable → POV lens (fog-honesty). */
.squad {
  display: flex;
  gap: calc(3 * var(--u));
}
.plate.blue .squad { justify-content: flex-end; }
/* Bare "Lives N", not "N/M": the sim ships no team-level lives max, and the
   per-player "lives n/m" context already lives in the inspector card
   (hover a cog) — this is just the team's remaining count. */
.lives-mini {
  display: flex;
  align-items: baseline;
  gap: calc(3 * var(--u));
}
.squad-pip {
  width: calc(9 * var(--u));
  height: calc(9 * var(--u));
  background: currentColor;
  opacity: 0.92;
  cursor: pointer;
  position: relative;
  transition: opacity 140ms, transform 140ms;
}
.squad-pip:hover { transform: translateY(calc(-1 * var(--u))); }
.squad-pip.down { opacity: 0.3; }                              /* dead, lives left */
.squad-pip.out {                                              /* eliminated */
  background: transparent;
  box-shadow: inset 0 0 0 calc(1.5 * var(--u)) currentColor;
  opacity: 0.28;
}
.squad-pip.carry {                                            /* has the flag */
  background: var(--amber);
  box-shadow: 0 0 calc(7 * var(--u)) var(--amber);
}
.squad-pip.pov {                                             /* POV lens active */
  box-shadow: 0 0 0 calc(1.5 * var(--u)) var(--paper);
}
.plate.red .squad { color: var(--red); }
.plate.blue .squad { color: var(--blue); }

/* flag-state icon — HOME (on pedestal) / TAKEN (riding a carrier). F2: two states only. */
.flagicon {
  position: relative;
  width: calc(26 * var(--u));
  height: calc(30 * var(--u));
  flex: none;
}
.flagicon svg { width: 100%; height: 100%; display: block; }
/* transform-box:fill-box so SVG transforms pivot about the cloth's own box,
   not the viewBox edge (else the flip mirrors off-screen — invisible-at-vote). */
.flagicon .cloth { transition: transform 90ms steps(3); transform-box: fill-box; transform-origin: left center; }
.flagicon.taken .cloth { transform: scaleX(0.62) skewX(-8deg); }
.flagicon.flip { animation: flagflip 260ms steps(3); transform-box: fill-box; transform-origin: center; }
@keyframes flagflip { 0% { transform: scaleY(0.2); } 100% { transform: scaleY(1); } }
.flagicon .carrier-tag {
  position: absolute;
  bottom: calc(-11 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.08em;
  white-space: nowrap;
  color: var(--amber);
  text-transform: uppercase;
}

/* center clock pill + phase */
.clock {
  position: relative; /* anchors the fast-forward mini indicator */
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: calc(3 * var(--u));
  padding-top: calc(1 * var(--u));
}
/* Tiny amber ▸▸ riding the right of the match clock while skip-lulls is
   actually fast-forwarding — the at-a-glance "time is compressed" cue. */
.ffwd-mini {
  display: none;
  position: absolute;
  left: calc(100% + 5 * var(--u));
  top: calc(6 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(12 * var(--u));
  color: var(--amber);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
}
.ffwd-mini.show { display: block; }
.clock .time {
  font-family: var(--pixfont);
  /* The clock is the centerpiece: with the name folded into the lives row the
     side plates are one row shorter, so grow the time numeral into that freed
     vertical space and let it anchor the band. */
  font-size: calc(30 * var(--u));
  line-height: 1;
  color: var(--paper);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
  font-variant-numeric: tabular-nums;
}
.clock .caption {
  font-family: var(--finefont);
  font-size: calc(8.5 * var(--u));
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--paper-dim);
  white-space: nowrap;
}
.clock.tiebreak-warn .time { color: var(--amber); }

/* Center column holds just the clock now — the capture-chase gauge was retired
   in favor of the two bottom carry indicators. */
.clock-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(4 * var(--u));
}

/* Clock pill soft tick — the third chrome ambient (§11). A near-imperceptible
   breathe on the pill, so the countdown reads as a live instrument, not a label. */
.clock.amb { animation: clocktick 2s ease-in-out infinite; }
@keyframes clocktick { 0%,100% { opacity: 0.94; } 50% { opacity: 1; } }

/* leader pulse keys on GLORY lead (glory is the score) — >=100g, ~8% of a
   typical full-match team total (~1200g, see GLORY_TIERS provenance).
   Lives lead >=3 is kept only as the JS fallback for pre-glory replays, so
   this always targets the GLORY numeral, never the demoted lives one. */
.plate.leader .lives-num.glory { animation: leaderpulse 1.9s ease-in-out infinite; }
@keyframes leaderpulse { 0%,100% { text-shadow: none; } 50% { text-shadow: 0 0 calc(10 * var(--u)) var(--amber); } }

/* Beat-pause (§11): idle systems freeze the instant a beat lands, so ambient
   never competes with a kill/steal/capture for the eye. Applied on #stage; the
   engine-driven board (24Hz) is untouched — only chrome ambient pauses. */
#stage.beat-active .amb,
#stage.beat-active .plate.leader .lives-num.glory { animation-play-state: paused; }

/* ---------- 3. BANNER LANE ---------- */
#bannerlane {
  position: absolute;
  top: calc(78 * var(--u));
  left: 0; right: 0;
  display: flex;
  justify-content: center;
  pointer-events: none;
  z-index: 12;
  min-height: calc(46 * var(--u)); /* reserved slot: layout never jumps */
}
/* Medal-slam presentation (arena-shooter juice: IMPACT, then settle). The
   chip slams in oversized on a hard-overshoot bezier (scale 1.55 past 1.0 to
   ~0.96, back to rest), a 60ms brightness flash marks the arrival, then the
   amber underline sweeps in (scaleX 0→1) once the type has landed. Exit is a
   quick 160ms rise + fade. --bf is the animFactor cap set inline by
   pumpBanner, so every duration/delay here scales with playback speed up to
   the 2× ceiling — a 16× scrub can never reduce the slam to a subliminal
   flash (lever 1); the dwell floor (lever 2) still owns the hold. */
.banner-chip {
  --bf: 1;
  position: relative;
  font-family: var(--pixfont);
  font-size: calc(24 * var(--u));
  font-weight: 700;
  line-height: 1;
  letter-spacing: 0.05em;
  text-align: center;
  padding: calc(7 * var(--u)) calc(20 * var(--u)) calc(9 * var(--u));
  color: var(--paper);
  background: var(--ink-soft);
  text-transform: uppercase;
  white-space: nowrap;
  /* the competitive lean; every animated transform repeats the skew so the
     slam never un-skews mid-flight */
  transform: skewX(-6deg);
  animation:
    slam-in calc(120ms / var(--bf)) cubic-bezier(.18, 1.9, .32, 1) both,
    slam-flash calc(60ms / var(--bf)) ease-out calc(110ms / var(--bf));
}
.banner-chip .slam-text { display: block; }
.banner-chip .slam-sub {
  display: block;
  font-size: calc(9 * var(--u));
  font-weight: 600;
  letter-spacing: 0.18em;
  color: var(--paper-dim);
  margin-top: calc(3 * var(--u));
}
/* the amber "earned" rule, swept in after the slam lands */
.banner-chip .slam-rule {
  position: absolute;
  left: calc(10 * var(--u)); right: calc(10 * var(--u)); bottom: 0;
  height: calc(3 * var(--u));
  background: var(--amber);
  transform: scaleX(0);
  transform-origin: left center;
  animation: rule-sweep calc(140ms / var(--bf)) ease-out calc(130ms / var(--bf)) forwards;
}
.banner-chip.returned .slam-rule { background: var(--paper-dim); }
/* team ownership is the TYPE's color, not a side stripe: the medal reads
   red/blue at a glance even mid-fight */
.banner-chip.red-accent .slam-text { color: var(--red); }
.banner-chip.blue-accent .slam-text { color: var(--blue); }
.banner-chip.wipe { font-size: calc(28 * var(--u)); }
/* heat-streak callouts ride the same slam; flames sit beside the words in the
   chrome's amber (the scorebug flame language, sized up — amber = earned) */
.banner-chip .slam-flames { display: inline-block; margin-right: calc(6 * var(--u)); }
.banner-chip .slam-flames svg {
  width: calc(15 * var(--u));
  height: calc(20 * var(--u));
  display: inline-block;
  vertical-align: calc(-2 * var(--u));
}
.banner-chip.leaving { animation: slam-out calc(160ms / var(--bf)) ease-in forwards; }
@keyframes slam-in {
  from { transform: skewX(-6deg) scale(1.55); opacity: 0; }
  to { transform: skewX(-6deg) scale(1); opacity: 1; }
}
@keyframes slam-flash { from { filter: brightness(1.9); } to { filter: brightness(1); } }
@keyframes rule-sweep { to { transform: scaleX(1); } }
@keyframes slam-out { to { opacity: 0; transform: skewX(-6deg) translateY(calc(-8 * var(--u))); } }

/* ---------- 2. KILL FEED ---------- */
#killfeed {
  position: absolute;
  /* Bottom-right, clear of the blue scorebug/roster (top) and the transport
     bar (bottom) — anchored to --band, the transport's MEASURED height, so a
     taller band (the glory lane) can never swallow the feed. column-reverse
     so the newest row sits lowest, nearest the transport, and older kills
     stack upward — a broadcast lower-third feed. */
  bottom: calc(var(--band, 0px) + 8 * var(--u));
  right: calc(12 * var(--u));
  display: flex;
  flex-direction: column-reverse;
  gap: calc(4 * var(--u));
  align-items: flex-end;
  width: calc(228 * var(--u));
  min-height: calc(4 * 22 * var(--u)); /* fixed 4-row reserve */
  z-index: 11;
  /* Rows are display-only (no click handlers) — never let the feed intercept a
     drag meant for the PiP or the board beneath it. */
  pointer-events: none;
}
.feed-row {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  background: var(--ink-soft);
  font-family: var(--pixfont);
  /* A touch smaller than the scorebug type so full 8-char names stay compact;
     everything is in --u so the row scales with the board (responsive). */
  font-size: calc(8 * var(--u));
  line-height: 1;
  /* Size to content so full names never truncate; rows are right-anchored
     (align-items:flex-end on #killfeed) so a long row grows leftward — bounded
     by the small font + the pre-bounded 10-char name, so it can't run away. */
  max-width: none;
  white-space: nowrap;
  animation: feedin 250ms cubic-bezier(.2,1.3,.5,1);
}
.feed-row.leaving { animation: feedout 260ms ease-in forwards; }
@keyframes feedin { from { transform: translateX(calc(30 * var(--u))); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes feedout { to { opacity: 0; transform: translateX(calc(14 * var(--u))); } }
.feed-row .who { white-space: nowrap; }  /* names are pre-bounded to 10 chars by shortName(); show in full, never ellipsize */
.feed-row .who.red { color: var(--red); }
.feed-row .who.blue { color: var(--blue); }
.feed-row .glyph { color: var(--paper); font-size: calc(9 * var(--u)); }
.feed-row .badge {
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: calc(1 * var(--u)) calc(4 * var(--u));
  color: var(--stage-lo);
  background: var(--amber);
}
.feed-row .badge.tk { background: var(--red); color: var(--paper); }
.feed-row .badge.carrier { background: var(--amber); }
.feed-row.flagkill { box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }

/* Roster rails removed: per-player state now rides the scorebug squad strip
   (the roster IS the counter, genre convention) and the board's own name tags.
   No floating bordered rails over the arena flanks (in-world, no HUD chrome). */

/* POV eye badge shown when a slot is inspected (fog-honesty lens) */
#povBadge {
  position: absolute;
  top: calc(64 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  align-items: center;
  gap: calc(5 * var(--u));
  padding: calc(3 * var(--u)) calc(9 * var(--u));
  background: var(--ink-soft);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--amber);
  z-index: 12;
  cursor: pointer;
}
#povBadge.on { display: flex; }

/* ---------- INSPECTOR CARD (hover a cog) ----------
   Plain HTML inside #chrome, NOT a registered sprite layer. That is the whole
   point: a UI layer sized to the screen paints opaque over the entire board and
   black-screens this viewer (the scar behind InspectorWidth/Height = 8), and a
   DOM node has no viewport to get wrong. It is also the only thing that CAN
   work here — broadcast_core composites only ZoomableFlag/MapLayerType layers,
   so the sim's own InspectorLayerId card has never been a single pixel in this
   bundle.
   Top-RIGHT, below the reserved scorebug band: the killfeed owns bottom-right
   and the first-person PiP owns bottom-left, so this is the one free corner
   over play. Every line is server-composed text (see broadcast.buildStateJson's
   `insp`); the browser only styles what it is handed. */

/* The achievement ledger PANEL is gone (Maxwell's ruling: the board is the
   show — achievements are corner chat toasts, not lists parked over play).
   Live claims: the per-team toast lanes below. Durable record: the endcard's
   per-team Achievements line (.ec-ach). Mid-match state read: the inspector
   card's server-composed ACHIEVEMENTS line. */

/* Per-team claim toasts — fading chat lanes in the bottom corners. Each achv
   claim spawns one compact line (stars + NAME + right-anchored payout, the
   ledger row's exact vocabulary) in its team's corner: RED bottom-LEFT, BLUE
   bottom-RIGHT. Chat order: newest at the bottom, the stack grows upward,
   ~4s dwell, cap 4 visible per side with the oldest fading early. The
   BOARD-rendered chip over the earning cog stays as the spatial pointer;
   this is the corner record — and because it works at every stage size it
   REPLACES the old #achtiny tiny-breakpoint stand-in outright (one system,
   all sizes, per-team).
   Corner tenants: every bottom anchor rides --band (the transport's MEASURED
   height, written by relayout) — a fixed offset went stale the moment the
   glory lane grew the band, and parked this lane ON the transport buttons.
   RED sits 8u above the band, over the FPV pip's default berth (acceptable
   overlap — the pip is draggable); BLUE also clears the killfeed's reserve
   (band + 8u feed bottom + 88u four-row reserve + 8u air). */
#achtoast-red, #achtoast-blue {
  position: absolute;
  display: flex;
  flex-direction: column;
  gap: calc(4 * var(--u));
  z-index: 11;
  pointer-events: none;
}
#achtoast-red { left: calc(12 * var(--u)); bottom: calc(var(--band, 0px) + 8 * var(--u)); align-items: flex-start; }
#achtoast-blue { right: calc(12 * var(--u)); bottom: calc(var(--band, 0px) + 104 * var(--u)); align-items: flex-end; }
.ach-toast {
  display: flex;
  align-items: baseline;
  gap: calc(6 * var(--u));
  min-width: calc(118 * var(--u));
  max-width: calc(210 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  background: rgba(var(--stage-lo-rgb), 0.88);  /* GloryChipFillInk @ FillAlpha */
  box-shadow: 0 0 0 1px rgba(var(--amber-rgb), 0.8); /* GloryChipEdgePx */
  font-family: var(--pixfont);
  /* Absolute legibility floor inherited from the deleted #achtiny chip: --u
     bottoms out at 0.5, and this toast is now the claim's only off-board
     record at the 640x360 floor — it must never scale below reading size. */
  font-size: max(11px, calc(8 * var(--u)));
  line-height: 1.2;
  white-space: nowrap;
  animation: feedin 250ms cubic-bezier(.2,1.3,.5,1);
}
.ach-toast.leaving { animation: feedout 260ms ease-in forwards; }
/* the red lane hugs the LEFT edge, so its slide mirrors to enter from it */
#achtoast-red .ach-toast { animation-name: achchipin; }
#achtoast-red .ach-toast.leaving { animation-name: achchipout; }
.ach-toast .at-stars { color: var(--amber); letter-spacing: 0.06em; }
.ach-toast .at-name {
  flex: 1 1 auto;
  min-width: 0; /* load-bearing, same as the panel rows: the payout must be
                   the LAST thing to go, never the first */
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--paper);
}
.ach-toast.red .at-name { color: var(--red); }
.ach-toast.blue .at-name { color: var(--blue); }
.ach-toast .at-pay { flex: none; margin-left: auto; color: var(--amber); font-variant-numeric: tabular-nums; }
/* A FIRST claim keeps the board chip's exact distinction: the whole line in
   the hotter gold-white (GloryChipFirstInk, 250,222,156 — deliberately not a
   :root token; it exists to match the sim constant, nothing else may use it)
   plus the thicker edge (GloryChipFirstEdgePx). No wordmark, same words. */
.ach-toast.first, .ach-toast.first .at-stars, .ach-toast.first .at-name,
.ach-toast.first .at-pay { color: rgb(250, 222, 156); }
.ach-toast.first { box-shadow: 0 0 0 2px rgba(250, 222, 156, 0.8); }
/* feedin/feedout's overshoot-and-settle idiom, mirrored to slide from the
   LEFT edge the red lane is anchored to (blue rides feedin/feedout as-is). */
@keyframes achchipin { from { transform: translateX(calc(-30 * var(--u))); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes achchipout { to { opacity: 0; transform: translateX(calc(-14 * var(--u))); } }

#inspector {
  display: none;
  position: absolute;
  top: calc(var(--topband, 0px) + 10 * var(--u));
  right: calc(12 * var(--u));
  /* Sized to CONTENT, then bounded: the card grows with the team's achievement
     ledger (up to 10 named claims), and an unbounded card would eventually
     reach the transport band. */
  width: max-content;
  max-width: calc(230 * var(--u));
  /* Bounded by the KILL FEED, not by the board: the feed is anchored at
     --band + 8u with a fixed 88u four-row reserve, so the bottom band + 96u
     of this column is spoken for whether or not a row is live — and the feed
     is later in the DOM, so it would paint straight over the card's oldest
     achievement lines. 10u more leaves a few u of air between them. The type
     below is set so a FULL card (rank + buffs + every counter + ten named
     claims) fits inside this budget rather than being silently clipped. */
  max-height: calc(100% - var(--topband, 0px) - var(--band, 0px) - 106 * var(--u));
  overflow: hidden;
  padding: calc(6 * var(--u)) calc(9 * var(--u));
  background: rgba(var(--stage-lo-rgb), 0.92);
  font-family: var(--pixfont);
  /* 8u is the kill feed's own register — the card is a dense stat block, and
     sizing it with the feed keeps the two lower-thirds reading as one system. */
  font-size: calc(8 * var(--u));
  line-height: 1.4;
  letter-spacing: 0.02em;
  color: var(--paper-dim);
  z-index: 11;
  /* Interactive: the card is click-PINNED now, so the pointer arriving on it
     is deliberate, and the footer buttons (EYES view / close) need to be
     clickable. The old hover card had to be pointer-transparent because the
     cursor that opened it was still chasing the cog underneath. */
  pointer-events: auto;
}
#inspector .ins-actions {
  display: flex;
  gap: calc(6 * var(--u));
  margin-top: calc(5 * var(--u));
}
#inspector .ins-btn {
  font-family: var(--pixfont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.06em;
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  background: rgba(var(--paper-rgb), 0.08);
  border: 1px solid rgba(var(--paper-rgb), 0.25);
  color: var(--paper-dim);
  cursor: pointer;
}
/* WCAG 2.2 AA target minimum. Everything else on this card scales with --u
   (= 1px * hudscale, clamped 0.5..1.6), and at the 760px reference width that
   put these two buttons at ~17px tall -- under the 24px floor across most of
   the clamp range, not just in tiny embeds. An absolute floor is the only
   thing that holds at every scale. */
#inspector .ins-btn { min-height: 24px; }
#inspector .ins-btn:hover { background: rgba(var(--paper-rgb), 0.16); color: var(--paper); }
#inspector.on { display: block; }
/* WHOSE cog this is, said by a pip in the headline rather than a left accent
   stripe down the card. The stripe was banned visual language and it was also
   the weaker read: it lived at the card's edge, furthest from the name it was
   qualifying, while the pip sits against it. Same pip language as the scorebug
   squad strip, so the two surfaces agree. */
#inspector .ins-head {
  font-size: calc(12 * var(--u));
  color: var(--paper);
  letter-spacing: 0.04em;
  margin-bottom: calc(2 * var(--u));
  display: flex;
  align-items: center;
  gap: calc(6 * var(--u));
}
#inspector .ins-pip {
  flex: none;
  /* em, not u: the .tiny card scales the headline to 19u and the pip must
     stay in proportion to the name it qualifies, not to the stage. */
  width: 0.52em;
  height: 0.52em;
  border-radius: 50%;
}
#inspector.red .ins-pip { background: var(--red); }
#inspector.blue .ins-pip { background: var(--blue); }
#inspector .ins-line { white-space: pre; }
#inspector .ins-line.ins-wrap { white-space: normal; }
/* inspectorLines ships a genuine empty string as its section break (before the
   team GLORY block); render it as the hairline it means, not as dead space. */
#inspector .ins-rule {
  height: 1px;
  background: rgba(var(--paper-rgb), 0.14);
  margin: calc(4 * var(--u)) 0;
}

/* First-person PiP inset: pinned bottom-LEFT (the killfeed owns bottom-right, so
   they never overlap), responsive width (§2 — sized off the stage so it scales
   with the composition). Hidden until a seat is in POV. One quiet hairline
   frames it as a genuine window, not a decorative card. */
#fpv {
  position: absolute;
  left: calc(12 * var(--u));
  bottom: calc(var(--band, 0px) + 8 * var(--u));
  /* Sized/positioned in px once dragged or resized; these are the defaults
     (band-anchored so the transport can never swallow the pip). */
  width: 30%;
  min-width: calc(150 * var(--u));
  max-width: calc(460 * var(--u));
  aspect-ratio: 3 / 2;
  display: none;
  z-index: 11;
  background: rgba(12, 9, 6, 0.42);
  box-shadow: 0 0 0 1px rgba(var(--amber-rgb), 0.34),
    0 calc(6 * var(--u)) calc(18 * var(--u)) rgba(8, 5, 3, 0.45);
  overflow: hidden;
  /* See-through so it never fully hides the arena beneath; grab anywhere to
     move, drag the corner grip to resize. */
  opacity: 0.82;
  cursor: grab;
  transition: opacity 0.12s ease;
}
#fpv.on { display: block; }
#fpv:hover { opacity: 0.97; }
#fpv.dragging, #fpv.resizing { cursor: grabbing; opacity: 0.99; }
#fpv.resizing { cursor: nwse-resize; }
/* Once dragged/resized we pin via left/top + explicit width and drop the
   left/bottom + aspect-ratio anchors so nothing fights. */
#fpv.moved { left: auto; bottom: auto; }
#fpv.sized { aspect-ratio: auto; max-width: none; min-width: 0; }
#fpv-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
  pointer-events: none;   /* clicks fall through to the frame for dragging */
}
/* Resize grip: bottom-right corner (bottom-left is the screen edge when pinned
   bottom-left). The ONLY child that takes pointer events, so drag-to-move works
   everywhere else. */
.fpv-grip {
  position: absolute;
  right: 0; bottom: 0;
  width: calc(16 * var(--u));
  height: calc(16 * var(--u));
  cursor: nwse-resize;
  z-index: 5;
  background:
    linear-gradient(-45deg, transparent 40%, rgba(var(--amber-rgb), 0.55) 42%,
      rgba(var(--amber-rgb), 0.55) 46%, transparent 48%,
      transparent 58%, rgba(var(--amber-rgb), 0.55) 60%,
      rgba(var(--amber-rgb), 0.55) 64%, transparent 66%);
  opacity: 0.6;
}
.fpv-grip:hover { opacity: 1; }
.fpv-cap {
  position: absolute;
  left: calc(6 * var(--u));
  top: calc(4 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--amber);
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
  pointer-events: none;
  opacity: 0.85;
  z-index: 3;
}

/* Self-status HUD: a thin bottom bar reading like a soldier's own readout —
   name at the left, hp as pips, carried gear at the right. Sits over the floor
   half of the raycast so it never masks the horizon action. */
.fpv-hud {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  gap: calc(6 * var(--u));
  padding: calc(3 * var(--u)) calc(7 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  line-height: 1;
  color: var(--paper);
  background: linear-gradient(0deg, rgba(8, 5, 3, 0.82), rgba(8, 5, 3, 0));
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
  pointer-events: none;
  z-index: 3;
}
.fpv-name {
  font-weight: 600;
  letter-spacing: 0.02em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45%;
}
.fpv-name.red { color: var(--red); }
.fpv-name.blue { color: var(--blue); }
.fpv-hp {
  display: inline-flex;
  gap: calc(2 * var(--u));
  align-items: center;
}
.fpv-hp i {
  width: calc(6 * var(--u));
  height: calc(6 * var(--u));
  border-radius: 50%;
  background: var(--amber);
  box-shadow: 0 0 0 1px rgba(8, 5, 3, 0.7);
  display: inline-block;
}
.fpv-hp i.spent { background: rgba(var(--paper-rgb), 0.16); box-shadow: inset 0 0 0 1px rgba(var(--paper-rgb), 0.28); }
.fpv-gear {
  margin-left: auto;
  display: inline-flex;
  gap: calc(4 * var(--u));
  color: var(--paper-dim);
  letter-spacing: 0.02em;
}
.fpv-gear .carry { color: var(--amber); font-weight: 600; }
.fpv-dead .fpv-hp, .fpv-dead .fpv-gear { opacity: 0.4; }

/* Un-fogged tactical minimap inset: top-right corner, arena aspect. Compact and
   see-through so it reads as an overlay on the raycast, not a lid over it. A
   quiet hairline frames it as a genuine window. pointer-events:none so grabbing
   it still drags the whole PiP. */
.fpv-map {
  position: absolute;
  top: calc(4 * var(--u));
  right: calc(4 * var(--u));
  width: 38%;
  aspect-ratio: 1235 / 659;
  background: rgba(8, 5, 3, 0.42);
  box-shadow: 0 0 0 1px rgba(var(--amber-rgb), 0.28);
  overflow: hidden;
  z-index: 2;
  opacity: 0.9;
  pointer-events: none;
}
.fpv-map canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated;
}

/* ---------- 5. TRANSPORT ---------- */
#transport {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  /* Sits in the reserved band BELOW the board — relayout() measures this strip's
     natural height and reserves that much (--band) at the bottom of the frame, so
     the scrubber and buttons never overlap play. A solid warm-dark strip, not a
     fade — there is no arena underneath it to wash over. */
  box-sizing: border-box;
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  padding: calc(8 * var(--u)) calc(12 * var(--u)) calc(8 * var(--u));
  background: var(--stage-lo);
  box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(var(--paper-rgb), 0.06);
}
#transport.disabled { opacity: 0.35; pointer-events: none; }

/* scrubber: click-to-seek track (top) over a full-timeline GLORY graph — the
   momentum lane USED TO be lives lead; glory is the score, so glory is the
   momentum read now (F4). The seek track and the glory graph share the SAME
   0→maxTicks x-axis, so the playhead crosses the graph 1:1 with the timeline
   (no scrolling window). */
.scrub {
  position: relative;
  height: calc(34 * var(--u));
  cursor: pointer;
}
.scrub-track {
  position: absolute;
  left: 0; right: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(var(--paper-rgb), 0.16);
}
.scrub-fill {
  position: absolute;
  left: 0; top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: var(--paper);
  width: 0;
}
.scrub-head {
  /* spans track + graph so the playhead reads against the glory curve */
  position: absolute;
  top: calc(2 * var(--u));
  width: calc(3 * var(--u));
  height: calc(30 * var(--u));
  background: var(--amber);
  transform: translateX(calc(-1.5 * var(--u)));
  left: 0;
  z-index: 3;
}
/* ---------- GLORY LINE: the scrub's ONE momentum lane ----------
   The glory differential is the whole momentum read now — the lives-lead
   graph that used to sit here (and the lane it shared with this one) is
   gone; a resource isn't the show, the score is. Canvas-drawn, on the same
   trimmed 0→maxTicks x-axis as the seek track, so the one amber playhead
   crosses seek track AND glory 1:1, and click-to-seek covers the graph for
   free. Hidden (and the band stays at its old base height) until the engine
   ships s.gloryLine, so old bundles render exactly the chrome they had —
   seek-only, no graph. */
.scrub.has-glory { height: calc(64 * var(--u)); }
.scrub.has-glory .scrub-head { height: calc(60 * var(--u)); }
/* Grown into the space the lives-lead lane freed: the lane roughly doubles
   vertically (26u → 48u) now that it is the only one. */
.glory-track {
  position: absolute;
  left: 0; width: 100%;
  top: calc(12 * var(--u));
  height: calc(48 * var(--u));
  display: none;
}
.scrub.has-glory .glory-track { display: block; }
.glory-label {
  position: absolute;
  left: 0; top: calc(13 * var(--u));
  font-family: var(--finefont);
  font-size: calc(6 * var(--u));
  letter-spacing: 0.12em;
  color: var(--paper-dim);
  opacity: 0.5;
  pointer-events: none;
  z-index: 2;
  display: none;
}
.scrub.has-glory .glory-label { display: block; }
/* end-of-line readout: the SAME numbers as the scorebug — small, quiet,
   tabular — so the curve always ends in its current values */
.glory-readout {
  position: absolute;
  right: calc(2 * var(--u)); top: calc(13 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7 * var(--u));
  font-variant-numeric: tabular-nums;
  color: var(--paper-dim);
  pointer-events: none;
  z-index: 2;
  display: none;
}
.scrub.has-glory .glory-readout { display: block; }
.glory-readout .gr-red { color: var(--red); }
.glory-readout .gr-blue { color: var(--blue); }
/* At the embed floor the band has no room for the graph lane at all — but
   that deferral is correct now, not a compromise: the scorebug's glory
   numeral is the HEADLINE numeral there too (F1, .lives-num.glory), so
   hiding this lane loses nothing, the read just moves up to the scorebug. */
#stage.tiny .scrub.has-glory { height: calc(34 * var(--u)); }
#stage.tiny .scrub.has-glory .scrub-head { height: calc(30 * var(--u)); }
#stage.tiny .glory-track,
#stage.tiny .glory-label,
#stage.tiny .glory-readout { display: none !important; }
.beat-marker {
  position: absolute;
  top: 0;
  width: calc(2 * var(--u));
  height: calc(10 * var(--u));
  transform: translateX(-1px);
  z-index: 2;
}
/* kill ticks are short and colored by the KILLER's team (a red tick = red
   scored a kill); team-kills and unattributable pileups stay neutral. */
.beat-marker.kill { background: var(--paper-dim); height: calc(6 * var(--u)); }
.beat-marker.kill.red { background: var(--red); }
.beat-marker.kill.blue { background: var(--blue); }
/* flag beats are colored by the FLAG's team, matching the banners ("RED
   HEART TAKEN"): steal = full tick with a flag head, return = same tick
   dimmed (the heart snapped home), capture = the chunky match point in the
   CAPTURING team's color. */
.beat-marker.steal { background: var(--amber); }
.beat-marker.steal.red { background: var(--red); }
.beat-marker.steal.blue { background: var(--blue); }
.beat-marker.steal::after {
  content: '';
  position: absolute;
  left: 0; top: 0;
  width: calc(5 * var(--u));
  height: calc(3 * var(--u));
  background: inherit;
}
.beat-marker.return { background: var(--paper-dim); opacity: 0.45; }
.beat-marker.return.red { background: var(--red); }
.beat-marker.return.blue { background: var(--blue); }
.beat-marker.capture { background: var(--red); width: calc(3 * var(--u)); height: calc(12 * var(--u)); }
.beat-marker.capture.blue { background: var(--blue); }
/* an achievement claim: a short amber tick, the same "earned" accent the
   banner rule and the feed badge use, and deliberately shorter than a capture
   so a glory beat never reads as a match point. */
.beat-marker.achv { background: var(--amber); height: calc(5 * var(--u)); opacity: 0.85; }
/* winner cap: a flat block just past the track's right end, colored by the
   verdict (split for a draw), so the scrubber itself says how this ends. */
.scrub-win {
  display: none;
  position: absolute;
  right: calc(-4 * var(--u));
  top: calc(2 * var(--u));
  width: calc(6 * var(--u));
  height: calc(12 * var(--u));
  z-index: 3;
}
.scrub-win.red { display: block; background: var(--red); }
.scrub-win.blue { display: block; background: var(--blue); }
.scrub-win.draw { display: block; background: linear-gradient(180deg, var(--red) 50%, var(--blue) 50%); }
/* verdict chip in the transport bar: "RED WINS" next to the tick clock. */
.win-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.win-chip.show { display: inline; }
.win-chip.red { color: var(--red); }
.win-chip.blue { color: var(--blue); }
.win-chip.draw { color: var(--paper-dim); }

.tbar {
  display: flex;
  align-items: center;
  gap: calc(5 * var(--u));
  flex-wrap: wrap;
}
.tbtn {
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  color: var(--paper);
  background: rgba(var(--paper-rgb), 0.08);
  border: none;
  padding: calc(5 * var(--u)) calc(8 * var(--u));
  min-width: calc(26 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.tbtn:hover { background: rgba(var(--paper-rgb), 0.2); }
.tbtn.on { color: var(--amber); box-shadow: inset 0 calc(-2 * var(--u)) 0 var(--amber); }
.tbtn svg { width: calc(12 * var(--u)); height: calc(12 * var(--u)); display: block; fill: currentColor; }
.tsep { flex: 1; }
/* skip-lulls: dim shading over the quiet scrubber stretches, plus an amber
   "skipping" chip in the tbar while the server is actually fast-forwarding. */
.lull-span {
  position: absolute;
  top: calc(6 * var(--u));
  height: calc(4 * var(--u));
  background: rgba(18, 13, 9, 0.6);
  pointer-events: none;
}
.ffwd-chip {
  display: none;
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--amber);
  padding: 0 calc(6 * var(--u));
  white-space: nowrap;
}
.ffwd-chip.show { display: inline; }
.speedchips { display: flex; gap: calc(2 * var(--u)); }
.chip {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  background: rgba(var(--paper-rgb), 0.06);
  border: none;
  padding: calc(4 * var(--u)) calc(5 * var(--u));
  cursor: pointer;
  line-height: 1;
}
.chip.on { color: var(--stage-lo); background: var(--amber); }
.tick-clock {
  font-family: var(--pixfont);
  font-size: calc(9 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

/* hash-mismatch warning (top center) — honest fidelity flag */
#mmwarn {
  position: absolute;
  top: calc(40 * var(--u));
  left: 50%;
  transform: translateX(-50%);
  display: none;
  padding: calc(3 * var(--u)) calc(9 * var(--u));
  background: var(--red);
  color: var(--paper);
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.1em;
  text-transform: uppercase;
  z-index: 20;
}
#mmwarn.on { display: block; }

/* ---------- 6. END-CARD ---------- */
#endcard {
  position: absolute;
  inset: 0;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: calc(12 * var(--u));
  background: radial-gradient(80% 70% at 50% 45%, rgba(16, 11, 7, 0.82), rgba(9, 6, 3, 0.95));
  z-index: 30;
  padding: calc(20 * var(--u));
  text-align: center;
}
#endcard.on { display: flex; animation: cardfade 420ms ease-out; }
@keyframes cardfade { from { opacity: 0; } to { opacity: 1; } }
#endcard .headline.red { color: var(--red); }
#endcard .headline.blue { color: var(--blue); }
#endcard .headline.draw { color: var(--ghost); }
#endcard .headline {
  font-family: var(--pixfont);
  font-size: calc(30 * var(--u));
  line-height: 1.05;
  color: var(--paper);
  text-shadow: 0 calc(3 * var(--u)) 0 var(--ink);
  /* headline now carries the (possibly long) policy name — never wrap/overflow */
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .how {
  font-family: var(--finefont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.05em;
  color: var(--paper-dim);
  max-width: calc(360 * var(--u));
}
/* win-condition chip — names HOW the match ended (heart / elimination / time) */
#endcard .wincond {
  font-family: var(--pixfont);
  font-size: calc(10 * var(--u));
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--amber);
  padding: calc(3 * var(--u)) calc(10 * var(--u));
  box-shadow: inset 0 0 0 1px rgba(var(--amber-rgb), 0.5);
}
#endcard .how {
  margin-top: calc(-4 * var(--u));
}
/* MATCH GLORY splash — celebrates the MATCH, not the winner. Both teams
   high in glory is a really glorious match (wrestling, not fighting: the
   show is the product), so the big number is the COMBINED total in amber
   with each team's share beneath in its own color — every number keeps
   its context, and a close slugfest outranks a stomp. Lands on the
   banner medal-slam grammar (overshoot punch + brightness flash + amber
   rule-sweep; slam-flash/rule-sweep keyframes reused verbatim, mg-slam
   is slam-in minus the chip skew) a beat (~400ms) after the headline's
   420ms cardfade settles. The one-liner is the show review: quiet
   italic caps, faded in last. */
#endcard .mg-splash {
  position: relative;
  padding: calc(2 * var(--u)) calc(18 * var(--u)) 0;
  animation:
    mg-slam 160ms cubic-bezier(.18, 1.9, .32, 1) 400ms both,
    slam-flash 60ms ease-out 540ms;
}
#endcard .mg-box {
  position: relative;
  padding-bottom: calc(7 * var(--u));
}
#endcard .mg-total {
  font-family: var(--pixfont);
  font-size: calc(18 * var(--u));
  line-height: 1.1;
  letter-spacing: 0.08em;
  color: var(--amber);
  text-shadow: 0 calc(2 * var(--u)) 0 var(--ink);
  white-space: nowrap;
}
#endcard .mg-total b { font-size: calc(24 * var(--u)); }
#endcard .mg-teams {
  margin-top: calc(2 * var(--u));
  font-family: var(--pixfont);
  font-size: calc(11 * var(--u));
  letter-spacing: 0.12em;
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
}
#endcard .mg-teams .mg-red { color: var(--red); }
#endcard .mg-teams .mg-blue { color: var(--blue); }
#endcard .mg-teams .mg-plus { margin: 0 calc(5 * var(--u)); }
/* the amber "earned" rule, swept under the number once the slam lands */
#endcard .mg-box .mg-rule {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: calc(2 * var(--u));
  background: var(--amber);
  transform: scaleX(0);
  transform-origin: left center;
  animation: rule-sweep 140ms ease-out 540ms forwards;
}
/* the show review — ALL-CAPS quiet italic, <=6 words, tiered on the total */
#endcard .mg-line {
  margin-top: calc(6 * var(--u));
  font-family: var(--finefont);
  font-style: italic;
  font-size: calc(10 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  animation: cardfade 200ms ease-out 640ms both;
}
@keyframes mg-slam {
  from { transform: scale(1.55); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}
/* match-stats scoreboard — one panel per team, winner ringed in amber */
#endcard .ec-teams { display: flex; gap: calc(22 * var(--u)); align-items: stretch; }
#endcard .ec-team {
  width: calc(215 * var(--u));
  padding: calc(9 * var(--u)) calc(12 * var(--u));
  background: rgba(var(--ink-soft-rgb), 0.55);
  box-shadow: inset 0 0 0 1px rgba(var(--paper-rgb), 0.12);
  display: flex;
  flex-direction: column;
  gap: calc(5 * var(--u));
  text-align: left;
}
#endcard .ec-team.win {
  box-shadow: inset 0 0 0 1px rgba(var(--amber-rgb), 0.65),
    0 0 calc(14 * var(--u)) rgba(var(--amber-rgb), 0.18);
}
#endcard .ec-tname {
  font-family: var(--pixfont);
  font-size: calc(13 * var(--u));
  letter-spacing: 0.05em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#endcard .ec-tname.red { color: var(--red); }
#endcard .ec-tname.blue { color: var(--blue); }
#endcard .ec-lives { display: flex; align-items: baseline; gap: calc(6 * var(--u)); font-family: var(--pixfont); }
/* GLORY leads the panel now (glory is the score): full 22u weight, full
   opacity, no offset — it reads exactly like a normal stat, because it is
   the stat. The MATCH GLORY splash above is the combined match total in
   amber (winner-agnostic); this is the per-team ledger in team ink — same
   numbers at two grains, not a conflict. */
#endcard .fl-num { font-size: calc(22 * var(--u)); }
#endcard .fl-num.red { color: var(--red); }
#endcard .fl-num.blue { color: var(--blue); }
/* Lives is demoted: the resource trails the score at a quiet secondary
   weight, same team ink. */
#endcard .fl-num.res { font-size: calc(13 * var(--u)); opacity: 0.9; }
#endcard .fl-cap {
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--paper-dim);
}
/* The durable achievements record — one quiet line of deed detail per team
   (the in-match panel is gone; toasts are transient, this is the ledger's
   settled read). Number-with-context: count over the full curriculum, plus
   what it PAID, in the toasts' exact vocabulary. */
#endcard .ec-ach {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.08em;
  color: var(--paper-dim);
  margin: calc(2 * var(--u)) 0 calc(4 * var(--u));
}
#endcard .ec-ach .amber { color: var(--amber); }
#endcard .ec-thead,
#endcard .ec-row {
  display: grid;
  grid-template-columns: 1fr calc(22 * var(--u)) calc(22 * var(--u)) calc(26 * var(--u)) calc(26 * var(--u));
  gap: calc(5 * var(--u));
  align-items: center;
}
#endcard .ec-thead {
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--paper-dim);
  border-bottom: 1px solid rgba(var(--paper-rgb), 0.18);
  padding-bottom: calc(3 * var(--u));
}
#endcard .ec-thead span:not(:first-child) { text-align: center; }
#endcard .ec-row {
  font-family: var(--pixfont);
  font-size: calc(10.5 * var(--u));
  color: var(--paper);
  padding: calc(1.5 * var(--u)) 0;
}
#endcard .ec-row .n { text-align: center; font-variant-numeric: tabular-nums; }
#endcard .ec-row .n.cap { color: var(--amber); }
#endcard .ec-row .pname {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--paper-dim);
}
#endcard .ec-row.mvp .pname { color: var(--amber); }
/* name cell: name ellipsizes (but keeps a readable floor), the capture mark
   + honor badges ride after it; a pathological pileup clips inside the cell
   rather than bleeding into the K column */
#endcard .ec-row .pcell {
  display: flex;
  align-items: center;
  gap: calc(3 * var(--u));
  min-width: 0;
  overflow: hidden;
}
#endcard .ec-row .pcell .pname { flex: 0 1 auto; min-width: 7ch; }
/* honor badges: baked 2x pixel-art icons (nano-banana), luminance-keyed to
   transparency; a repeat count rides after the icon as fine print */
#endcard .ec-badge {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: calc(1 * var(--u));
  font-family: var(--finefont);
  font-size: calc(7.5 * var(--u));
  color: var(--paper-dim);
  font-variant-numeric: tabular-nums;
}
#endcard .ec-badge::before {
  content: '';
  display: block;
  height: calc(14 * var(--u));
  background-size: contain;
  background-repeat: no-repeat;
  image-rendering: pixelated;
}
