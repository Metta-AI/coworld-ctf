/* loop countdown — present only while the server holds the end segment */
#endcard .ec-replay {
  font-family: var(--finefont);
  font-size: calc(9 * var(--u));
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--paper-dim);
  min-height: calc(12 * var(--u));
}
#endcard .ec-replay b { color: var(--paper); font-variant-numeric: tabular-nums; }

/* connection status — fine print, lower-left */
#status {
  position: absolute;
  left: calc(10 * var(--u));
  bottom: calc(62 * var(--u));
  font-family: var(--finefont);
  font-size: calc(8 * var(--u));
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ghost);
  z-index: 8;
  pointer-events: none;
  opacity: 0;
  transition: opacity 200ms;
}
#status.show { opacity: 1; }

/* ============================================================
   The replay is ONE fixed-aspect composition (relayout() sizes #stage to the
   board's 1235:659 aspect inside the embed box), so there is no portrait/reflow
   case: at every container shape the board and its overlays scale together as a
   single unit and stay pinned. The only responsive lever is chrome DENSITY —
   `.tiny` eases the reserves so the 640×360 floor stays legible.
   ============================================================ */
/* very small floor (≤620px stage): tighten reserves */
#stage.tiny #killfeed { min-height: calc(3 * 20 * var(--u)); width: calc(190 * var(--u)); }
#stage.tiny .plate .squad-pip { width: calc(6 * var(--u)); height: calc(6 * var(--u)); }
/* At the embed floor a FULL card (rank/buffs/every deed counter/the
   achievement ledger) would cover ~a quarter of the frame at unreadable
   size, over live play. Below the same 620px threshold the killfeed uses,
   swap it for a MINIMAL card instead of dropping it outright: name, rank,
   hp/lives, the team's ACHIEVEMENTS n/40 count, and the two action buttons.
   renderInspector marks the kept stat lines .ins-vital by CONTENT, not by
   position -- `buffs` is an optional line, so rank/hp-lives/ACHIEVEMENTS
   don't sit at a fixed index. Everything else (xp, buffs, the per-weapon
   deed counters, the rule, glory/heat, the named claim list) still ships in
   the DOM; it just hides here, same as the achievement ledger already does
   off-card at full size via overflow.
   Why ACHIEVEMENTS survives here but the deed counters and named claims
   don't: with the ledger panel gone (claims live as transient corner toasts
   and settle on the endcard), this line is the HUD's only live
   team-achievement state read -- a card that dropped it would leave that
   state unreadable mid-match. The team GLORY/HEAT line
   doesn't need the same treatment: the scorebug's glory numeral (see
   .lives-num.glory) is always on-screen regardless of breakpoint, so hiding
   it here duplicates nothing lost. Per-player deed counters (tags/gun/soak/
   steals) have no such standby elsewhere -- they're genuinely detail-on-
   demand, the trade-off progressive disclosure is supposed to make. */
#stage.tiny #inspector {
  max-width: calc(140 * var(--u));
  padding: calc(8 * var(--u)) calc(10 * var(--u));
}
#stage.tiny #inspector .ins-rule,
#stage.tiny #inspector .ins-line:not(.ins-vital) { display: none; }
#stage.tiny #inspector .ins-head {
  font-size: calc(19 * var(--u));
  margin-bottom: calc(4 * var(--u));
}
/* `pre` (the full-size default) never wraps; at a 140u cap a long stat
   line would rather wrap onto a second line than get sliced by the card's
   own overflow:hidden. */
#stage.tiny #inspector .ins-line.ins-vital {
  font-size: calc(14 * var(--u));
  white-space: normal;
}
/* Stacked, not side-by-side: two full-size buttons ("EYES VIEW" + "CLOSE")
   at a legible compact size don't both fit in a 140u-wide card, and a
   clipped button is a dead button. */
#stage.tiny #inspector .ins-actions {
  flex-direction: column;
  align-items: flex-start;
  gap: calc(4 * var(--u));
  margin-top: calc(6 * var(--u));
}
#stage.tiny #inspector .ins-btn {
  font-size: calc(14 * var(--u));
  padding: calc(4 * var(--u)) calc(9 * var(--u));
}

@media (prefers-reduced-motion: reduce) {
  #grain, .clock.amb { animation: none; }
  .plate.leader .lives-num.glory { animation: none; }
  .banner-chip, .banner-chip .slam-rule, .feed-row, .ach-toast,
  .mg-splash, .mg-box .mg-rule, .mg-line { animation-duration: 1ms; animation-delay: 0ms; }
}

/* ============================================================
   EMBED MODE — inside the League Replayer shell (?embed=1)
   The shell owns the walls + team headers + KDA + standings + transport, drawn
   from the postMessage frame stream. Here we show the board (the lit pit floor)
   PLUS the designed broadcast feedback layer that belongs over the play area —
   the kill feed and the flag-event banner lane (lower-third / center wipes).
   We hide only the chrome the shell re-draws (scorebug/transport) and the
   ambient light-pool/grain/status, and let the board fill the embed box.
   ============================================================ */
body[data-embed] #scorebug,
body[data-embed] #transport,
body[data-embed] #lightpool,
body[data-embed] #grain,
body[data-embed] #status { display: none !important; }
body[data-embed] #board { top: 0; height: 100%; }
</style>
</head>
<body>
<div id="viewport">
<div id="stage">
  <canvas id="board"></canvas>
  <div id="lightpool"></div>
  <div id="grain" class="amb"></div>

  <div id="chrome">
    <div id="scorebug">
      <div class="plate red" data-team="red">
        <div class="flagicon" id="flag-red"></div>
        <div class="team-id">
          <!-- GLORY IS THE SCORE: one inline row, NAME · Glory · count, flames
               riding the headline (e.g. "RED Glory 940 🔥"). Lives is a
               resource now, demoted to the squad-pip row below. -->
          <div class="lives-line">
            <span class="team-name" id="name-red">RED</span>
            <span class="lives-label">Glory</span>
            <span class="lives-num glory" id="glory-red">—</span>
            <span class="heat-chip" id="heat-red"></span>
          </div>
          <!-- squad-row: one pip per player (8) — alive / down / eliminated,
               the roster IS the counter (Valorant/R6/Apex), clickable → POV
               lens — trailed by the demoted Lives count. Bare "Lives N", not
               "N/M": no team-level max ships from the sim; the per-player
               "lives n/m" context already lives in the inspector card. -->
          <div class="squad-row">
            <div class="squad" id="squad-red"></div>
            <span class="lives-mini">
              <span class="lives-label">Lives</span>
              <span class="lives-num" id="lives-red">—</span>
            </span>
          </div>
        </div>
      </div>

      <div class="clock-col">
        <div class="clock amb" id="clock">
          <div class="time" id="clock-time">0:00</div>
          <span class="ffwd-mini" id="ffwd-mini">▸▸</span>
          <div class="caption" id="clock-caption">Warming up</div>
        </div>
      </div>

      <div class="plate blue" data-team="blue">
        <div class="flagicon" id="flag-blue"></div>
        <div class="team-id">
          <!-- Mirrored: NAME · Glory · count, flames on the headline
               ("BLUE Glory 940 🔥"). Same demotion as red — see above. -->
          <div class="lives-line">
            <span class="team-name" id="name-blue">BLUE</span>
            <span class="lives-label">Glory</span>
            <span class="lives-num glory" id="glory-blue">—</span>
            <span class="heat-chip" id="heat-blue"></span>
          </div>
          <div class="squad-row">
            <div class="squad" id="squad-blue"></div>
            <span class="lives-mini">
              <span class="lives-label">Lives</span>
              <span class="lives-num" id="lives-blue">—</span>
            </span>
          </div>
        </div>
      </div>
    </div>

    <div id="mmwarn">Replay hash mismatch — showing recorded inputs</div>
    <!-- Inline SVG eye, not an emoji: emoji-as-icon is a hard fail in the
         design rubric and renders platform-dependent. Same pattern as the
         .flagicon SVGs above. -->
    <div id="povBadge"><svg viewBox="0 0 24 16" style="width:calc(14*var(--u));height:calc(10*var(--u));flex:none;margin-right:calc(4*var(--u))"><path d="M12 1 C6 1 2 6 1 8 C2 10 6 15 12 15 C18 15 22 10 23 8 C22 6 18 1 12 1 Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="8" r="3.4" fill="currentColor"/></svg><span id="povBadgeText">POV lens — click to clear</span></div>
    <!-- Hover a cog on the board: rank, what that rank is BUYING it, its deed
         counters, its tithe progress, and its team's glory ledger. Composed
         server-side by global.inspectorLines and shipped as finished lines —
         glory.nim stays the single source of every number. -->
    <div id="inspector"></div>
    <!-- Per-team claim toast lanes: fading chat stacks in the bottom corners
         (red LEFT, blue RIGHT — see the .ach-toast CSS for the geometry).
         Transient event FX, cleared by the same jump guard as the feed. -->
    <div id="achtoast-red"></div>
    <div id="achtoast-blue"></div>
    <!-- First-person picture-in-picture: the selected seat's Wolfenstein-style
         raycast view, shown only while a player is in POV. A window into what
         that soldier sees down the barrel, riding alongside their top-down fog.
         Its own inset tactical map (bottom-left) shows the seat's position and
         vision cone against the WHOLE un-fogged arena, so the viewer always
         knows where the EYES are looking and standing. -->
    <div id="fpv">
      <canvas id="fpv-canvas"></canvas>
      <!-- Self-status HUD: this soldier's hp pips, lives, carried gear. -->
      <div class="fpv-hud" id="fpv-hud">
        <span class="fpv-name" id="fpv-name"></span>
        <span class="fpv-hp" id="fpv-hp"></span>
        <span class="fpv-gear" id="fpv-gear"></span>
      </div>
      <!-- Un-fogged tactical minimap: arena walls + all units + hearts + the
           POV seat's vision wedge. Full context, no fog of war. -->
      <div class="fpv-map" id="fpv-map">
        <canvas id="fpv-map-canvas"></canvas>
      </div>
      <div class="fpv-cap" id="fpv-cap">EYES</div>
      <!-- corner grip: drag to resize (bottom-right so it clears the screen edge
           when the PiP is pinned bottom-left) -->
      <div class="fpv-grip" id="fpv-grip" title="Drag to resize"></div>
    </div>
    <div id="bannerlane"></div>
    <div id="killfeed"></div>

    <div id="transport">
      <!-- Buttons on top, scrubber/timeline below (the transport sits in its own
           reserved band under the board, so nothing here overlaps play). -->
      <div class="tbar">
        <button class="tbtn" id="btn-restart" title="Restart (,)">⟲</button>
        <button class="tbtn" id="btn-back" title="Back one tick (b)">◂|</button>
        <button class="tbtn" id="btn-play" title="Play / pause (space)">▶</button>
        <button class="tbtn" id="btn-fwd" title="Skip +5s (.)">+5s</button>
        <button class="tbtn" id="btn-end" title="Jump to end (e)">|▸</button>
        <button class="tbtn" id="btn-loop" title="Loop (r)">↻</button>
        <button class="tbtn" id="btn-skip" title="Auto-skip lulls (f)">▸▸</button>
        <span class="ffwd-chip" id="ffwd-chip">▸▸ SKIPPING LULL</span>
        <span class="win-chip" id="win-chip"></span>
        <span class="tick-clock" id="tick-clock">0 / 0</span>
        <span class="tsep"></span>
        <div class="speedchips" id="speedchips"></div>
      </div>
      <div class="scrub" id="scrub">
        <!-- GLORY differential IS the momentum graph now (glory is the
             score, lives lead is gone) — canvas-drawn, sitting UNDERNEATH
             the seek track on the SAME tick/mx axis, so the playhead crosses
             it 1:1 with the timeline. Mounts only when the engine ships
             s.gloryLine (→ .has-glory), so an old bundle without it shows
             the seek track alone at the base 34u height. -->
        <canvas class="glory-track" id="glorytrack" aria-hidden="true"></canvas>
        <span class="glory-label">GLORY</span>
        <span class="glory-readout" id="glory-readout" aria-hidden="true"></span>
        <div class="scrub-track"></div>
        <div class="scrub-fill" id="scrub-fill"></div>
        <!-- lull shading rides ABOVE track+fill so the quiet stretches read
             dimmed whether played or not; the amber head still wins (z:3) -->
        <div id="lulls"></div>
        <div class="scrub-win" id="scrub-win"></div>
        <div class="scrub-head" id="scrub-head"></div>
      </div>
    </div>

    <div id="endcard">
      <div class="headline" id="ec-headline">—</div>
      <div class="wincond" id="ec-wincond"></div>
      <div class="how" id="ec-how"></div>
      <div class="mg-splash" id="mg-splash">
        <div class="mg-box">
          <div class="mg-total">MATCH GLORY <b id="mg-num">0</b></div>
          <div class="mg-teams"><span class="mg-red" id="mg-red">0</span><span class="mg-plus">+</span><span class="mg-blue" id="mg-blue">0</span></div>
          <div class="mg-rule"></div>
        </div>
        <div class="mg-line" id="mg-line"></div>
      </div>
      <!-- GLORY LEADS each panel now (glory is the score); Lives left trails
           as the resource it settled with — see .fl-num / .fl-num.res. IDs
           are unchanged from the old lives-first order, so renderEndcard
           needs zero JS churn for this reorder. -->
      <div class="ec-teams">
        <div class="ec-team" id="ec-team-red">
          <div class="ec-tname red" id="ec-tname-red">RED</div>
          <div class="ec-lives">
            <span class="fl-num red" id="ec-glory-red">0</span>
            <span class="fl-cap">Glory</span>
            <span class="fl-num red res" id="ec-red">0</span>
            <span class="fl-cap">Lives left</span>
          </div>
          <div class="ec-ach" id="ec-ach-red"></div>
          <div class="ec-thead"><span>Player</span><span>Tags</span><span>Outs</span><span>Clstr</span><span>Cap</span></div>
          <div id="ec-rows-red"></div>
        </div>
        <div class="ec-team" id="ec-team-blue">
          <div class="ec-tname blue" id="ec-tname-blue">BLUE</div>
          <div class="ec-lives">
            <span class="fl-num blue" id="ec-glory-blue">0</span>
            <span class="fl-cap">Glory</span>
            <span class="fl-num blue res" id="ec-blue">0</span>
            <span class="fl-cap">Lives left</span>
          </div>
          <div class="ec-ach" id="ec-ach-blue"></div>
          <div class="ec-thead"><span>Player</span><span>Tags</span><span>Outs</span><span>Clstr</span><span>Cap</span></div>
          <div id="ec-rows-blue"></div>
        </div>
      </div>
      <div class="ec-replay" id="ec-replay"></div>
    </div>
  </div>

  <div id="status">connecting</div>
</div>
</div>

<!-- BROADCAST_CORE -->

<script>
(function () {
  'use strict';

  // ---- palette (mirrors board tints so chrome matches the arena) ----
  var RED = '#e0523a', BLUE = '#3f7cc4', AMBER = '#e8a33d', PAPER = '#f2e8d8';

  // ---- flame glyph (scorebug heat chip + heat-streak slam banners) ----
  // ONE path so the flame language never forks between the silent scorebug
  // flames and the shouted streak callouts.
  var FLAME_SVG = '<svg viewBox="0 0 12 16"><path d="M6 0 C7 3 10 5 10 9 ' +
    'A4 4 0 0 1 2 9 C2 6 4 5 4 3 C5 5 6 5 6 3 Z" fill="var(--amber)"/>' +
    '<path d="M6 8 C6.7 9.5 8 10 8 11.6 A2 2 0 0 1 4 11.6 ' +
    'C4 10 5.3 9.5 6 8 Z" fill="var(--stage-lo)"/></svg>';

  // ---- eye-level cog art for the EYES PiP billboards ----
  // The PiP is an eye-level raycaster, so its billboards need art drawn from a
  // HORIZONTAL camera: soldier_{red,blue}_front.png is the real cog standing on
  // its wheels, square to the viewer, with the cyan smile visor tilted up toward
  // the camera (built by scripts/art/build_cvc_front.py, served as a static PNG).
  //
  // The plain soldier_{red,blue}.png masters are the TOP-DOWN BOARD sprites (the
  // cog as seen from ABOVE). Blitting those here is what made a near cog read as
  // a flat team-coloured plate with the smile squashed onto its bottom edge —
  // "a head on the ground". No trim or pose math fixes that; it is the wrong
  // camera. They stay only as the pre-load fallback, ranked behind the front art.
  //
  // Loaded once; drawFpvEntity blits the matching team image scaled to the
  // projected figure so distant cogs shrink like everything else.
  // Two poses per team: _gun (the cog holding its paintball marker forward at the
  // camera) is what a LIVE cog shows, since every live cog carries its gun; the
  // empty-handed master rides as the fallback until that one loads.
  //
  // COG_BASE, not a root-absolute "/client/…": this page is served from THREE
  // places and a leading slash is only correct at one of them.
  //  - native server, bare:      /client/replay        → "" + /client/…
  //  - native server, proxied:   /<prefix>/client/replay (Kubernetes service
  //    proxy) — a leading slash would drop <prefix> and 404.
  //  - the STATIC WASM BUNDLE:   /v2/coworlds/replays/static/<coworld>/<hash>/
  //    index.html, where the PNGs sit NEXT TO the page and there is no server
  //    at all — a leading slash resolves to the API origin root and 404s.
  // Stripping the trailing "/client/<page>" recovers the prefix, so the same
  // expression serves all three. Mirrors ART_BASE in league_replayer.html and
  // websocketPathForClientPage() in broadcast_core.js, which map the same
  // /client + /clients route pair the same way. The bundle is detected by its
  // WASM adapter rather than a URL param: window.CtfStaticReplay only exists
  // when static_replay.js is on the page.
  var COG_BASE = window.CtfStaticReplay
    ? '.'
    : location.pathname.replace(/\/clients?\/[^/]*$/, '') + '/client';
  var COG_ART = { red: new Image(), blue: new Image() };
  COG_ART.red.src = COG_BASE + '/soldier_red_front.png';
  COG_ART.blue.src = COG_BASE + '/soldier_blue_front.png';
  var COG_ART_GUN = { red: new Image(), blue: new Image() };
  COG_ART_GUN.red.src = COG_BASE + '/soldier_red_front_gun.png';
  COG_ART_GUN.blue.src = COG_BASE + '/soldier_blue_front_gun.png';
  function cogArtReady(img) { return img && img.complete && img.naturalWidth > 0; }
  // Pick the armed pose when it's ready, else the plain one, else null (the
  // caller falls back to the procedural chassis).
  function cogArtFor(team, armed) {
    var gun = COG_ART_GUN[team], plain = COG_ART[team];
    if (armed && cogArtReady(gun)) return gun;
    if (cogArtReady(plain)) return plain;
    return cogArtReady(gun) ? gun : null;
  }
  // The front masters are trimmed to their opaque box at build time and carry NO
  // baked drop shadow (the billboard draws its own contact shadow), so the whole
  // image IS the cog — a full-frame trim, unlike the top-down master which bakes
  // a soft shadow into its right third and needs the box cut out.
  var COG_TRIM = { x: 0, y: 0, w: 1, h: 1 };
  var COG_ASPECT = 180 / 192;   // 0.9375 — w/h of the front master (build script prints it)
  // Offscreen scratch for depth-dimming the cog sprite: draw the art in, then
  // darken with a source-atop ink wash so ONLY the sprite pixels dim (never the
  // floor/walls already painted behind it). Reused across draws.
  var cogScratch = document.createElement('canvas'), cogScratchCtx = null;
  var SPEEDS = [1, 2, 3, 4, 8, 16];
  var FPS = 24;

  // Two independent tempo levers (§11, L20):
  //  (1) ANIM_MAX_FACTOR — chrome beat animations never play faster than this
  //      no matter the replay speed, so feed rows / flips / banners keep their
  //      read time at 8-16×. Applied as an animationFactor cap on durations.
  //  (2) DWELL_FLOOR_MS — a beat's on-screen hold has a wall-clock minimum
  //      (feed row / banner / curtain), collapsing only the dead time between
  //      contacts. These are NOT one speed knob — one caps motion, one floors dwell.
  var ANIM_MAX_FACTOR = 2;
  var DWELL_FLOOR_MS = { feed: 2600, banner: 1900, heat: 3600, curtain: 2400, read: 600, achtoast: 4000 };
  function animFactor() {
    // Lever 1 — the chrome plays at min(replaySpeed, cap): at 16× the board flies
    // but a kill row still slides in at 2×-equivalent so a human can read it.
    var sp = (lastState && lastState.sp) || 1;
    return Math.min(sp, ANIM_MAX_FACTOR);
  }
  function dwellFloor(kind) {
    // Lever 2 — a beat's on-screen hold has a wall-clock minimum regardless of
    // replay speed; speed collapses only the dead time between contacts, never
    // the read time of a beat itself. Independent of the animFactor cap.
    return DWELL_FLOOR_MS[kind] || DWELL_FLOOR_MS.read;
  }
  // Beat-pause (§11): freeze chrome ambient the instant a beat lands so idle
  // life never competes with a kill/steal/capture. Held for the READ_PAUSE floor
  // (≥600ms wall-clock), then released. The board's own 24Hz is never touched.
  var beatPulseTimer = null;
  function beatPulse() {
    stage.classList.add('beat-active');
    if (beatPulseTimer) clearTimeout(beatPulseTimer);
    beatPulseTimer = setTimeout(function () {
      stage.classList.remove('beat-active');
      beatPulseTimer = null;
    }, dwellFloor('read'));
  }

  var $ = function (id) { return document.getElementById(id); };
  var viewport = $('viewport');
  var stage = $('stage');
  var canvas = $('board');
  var statusEl = $('status');

  // ---- embed mode (League Replayer) ----------------------------------------
  // When loaded inside the League Replayer shell (?embed=1), this client renders
  // ONLY the board (its own scorebug/transport/feed chrome is hidden by CSS via
  // body[data-embed]) and streams each parsed state frame up to the parent shell
  // over postMessage. The shell owns the walls + scorebug + KDA + standings and
  // draws them from this stream, so there is ONE websocket / ONE transport /
  // perfect tick-sync between the embedded game and the wall HUD.
  var EMBED = false;
  try { EMBED = new URLSearchParams(location.search).get('embed') === '1'; } catch (e) {}
  if (EMBED) document.body.setAttribute('data-embed', '1');

  // Tick deep-link (?t=<tick>): seek there on load, paused, via the same s:
  // command the scrubber uses (the sim clamps out-of-range ticks). One-shot,
  // fired on the first ingested frame so the replay runtime is ready.
  var SEEK_T = null;
  try {
    var seekRaw = new URLSearchParams(location.search).get('t');
    if (seekRaw != null && /^\d+$/.test(seekRaw)) SEEK_T = parseInt(seekRaw, 10);
  } catch (e) {}
  function postToShell(type, payload) {
    if (!EMBED || window.parent === window) return;
    try { window.parent.postMessage({ src: 'ctf-replay', type: type, data: payload }, '*'); } catch (e) {}
  }

  // The whole replay is ONE fixed-aspect composition locked to the board's
  // native size (sim.nim MapWidth×MapHeight = 1235×659). The stage is sized to
  // this aspect inside the embed box and every overlay scales with it, so the
  // chrome can never drift off the graphics regardless of the Observatory
  // container's shape (§2 real-container-target, L82 bounded-embed).
  var BOARD_W = 1235, BOARD_H = 659;
  var BOARD_ASPECT = BOARD_W / BOARD_H;

  // ---- flag icon svg (HOME/TAKEN are the only two states — F2) ----
  function buildFlag(el, color) {
    el.innerHTML =
      '<svg viewBox="0 0 26 30" aria-hidden="true">' +
      '<rect x="4" y="2" width="2" height="26" fill="#2a1f16"/>' +
      '<g class="cloth"><path d="M6 3 L22 3 L18 9 L22 15 L6 15 Z" fill="' + color + '"/></g>' +
      '<rect x="1" y="26" width="10" height="3" fill="#8a7f72"/>' +
      '</svg>' +
      '<div class="carrier-tag"></div>';
  }
  buildFlag($('flag-red'), RED);
  buildFlag($('flag-blue'), BLUE);

  // ---- speed chips ----
  var speedChipsEl = $('speedchips');
  var speedChipEls = {};
  SPEEDS.forEach(function (s) {
    var b = document.createElement('button');
    b.className = 'chip';
    b.textContent = s + '×';
    b.setAttribute('aria-label', s + 'x speed');
    b.addEventListener('click', function () { setSpeed(s); });
    speedChipsEl.appendChild(b);
    speedChipEls[s] = b;
  });

  // ---- core (board renderer + WS) ----
  var lastState = null;
  var replayAdapter = window.CtfStaticReplay || null;
  var core = window.BroadcastCore.create({
    canvas: canvas,
    onText: function (txt) { onFrame(txt); },
    onStatus: function (st) { onStatus(st); },
    onFirstFrame: function () { core.setViewportFit(); },
    websocket: !replayAdapter,
    onSendPacket: replayAdapter ? function (bytes) {
      replayAdapter.sendPacket(bytes);
    } : null
  });
  if (replayAdapter) replayAdapter.attachCore(core);

  function send(cmd) { core.sendCommand(cmd); }

  // Transport commands relayed DOWN from the League Replayer shell (embed mode):
  // the shell's wall-mounted transport buttons/scrubber postMessage a command
  // string, which we forward to the single shared replay websocket. Same command
  // vocabulary the local transport uses, so the shell drives playback 1:1.
  if (EMBED) {
    window.addEventListener('message', function (ev) {
      var m = ev.data;
      if (!m || m.src !== 'ctf-shell') return;
      if (m.type === 'cmd' && typeof m.cmd === 'string') send(m.cmd);
      else if (m.type === 'seek' && m.tick != null) send('s:' + m.tick);
      else if (m.type === 'pov' && m.slot != null) send('v:' + m.slot);
    });
  }

  function onStatus(st) {
    statusEl.textContent = st;
    statusEl.classList.toggle('show', st !== 'open');
    if (st === 'open') {
      // Opt in to the JSON chrome channel (REPLAY-ONLY; legacy client never sends this).
      send('hud:on');
    }
  }

  // ============================================================
  //  Frame ingest
  // ============================================================
  var lastTick = -1;
  var seenMarkers = {}; // tick|kind -> true, for scrubber beat markers
  var lastFf = false;   // previous frame's fast-forward flag (jump detection)
  var lullSpans = null; // full-match [[a,b]] quiet spans, shipped once
  var lullsRendered = false;

  function onFrame(txt) {
    var s;
    try { s = JSON.parse(txt); } catch (e) { return; }
    lastState = s;

    if (SEEK_T != null) { send('s:' + SEEK_T); SEEK_T = null; }

    // Stream the parsed frame to the League Replayer shell (embed mode). The
    // shell reads roster/KDA, clock, lives, flags and pov straight off this to
    // paint the wall-mounted scorebug + KDA tables in lockstep with the board.
    postToShell('frame', s);

    // Detect a jump (seek/loop): clear transient beats so nothing phantoms.
    // A skip-lulls fast-forward frame legitimately advances up to 64 ticks
    // (this frame or the previous one, which may have crossed OUT of the
    // lull), so widen the expected stride accordingly instead of misreading
    // the boost as a seek.
    var stride = (s.ff || lastFf) ? Math.min((s.sp || 1) * 8, 64) : (s.sp || 1);
    var jumped = (s.t < lastTick) || (lastTick >= 0 && s.t - lastTick > stride * 4 + 2);
    if (jumped) {
      clearFeed(); clearBanners(); clearAchToasts();
      // The verdict chip has no other clearing path (setVerdict early-returns
      // on a liveless frame), so without this a looping replay spoils its own
      // ending from tick 0 of the second loop onward.
      $('win-chip').className = 'win-chip';
      $('scrub-win').className = 'scrub-win';
    }
    lastFf = !!s.ff;

    renderScorebug(s);
    renderClock(s);
    renderTransport(s);
    renderPov(s);
    renderMismatch(s);
    renderInspector(s);

    // Heat-streak callouts fire off STATE transitions (rung-UPS only): a seek
    // or the first ingested frame resyncs silently instead of shouting a
    // phantom streak (the same jump rule every transient lane follows).
    trackHeat(s, jumped || lastTick < 0);

    if (s.events && s.events.length && !jumped) {
      for (var i = 0; i < s.events.length; i++) applyEvent(s.events[i], s);
    }
    // Even on a jump, register beat markers we can place from state? Markers
    // come from events only; on a jump the tracker resync'd (no events), so we
    // keep whatever markers we already collected.
    ingestGlorySeries(s);
    ingestFpMap(s);
    ingestLullSpans(s);
    ingestBeats(s);

    if (s.ph === 'gameover') { renderEndcard(s); if (s.over) setVerdict(s.over); }
    else { $('endcard').classList.remove('on'); }

    lastTick = s.t;
  }

  // ---------- inspector card (hover a cog) ----------
  // The lines arrive FINISHED from global.inspectorLines — rank, what the rank
  // is buying (windup/range/hp/rof/nade charges, read off the live buff
  // accessors), deed counters, tithe progress, team glory + heat, and the named
  // achievement ledger. Nothing here interprets them: re-deriving any of it in
  // JS would fork the glory ladder into a second copy that drifts silently, and
  // glory.nim's one-accessor rule exists precisely to stop that.
  // Absent `insp` means nothing is hovered (or the phase isn't Playing, which
  // is what addInspector does too) — hide, don't stale.
  var inspectorKey = '';
  function renderInspector(s) {
    var el = $('inspector');
    if (!el) return;
    var insp = s.insp;
    if (!insp || !insp.lines || !insp.lines.length) {
      el.classList.remove('on');
      inspectorKey = '';
      return;
    }
    var team = teamOf(s, insp.slot) === 'blue' ? 'blue' : 'red';
    // Rebuild only when the text actually changes: this runs every frame at up
    // to 24Hz, and the card is 20-odd nodes.
    var key = team + '\u0000' + insp.lines.join('\u0000');
    if (key !== inspectorKey) {
      inspectorKey = key;
      var html = '';
      for (var i = 0; i < insp.lines.length; i++) {
        var line = insp.lines[i];
        if (!line.length) { html += '<div class="ins-rule"></div>'; continue; }
        var cls = i === 0 ? 'ins-head' : 'ins-line';
        // The headline carries the team PIP (see the #inspector .ins-pip rule):
        // whose cog this is, said next to the name instead of by an edge stripe.
        if (i === 0) {
          html += '<div class="ins-head"><span class="ins-pip"></span>' +
            esc(line) + '</div>';
          continue;
        }
        // #stage.tiny's compact card keeps only rank + hp/lives + the team's
        // ACHIEVEMENTS n/40 count and hides every other .ins-line by class
        // (see the #stage.tiny #inspector rule). None of the three sit at a
        // fixed index (`buffs` is optional, and the achievement lines only
        // exist past a variable-length deed-counter block) -- content is the
        // only stable way to tag them. ACHIEVEMENTS rides along because with
        // the ledger panel gone it is the HUD's only live team-achievement
        // state read -- see the #stage.tiny #inspector comment for why the
        // deed counters and named claims don't join it.
        if (cls === 'ins-line' &&
            (line.indexOf('rank ') === 0 || line.indexOf('hp ') === 0 ||
             line.indexOf('ACHIEVEMENTS ') === 0)) {
          cls += ' ins-vital';
        }
        // The `buffs` line is the one most likely to hit the card's width: at
        // max rank it carries six phrases (~60 chars). `pre` never wraps and
        // the card is overflow:hidden, so it would be SLICED mid-word -- the
        // same failure the .tiny rules already fix for .ins-vital, at a size
        // where nobody thought to look. Tagged by content because `buffs` is
        // optional and so has no fixed index.
        if (cls === 'ins-line' && line.indexOf('buffs ') === 0) {
          cls += ' ins-wrap';
        }
        html += '<div class="' + cls + '">' + esc(line) + '</div>';
      }
      // The action row: the EYES view -- which used to be the board click --
      // and the close. Rendered with the card (the rebuild key covers them);
      // the CLICKS are handled by one delegated listener on #inspector, so
      // rebuilding the innerHTML never orphans a handler.
      html += '<div class="ins-actions">' +
        '<button class="ins-btn" data-act="eyes">POV</button>' +
        '<button class="ins-btn" data-act="close">CLOSE</button></div>';
      el.innerHTML = html;
      el.classList.remove('red', 'blue');
      el.classList.add(team);
      el.dataset.slot = insp.slot;
    }
    el.classList.add('on');
  }
  $('inspector').addEventListener('click', function (ev) {
    var act = ev.target && ev.target.dataset && ev.target.dataset.act;
    if (!act) return;
    ev.stopPropagation();
    if (act === 'close') { send('i:-1'); return; }
    if (act === 'eyes') {
      var slot = parseInt($('inspector').dataset.slot, 10);
      if (!isNaN(slot) && slot >= 0) {
        // The same `v:` command the squad pips send -- toggles off if this
        // cog's EYES view is already open.
        if (lastState && lastState.pov === slot) send('v:-1');
        else send('v:' + slot);
      }
    }
  });

  // The lull spans ride the same first HUD frame. Cache them once; the
  // scrubber shades them so "the grayed stretches are what ▸▸ skips" is
  // visible before ever toggling the mode.
  function ingestLullSpans(s) {
    if (!s.lulls || lullSpans) return;
    lullSpans = s.lulls;
  }

  // The full-match flag beats + verdict ride the same first HUD frame: place
  // every steal/return/capture marker and the winner cap up front, so the
  // scrubber tells the flag story (and how it ends) before playback gets
  // there. Kill markers stay accumulate-as-played — dozens of them up front
  // would bury the flag beats. markBeat dedups by tick|kind, so the live
  // events re-firing over these is harmless.
  var beatTimeline = null;
  function otherTeam(t) { return t === 'red' ? 'blue' : t === 'blue' ? 'red' : ''; }
  function ingestBeats(s) {
    if (!s.beats || beatTimeline) return;
    beatTimeline = s.beats;
    for (var i = 0; i < beatTimeline.length; i++) {
      var b = beatTimeline[i];
      if (b.k === 'steal' || b.k === 'return') markBeat(b.t, b.k, b.flag);
      else if (b.k === 'capture') markBeat(b.t, 'capture', otherTeam(b.flag));
      // The 'gameover' beat is NOT the verdict: it arrives with the up-front
      // beat timeline, so setting the chip here announced the winner at tick
      // 0 of a replay nobody had watched yet. The chip fires from the
      // game-over STATE path instead (renderState), when the ending is
      // actually on screen -- and the jump-reset clears it again on loop.
    }
  }

  // Winner cap + "RED WINS" chip. Fired ONLY by the game-over state, when
  // playback has actually reached the end -- the up-front beat timeline used
  // to feed it too, which spoiled the outcome from the first frame.
  function setVerdict(v) {
    var cls = v.draw ? 'draw' : (v.winner === 'red' || v.winner === 'blue' ? v.winner : '');
    if (!cls) return;
    var label = v.draw ? 'DRAW' : v.winner.toUpperCase() + ' WINS';
    var cap = $('scrub-win');
    cap.className = 'scrub-win ' + cls;
    cap.title = label;
    var chip = $('win-chip');
    chip.textContent = label;
    chip.className = 'win-chip show ' + cls;
  }

  // The server ships the static minimap wall silhouette ONCE (RLE of a coarse
  // floor/stone/glass grid). Decode it into an offscreen canvas keyed to the
  // arena, so the tactical map blits terrain in one drawImage per frame instead
  // of re-rasterizing the grid. Cached for the whole match.
  var fpMapMeta = null, fpMapBaked = null;
  function ingestFpMap(s) {
    if (!s.fpmap || fpMapBaked) return;
    var m = s.fpmap, gw = m.gw, gh = m.gh, rle = m.rle || [];
    var off = document.createElement('canvas');
    off.width = gw; off.height = gh;
    var octx = off.getContext('2d');
    var img = octx.createImageData(gw, gh);
    var data = img.data;
    // Palette: floor = transparent (the inset's own dark shows through), stone =
    // warm slate, glass = pale translucent pane so see-through cover reads.
    var pal = [
      [0, 0, 0, 0],            // 0 floor
      [92, 78, 62, 235],       // 1 stone
      [150, 172, 178, 150]     // 2 glass
    ];
    var cell = 0;
    for (var k = 0; k + 1 < rle.length; k += 2) {
      var st = rle[k], run = rle[k + 1], c = pal[st] || pal[0];
      for (var r = 0; r < run; r++) {
        var p = (cell + r) * 4;
        data[p] = c[0]; data[p + 1] = c[1]; data[p + 2] = c[2]; data[p + 3] = c[3];
      }
      cell += run;
    }
    octx.putImageData(img, 0, 0);
    fpMapMeta = { w: m.w, h: m.h, gw: gw, gh: gh };
    fpMapBaked = off;
  }

  // ---------- scorebug ----------
  // One pip per PLAYER (8), keyed by stable join slot: lit = alive, dim = down
  // but has lives left, hollow = eliminated. The strip is the "who's left"
  // read (the roster IS the counter); the numeral is the exact lives count.
  // Each pip is clickable → POV lens. NEVER shows kills (F1: kills ≠ score).
  function renderSquad(el, players, pov) {
    var key = players.map(function (p) { return p.s; }).join(',');
    if (el._key !== key) {
      el.innerHTML = ''; el._pips = {};
      players.forEach(function (p) {
        var pip = document.createElement('span');
        pip.className = 'squad-pip';
        pip.title = shortName(p.name);
        pip.addEventListener('click', function () { togglePov(p.s); });
        el.appendChild(pip);
        el._pips[p.s] = pip;
      });
      el._key = key;
    }
    players.forEach(function (p) {
      var pip = el._pips[p.s];
      if (!pip) return;
      var eliminated = !p.alive && p.lives <= 0;
      pip.classList.toggle('down', !p.alive && p.lives > 0);
      pip.classList.toggle('out', eliminated);
      pip.classList.toggle('carry', !!p.carry);
      pip.classList.toggle('pov', pov === p.s);
    });
  }

  function renderGlory(team, t) {
    var num = $('glory-' + team);
    var chip = $('heat-' + team);
    if (!num || !chip) return;
    num.textContent = (typeof t.glory === 'number') ? t.glory : '—';
    var heat = t.heat || 1;
    // FLAMES, not the word (Maxwell's call): one flame per rung above x1 --
    // x2 one, x4 two, x8 three. Inline SVG in the chrome's amber (emoji-as-
    // icon is a hard fail in the design rubric). The title still carries the
    // exact multiplier for anyone who hovers.
    var rungs = heat >= 8 ? 3 : heat >= 4 ? 2 : heat >= 2 ? 1 : 0;
    if (rungs !== (chip._rungs || 0)) {
      chip._rungs = rungs;
      chip.innerHTML = new Array(rungs + 1).join(FLAME_SVG);
    }
    chip.title = 'rampage x' + heat;
    chip.classList.toggle('show', rungs > 0);
  }

  // The full curriculum: 8 kit-keyed trees x 5 tiers, per team. Any count
  // shown carries it as its denominator -- "3" alone says nothing about
  // whether a team is doing well. (The in-match ledger PANEL is deliberately
  // gone: claims are corner toasts in the moment and settle on the endcard's
  // per-team Achievements line; the board is the show.)
  var ACH_TOTAL = 40;

  function renderScorebug(s) {
    var tr = s.teams || {};
    var red = tr.red || {}, blue = tr.blue || {};
    var rl = red.lives || 0, bl = blue.lives || 0;

    setName('name-red', teamName(s, 'red', 'RED'));
    setName('name-blue', teamName(s, 'blue', 'BLUE'));

    $('lives-red').textContent = rl;
    $('lives-blue').textContent = bl;

    // GLORY + HEAT, both priced entirely by glory.nim and shipped on the
    // team state — never recomputed here, so the band can't drift from the
    // ladder the sim actually paid out. Heat hides at x1: the sim's own score
    // line suppresses it there too, and a permanent "x1" is noise.
    renderGlory('red', red);
    renderGlory('blue', blue);

    // squad pips per team (one per player), sorted by stable join slot
    var reds = [], blues = [];
    (s.roster || []).forEach(function (p) { (p.team === 'red' ? reds : blues).push(p); });
    reds.sort(function (a, b) { return a.s - b.s; });
    blues.sort(function (a, b) { return a.s - b.s; });
    renderSquad($('squad-red'), reds, s.pov);
    renderSquad($('squad-blue'), blues, s.pov);

    updateFlag('flag-red', 'red', red, s);
    updateFlag('flag-blue', 'blue', blue, s);

    // leader pulse keys on GLORY lead (glory is the score, not lives) — a
    // margin of 100g is ~8% of a typical full-match team total (~1200g,
    // field-calibrated in GLORY_TIERS provenance). Lives lead >=3 is kept
    // ONLY as the fallback for pre-glory replays that never shipped a glory
    // ledger, so the read stays honest on old bundles too.
    var rp = document.querySelector('.plate.red');
    var bp = document.querySelector('.plate.blue');
    var gr = (typeof red.glory === 'number') ? red.glory : null;
    var gb = (typeof blue.glory === 'number') ? blue.glory : null;
    var leadRed, leadBlue;
    if (gr != null && gb != null) {
      leadRed = gr - gb >= 100;
      leadBlue = gb - gr >= 100;
    } else {
      leadRed = rl - bl >= 3;
      leadBlue = bl - rl >= 3;
    }
    rp.classList.toggle('leader', leadRed && s.ph === 'playing');
    bp.classList.toggle('leader', leadBlue && s.ph === 'playing');
  }

  function teamName(s, team, fallback) {
    // The scorebug headline is the POLICY name, not the color (the plate color +
    // board already say which side is which). In a hosted league every player on
    // a side is the SAME policy, so the whole team shares one name — show it.
    // In local self-play each baseline bot has a distinct generated name
    // (Player1, Player2, …) with no shared identity, so fall back to the color
    // label rather than pinning the whole team to one arbitrary bot.
    if (!s.roster) return fallback;
    var name = null, mixed = false;
    for (var i = 0; i < s.roster.length; i++) {
      var p = s.roster[i];
      if (p.team !== team) continue;
      // Strip the per-seat " (N)" suffix the hosted runtime appends to the SAME
      // policy's multiple connections ("softmaxwell (2)", "softmaxwell (7)"…) so
      // every seat of one policy collapses to a single shared name here. The
      // killfeed shows the full per-seat name (it colors names per event and
      // never compares them); the headline needs one shared identity, and this
      // suffix was tripping the "mixed" check and pinning the header to RED/BLUE.
      // Distinct local self-play names (Player1, Player2) carry no such suffix,
      // so they still differ and correctly fall back to the color.
      var nm = String(p.name || '').replace(/\s*\(\d+\)\s*$/, '');
      if (name === null) name = nm;
      else if (nm !== name) { mixed = true; break; }
    }
    if (name === null || mixed || name === '') return fallback;
    return teamHeadline(name);
  }
  function teamHeadline(n) {
    // Format a policy identity for the scorebug headline: drop any host:port
    // suffix, restore the spaces the server encodes as underscores, and let the
    // plate's CSS ellipsis clip anything still too wide (no hard char cut, so a
    // full name reads whole when it fits).
    n = String(n || '');
    var at = n.indexOf('@'); if (at > 0) n = n.slice(0, at);
    n = n.replace(/_/g, ' ').trim();
    return (n || '?').toUpperCase();
  }
  function setName(id, txt) { var el = $(id); if (el.textContent !== txt) el.textContent = txt; }

  function updateFlag(id, team, tstate, s) {
    var el = $(id);
    var taken = tstate.flag === 'taken';
    var was = el.classList.contains('taken');
    el.classList.toggle('taken', taken);
    if (was !== taken) { el.classList.remove('flip'); void el.offsetWidth; el.classList.add('flip'); }
    var tag = el.querySelector('.carrier-tag');
    if (tag) {
      if (taken && tstate.carrier >= 0) {
        tag.textContent = shortName(rosterName(s, tstate.carrier));
      } else { tag.textContent = ''; }
    }
  }

  function rosterName(s, slot) {
    if (!s.roster) return '#' + slot;
    for (var i = 0; i < s.roster.length; i++) {
      if (s.roster[i].s === slot) return s.roster[i].name || ('#' + slot);
    }
    return '#' + slot;
  }
  function shortName(n) {
    n = String(n || '');
    // Names are player addresses; keep them short + readable.
    var at = n.indexOf('@'); if (at > 0) n = n.slice(0, at);
    if (n.length > 10) n = n.slice(0, 10);
    return n || '?';
  }

  // ---------- clock ----------
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), r = sec % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function renderClock(s) {
    var timeEl = $('clock-time'), capEl = $('clock-caption'), clk = $('clock');
    if (s.ph === 'lobby') {
      timeEl.textContent = s.lob > 0 ? (':' + (s.lob < 10 ? '0' : '') + s.lob) : '--';
      capEl.textContent = s.lob > 0 ? 'Starting in' : 'Waiting for players';
      clk.classList.remove('tiebreak-warn');
    } else if (s.ph === 'gameover') {
      timeEl.textContent = 'FINAL';
      capEl.textContent = 'Game over';
      clk.classList.remove('tiebreak-warn');
    } else {
      // Playing: an HONEST countdown to the scheduled draw limit, not to the
      // replay's end. The game is scheduled to end at absolute tick st + mt
      // (gameStartTick + maxTicks, the scoreless-draw ceiling); the clock counts
      // down to that. A game decided early by a capture or wipe FREEZES the
      // clock at whatever was left and flips to FINAL — so a nonzero freeze
      // reads as "ended it early", and only a genuine grind to the limit ever
      // reaches 0:00. (Old behavior pinned the end to mx = the replay's last
      // tick, so every game counted to zero and the race-to-zero was an
      // artifact.) When no limit is configured (mt <= 0) there is no scheduled
      // end to count toward, so fall back to the replay span.
      var end = (s.mt && s.mt > 0) ? ((s.st || 0) + s.mt) : s.mx;
      var remain = Math.max(0, (end - s.t)) / FPS;
      timeEl.textContent = fmt(remain);
      capEl.textContent = 'Time left';
      clk.classList.toggle('tiebreak-warn', remain <= 30);
    }
  }

  // ---------- transport ----------
  function renderTransport(s) {
    $('transport').classList.toggle('disabled', !s.en);
    var playBtn = $('btn-play');
    playBtn.textContent = s.pl ? '❘❘' : '▶';
    $('btn-loop').classList.toggle('on', !!s.lp);
    $('btn-skip').classList.toggle('on', !!s.sk);
    $('ffwd-chip').classList.toggle('show', !!s.ff);
    $('ffwd-mini').classList.toggle('show', !!s.ff);

    // speed chips
    SPEEDS.forEach(function (sp) { speedChipEls[sp].classList.toggle('on', sp === s.sp); });

    // scrubber. The x-axis skips the dead lobby: it spans [startTick, maxTick]
    // so tick 0 on-screen is the first frame of actual play, not "WAITING FOR
    // PLAYERS". All the derived geometry (fill, head, clock, beats, glory)
    // shares this offset origin.
    var st = Math.max(0, s.st || 0);
    var mx = Math.max(st + 1, s.mx || 1);
    var span = mx - st;
    var frac = Math.min(1, Math.max(0, (s.t - st) / span));
    $('scrub-fill').style.width = (frac * 100) + '%';
    $('scrub-head').style.left = (frac * 100) + '%';
    $('tick-clock').textContent = Math.max(0, s.t - st) + ' / ' + span;

    renderBeatMarkers(st, mx);
    renderLullSpans(st, mx);
    renderGloryLine();
  }

  // Shade the precomputed quiet stretches on the seek track. Spans are static
  // per replay, so this renders once when they arrive.
  function renderLullSpans(st, mx) {
    if (!lullSpans || lullsRendered) return;
    lullsRendered = true;
    var span = Math.max(1, mx - st);
    var box = $('lulls');
    lullSpans.forEach(function (p) {
      var el = document.createElement('div');
      el.className = 'lull-span';
      var a = Math.min(1, Math.max(0, (p[0] - st) / span));
      var b = Math.min(1, Math.max(0, (p[1] - st) / span));
      el.style.left = (a * 100) + '%';
      el.style.width = ((b - a) * 100) + '%';
      box.appendChild(el);
    });
  }

  // ---------- pov + mismatch ----------
  function renderPov(s) {
    var badge = $('povBadge');
    badge.classList.toggle('on', s.pov >= 0);
    if (s.pov >= 0)
      $('povBadgeText').textContent =
        'POV: ' + shortName(rosterName(s, s.pov)) + ' — click to clear';
    renderFpv(s);
  }

  // First-person picture-in-picture: draw the selected seat's raycast view into
  // the bottom-right inset. Wolfenstein-style — each column is one wall slice
  // whose height is inversely proportional to distance (walls are "full-screen
  // high" so an enemy running across the mouth of a lane reads as a figure
  // sweeping between wall faces), with billboarded soldiers/hearts drawn on top.
  var fpvEl = $('fpv'), fpvCanvas = $('fpv-canvas'), fpvCtx = null;

  // Drag-to-reposition the first-person inset. Grab it anywhere; we pin via
  // left/top (dropping the right/bottom anchor) and clamp inside the stage so it
  // can never be dragged off-screen. Purely a viewer convenience — no state sent.
  // Drag the inset anywhere to reposition; drag the corner grip to resize. The
  // FPV keeps a 3:2 aspect on resize. Both pin via left/top+width once used, so
  // the CSS right/bottom/aspect anchors are dropped. Purely a viewer convenience.
  (function makeFpvInteractive() {
    var grip = $('fpv-grip');
    var mode = null;                       // 'move' | 'resize' | null
    var startX = 0, startY = 0, baseLeft = 0, baseTop = 0, baseW = 0, baseH = 0;
    var FPV_ASPECT = 3 / 2, MINW = 150;

    function beginPin() {
      var rect = fpvEl.getBoundingClientRect();
      var host = (fpvEl.offsetParent || document.body).getBoundingClientRect();
      baseLeft = rect.left - host.left;
      baseTop = rect.top - host.top;
