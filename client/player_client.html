   so aiming (driven purely by continuous mouse position, no button state)

   untouched. Fades in/out in well under 100ms. */

#wheelHub{position:absolute;left:50%;top:50%;width:12px;height:12px;
  margin:-6px 0 0 -6px;border-radius:50%;background:#e8a33d;
  box-shadow:0 0 0 2px #000a}
.wchip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);

  border-radius:7px;box-shadow:0 3px 10px #0009;

  letter-spacing:.4px;text-transform:uppercase;color:#e8e4dc;
  text-shadow:0 1px 2px #000c;transition:transform 60ms ease-out}
.wchip .sub{display:block;font-size:10px;font-weight:700;opacity:.75;
  letter-spacing:.3px;margin-top:1px}
.wchip.dim{opacity:.64}
.wchip.hover{transform:translate(-50%,-50%) scale(1.16);
  border-color:#fff;color:#161310;text-shadow:none;opacity:1;z-index:2}
</style>

}
/* Self tag: at whole-map-fit scale the self cog is visually near-identical
   to any other cog of a similar hue (legibility audit #1 -- the spectator
   route's own name tags were the cited reference pattern; this ports that
   idea, drawn client-side only, never transmitted). A white ring survives
   both zoom level and team-color palette collisions; "YOU" sits above it.
   Drawn in native canvas/world pixels, same as everything else on this
   context, so it reads at CAMERA_ZOOM's magnification once seated. */
function drawSelfTag(){
  if(!selfPos)return;
  x.save();
  x.beginPath();x.arc(selfPos.x,selfPos.y,13,0,Math.PI*2);
  x.strokeStyle="rgba(255,255,255,.9)";x.lineWidth=1.5;x.stroke();
  x.font="10px ui-monospace,SFMono-Regular,Menlo,monospace";
  x.textAlign="center";x.lineWidth=2.5;
  x.strokeStyle="rgba(0,0,0,.85)";x.fillStyle="#fff";
  const ty=selfPos.y-22;
  x.strokeText("YOU",selfPos.x,ty);
  x.fillText("YOU",selfPos.x,ty);
  x.restore();
}
function drawHud(){
  /* Raw telemetry (move/aim/fire/item state), developer chrome that used to
     render on every seat unconditionally. Off by default now -- a game, not
     a debugger -- and revealed only by an explicit ?debug or ?probe param. */
  const debugHud=u.searchParams.has("debug")||u.searchParams.has("probe");
  hud.style.display=debugHud?"block":"none";
  if(!debugHud)return;
  const keys=readKeys(),on=v=>v?"on":"..";
  hud.innerHTML=
    '<b>move</b> '+on(keys.up)+'/'+on(keys.left)+'/'+on(keys.down)+'/'+on(keys.right)+
    '  <b>aim</b> '+(aimSeeded?estAim+"b":"--")+' '+(committedRotate||"park")+
    '  <b>fire</b> '+(lmb?"held":"..")+
    '  <b>item</b> '+on(keys.item)+
    (pingNote?'  <b>ping</b> '+pingNote:'');
}
/* ================= Hit feedback (client-side only) ===================
   Detected from the "damage pop " sprite labels the server already streams
   for the floating "-N"/"SPLAT" numbers (src/ctf/global.nim addDamagePops):
   a pop's FIRST frame (label ends " stage 0") is a one-shot "someone just
   took damage" event, keyed to a fixed object-id pool (DAMAGE_POP_ID_MIN/
   MAX above). Proximity to our own selfPos decides "I took it" (screenshake
   + sound) vs "I probably landed it" (hitstop + hitmarker + sound, gated on
   actively firing and a plausible engagement bubble) -- the same kind of
   locally-known signal the reticle already uses, never an oracle, and
   never anything that reaches gameHash: this only drives paint and audio.
==================================================================== */
const SELF_HIT_RADIUS=16, ENGAGE_RANGE=300;
const HITSTOP_MS=55, SHAKE_MS=130, SHAKE_MAG=2.2, HITMARKER_MS=180;
let hitstopUntil=0,shakeEndAt=0,shakeMag=0,hitmarkerUntil=0,hitmarkerIsKill=false;
/* Minimal kill feed (legibility audit #8): "EVENTS ARE TRUE" wants a real,
   sourced event line, not an invented one. This route's sprite protocol has
   no separate event/chat channel to read (parseSprite only ever handles
   sprite/object/layer/viewport packets) -- the damage-pop births just above
   ARE the only real event stream this client receives, so the feed is fed
   from that same decode, not a new signal. One structural honesty note:
   `/client/player` is a fogged, per-viewer connection (global.nim
   addDamagePops: "a player view... only receives the ones inside its
   vision"), so this feed can only ever show pops we could actually see --
   same fog-of-war rule as everything else in this file, never an oracle.
   The label carries the SIDE that took the hit, never an attacker identity
   (the wire has none), so lines never claim one. */
const FEED_MAX=4, FEED_HOLD_MS=4500, FEED_FADE_MS=1400;
function pushFeedEvent(color,isKill){
  if(!feedEl)return;
  const el=document.createElement("div");
  el.className="fev"+(isKill?" kill":"");
  el.textContent=(color||"?").toUpperCase()+(isKill?" splatted":" hit");
  feedEl.appendChild(el);
  while(feedEl.children.length>FEED_MAX)feedEl.removeChild(feedEl.firstChild);
  setTimeout(()=>{el.classList.add("fade")},FEED_HOLD_MS);
  setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el)},FEED_HOLD_MS+FEED_FADE_MS);
}
function triggerHitstop(){hitstopUntil=Math.max(hitstopUntil,performance.now()+HITSTOP_MS);scheduleDraw()}
function triggerShake(){const nowT=performance.now();shakeEndAt=Math.max(shakeEndAt,nowT+SHAKE_MS);shakeMag=SHAKE_MAG;scheduleDraw()}
function triggerHitmarker(isKill){hitmarkerUntil=performance.now()+HITMARKER_MS;hitmarkerIsKill=isKill;scheduleDraw()}
function handleDamagePopBirth(px,py,spriteId){
  const sp=sprites.get(spriteId);
  if(!sp||!sp.label||!sp.label.endsWith(" stage 0"))return;
  /* Server label format: "damage pop <color> SPLAT stage <n>" for a kill,
     "damage pop <color> -<amount> stage <n>" for a plain hit (global.nim
     addDamagePops). This used to check " KO ", a substring the server has
     never actually sent -- isKill could never be true client-side, so the
     kill hitmarker and playKillConfirm() were dead code and every kill
     misread as a plain hit (stakes audit cycle 1, criterion 8 bonus find). */
  const isKill=sp.label.indexOf(" SPLAT ")!==-1;
  pushFeedEvent(sp.label.split(" ")[2],isKill);
  if(selfPos){
    const sdx=px-selfPos.x,sdy=py-selfPos.y;
    if(sdx*sdx+sdy*sdy<=SELF_HIT_RADIUS*SELF_HIT_RADIUS){
      triggerShake();playHitTaken();return;
    }
  }
  if(lmb&&selfPos){
    const edx=px-selfPos.x,edy=py-selfPos.y;
    if(edx*edx+edy*edy<=ENGAGE_RANGE*ENGAGE_RANGE){
      triggerHitstop();triggerHitmarker(isKill);
      if(isKill)playKillConfirm();else playHitDealt();
    }
  }
}
/* Drawn at the crosshair (where the player is already looking), not at the
   hit's world position -- reads instantly without competing with the
   reticle. Bigger + red for a kill, smaller + white for a plain hit. */
function drawHitmarker(nowT){
  if(nowT>=hitmarkerUntil)return;
  const remain=(hitmarkerUntil-nowT)/HITMARKER_MS;
  const mx=haveMouse?mouseX:c.width/2,my=haveMouse?mouseY:c.height/2;
  x.save();
  x.globalAlpha=Math.max(0,Math.min(1,remain));
  x.strokeStyle=hitmarkerIsKill?"rgba(255,60,40,.95)":"rgba(255,255,255,.9)";
  x.lineWidth=hitmarkerIsKill?1.6:1.1;
  const sz=hitmarkerIsKill?7:5;
  x.beginPath();
  x.moveTo(mx-sz,my-sz);x.lineTo(mx+sz,my+sz);
  x.moveTo(mx+sz,my-sz);x.lineTo(mx-sz,my+sz);
  x.stroke();
  x.restore();
}
/* Fire sound: once on the mousedown edge (a real user gesture, so it also
   unlocks audio), then a lightweight repeat while held so a sustained trigger
   pull still sounds like fire rather than one click -- cosmetic timing only,
   the server alone decides whether a shot actually lands. */
let fireLoopTimer=null;
function startFireLoop(){
  if(fireLoopTimer)return;
  playFire();
  fireLoopTimer=setInterval(()=>{if(lmb&&!z)playFire();else stopFireLoop()},160);
}
function stopFireLoop(){
  if(fireLoopTimer){clearInterval(fireLoopTimer);fireLoopTimer=null}
}
addEventListener("mousemove",e=>{const m=toMap(e);mouseX=m.x;mouseY=m.y;haveMouse=true;sendDirectAim(mouseX,mouseY)});
c.addEventListener("mousedown",e=>{
  if(e.button===0){
    lmb=true;e.preventDefault();
    /* Fire SFX only when we actually have a seat that can fire -- the same
       agency check handleDamagePopBirth already uses (selfPos truthy) below.
       Before that (pre-takeover "suiting-up": the cog is still policy-driven,
       but this same document and its listeners are already fully live),
       selfPos is null and no gunfire audio should be audible for a click
       that has zero effect on the game. lmb itself still tracks the real
       held-button state unconditionally -- that's the actual fire INPUT bit,
       untouched by this gate, only the SFX layer is gated. */
    if(selfPos){ensureAudio();startFireLoop()}
  }
  else if(e.button===2){e.preventDefault();window.onPingWheelOpen(cellUnderCursor(),toMap(e),{x:e.clientX,y:e.clientY})}
});
addEventListener("mouseup",e=>{
  if(e.button===0){lmb=false;stopFireLoop()}
  else if(e.button===2)window.onPingWheelCommit(cellUnderCursor(),toMap(e),{x:e.clientX,y:e.clientY});
});
c.addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("blur",()=>{lmb=false;stopFireLoop();closeWheel()});
requestAnimationFrame(function ui(){drawHud();requestAnimationFrame(ui)});
</script>
</body>
</html>
