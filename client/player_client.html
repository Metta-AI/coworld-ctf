<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coworld — Paintbot</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
input{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(80vw,520px);box-sizing:border-box;background:#0008;color:#fff;border:1px solid #fff8;padding:8px 10px;font:18px monospace;outline:0;display:none}
#hud{position:fixed;left:10px;top:9px;color:#e8e4dc;background:#1a1714cc;padding:5px 9px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px;pointer-events:none;white-space:nowrap}
#hud b{color:#9a9184;font-weight:600}
#s{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e8e8e8;background:#000;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" width="128" height="128"></canvas>
<input id="i" maxlength="48" autocomplete="off" autocapitalize="off" spellcheck="false">
<div id="s">connecting...</div>
<div id="hud"></div>
<script src="snappyjs.min.js"></script>
<script src="player_controls.js"></script>
<script>
const c=document.getElementById("c"),i=document.getElementById("i"),s=document.getElementById("s"),hud=document.getElementById("hud"),x=c.getContext("2d");
const p=[0,0,0,255,194,195,199,255,255,241,232,255,255,0,77,255,255,119,168,255,95,87,79,255,171,82,54,255,255,163,0,255,255,236,39,255,126,37,83,255,0,135,81,255,0,228,54,255,29,43,83,255,131,118,156,255,41,173,255,255,255,204,170,255];
const PaletteRgb=[
  [0,0,0],[194,195,199],[255,241,232],[255,0,77],
  [255,119,168],[95,87,79],[171,82,54],[255,163,0],
  [255,236,39],[126,37,83],[0,135,81],[0,228,54],
  [29,43,83],[131,118,156],[41,173,255],[255,204,170]
];
const u=new URL(location.href),m=location.host?((location.protocol=="https:"?"wss:":"ws:")+"//"+location.host):"ws://localhost:8080";
let a=u.searchParams.get("address")||m+"/player",g=(u.searchParams.get("joystick")|0)-1,r=Math.max(0,+u.searchParams.get("reconnect")||0);
let k={},l=255,w,z=0,t=0,sawFrame=false,pixelImage=x.createImageData(128,128),spriteMode=false,layers=new Map(),sprites=new Map(),objects=new Map();
const textDecoder=new TextDecoder("utf-8");
a=(a=>{try{let v=new URL(a,location.href);if(v.protocol=="http:")v.protocol="ws:";if(v.protocol=="https:")v.protocol="wss:";if(v.pathname=="/")v.pathname="/player";for(let q of["name","token","slot"]){let h=u.searchParams.get(q);if(h!==null)v.searchParams.set(q,h)}return v+""}catch(e){return a}})(a);
function n(o){s.textContent=o;s.style.display=o?"flex":"none"}
function fit(){const raw=Math.min(innerWidth/c.width,innerHeight/c.height),scale=raw>=1?Math.max(1,Math.floor(raw)):Math.max(.1,raw);c.style.width=(c.width*scale)+"px";c.style.height=(c.height*scale)+"px"}
function sizeCanvas(width,height){if(c.width!==width||c.height!==height){c.width=width;c.height=height;x.imageSmoothingEnabled=false;fit()}}
function sendMask(mask,force=false){if(!w||w.readyState!==1)return;if(!force&&mask===l)return;w.send(spriteMode?new Uint8Array([0x84,mask&255]):new Uint8Array([0,mask&255]));l=mask}
function release(){k={};sendMask(0,true)}
function chat(text){const clean=text.replace(/[^\x20-\x7e]/g,"");if(!clean||!w||w.readyState!==1)return;if(spriteMode){const b=new Uint8Array(clean.length+3);b[0]=0x81;b[1]=clean.length&255;b[2]=clean.length>>8;for(let j=0;j<clean.length;j++)b[j+3]=clean.charCodeAt(j);w.send(b)}else{const b=new Uint8Array(clean.length+1);b[0]=1;for(let j=0;j<clean.length;j++)b[j+1]=clean.charCodeAt(j);w.send(b)}}
x.imageSmoothingEnabled=false;
onresize=fit;
fit();
onkeydown=e=>{
  if(e.code==="Enter"){
    e.preventDefault();
    if(z){chat(i.value);i.value="";i.style.display="none";z=0;release();c.focus()}
    else{release();z=1;i.style.display="block";i.focus()}
    return
  }
  if(z&&e.code==="Escape"){e.preventDefault();i.value="";i.style.display="none";z=0;release();c.focus();return}
  if(z){if(e.code.startsWith("Arrow"))e.preventDefault();return}
  /* Space is ITEM USE (engine ButtonC: hold charges, release throws), so it
     must never scroll the page. Arrows likewise. */
  if(e.code==="Space"||e.code.startsWith("Arrow"))e.preventDefault();
  /* 1-6 fire standard pings on the shout wire. Glory is passive -- there is
     nothing in it to "call" -- so the number keys carry callouts instead. */
  const d=/^Digit([1-6])$/.exec(e.code);
  if(d){e.preventDefault();if(!k[e.code])sendPing(+d[1]);k[e.code]=1;return}
  if(k[e.code])return;
  k[e.code]=1;emitNow()
};
onkeyup=e=>{if(!k[e.code])return;k[e.code]=0;emitNow()};
i.oninput=()=>{i.value=i.value.replace(/[^\x20-\x7e]/g,"")};
onblur=release;
onpagehide=release;
document.addEventListener("visibilitychange",()=>{if(document.hidden)release()});
function readU16(bytes,offset){return bytes[offset]|(bytes[offset+1]<<8)}
function readI16(bytes,offset){const value=readU16(bytes,offset);return value&0x8000?value-0x10000:value}
function readU32(bytes,offset){return (bytes[offset]|(bytes[offset+1]<<8)|(bytes[offset+2]<<16)|(bytes[offset+3]<<24))>>>0}
function decodeSnappy(compressed,width,height){
  if(!window.SnappyJS)throw new Error("SnappyJS is not loaded");
  const expected=width*height*4,raw=window.SnappyJS.uncompress(compressed,expected),rgba=raw instanceof Uint8Array?raw:new Uint8Array(raw);
  if(rgba.length!==expected)throw new Error("Bad sprite pixel length");
  return rgba
}
function trySnappySprite(bytes,offset,remaining,width,height){
  if(remaining<6)return null;
  const compressedLength=readU32(bytes,offset);
  if(compressedLength>remaining-6)return null;
  const labelOffset=offset+4+compressedLength,labelLength=readU16(bytes,labelOffset);
  if(labelLength>remaining-4-compressedLength-2)return null;
  let pixels;
  try{pixels=decodeSnappy(bytes.slice(offset+4,labelOffset),width,height)}catch(e){return null}
  const labelStart=labelOffset+2,labelEnd=labelStart+labelLength;
  return {pixels,label:textDecoder.decode(bytes.slice(labelStart,labelEnd)),offset:labelEnd}
}
function rawSprite(bytes,offset,width,height){
  const count=width*height,pixels=new Uint8Array(count*4);
  for(let j=0;j<count;j++){
    const idx=bytes[offset+j];
    if(idx!==0){const rgb=PaletteRgb[(idx-1)&15],out=j*4;pixels[out]=rgb[0];pixels[out+1]=rgb[1];pixels[out+2]=rgb[2];pixels[out+3]=255}
  }
  return pixels
}
function ensureLayer(id){
  if(!layers.has(id))layers.set(id,{id,type:0,flags:1,width:1,height:1,canvas:document.createElement("canvas"),ctx:null,image:null});
  const layer=layers.get(id);
  if(!layer.ctx){layer.ctx=layer.canvas.getContext("2d");layer.ctx.imageSmoothingEnabled=false}
  return layer
}
function resizeMainCanvas(){
  let width=1,height=1;
  for(const layer of layers.values()){width=Math.max(width,layer.width);height=Math.max(height,layer.height)}
  sizeCanvas(width,height)
}
function viewport(layerId,width,height){
  if(layerId===0){mapW=width;mapH=height}
  const layer=ensureLayer(layerId);
  layer.width=width;layer.height=height;layer.canvas.width=width;layer.canvas.height=height;layer.image=layer.ctx.createImageData(width,height);
  resizeMainCanvas()
}
function putPixel(layer,x0,y0,sprite,srcOffset){
  if(x0<0||y0<0||x0>=layer.width||y0>=layer.height)return;
  const a=sprite.pixels[srcOffset+3];
  if(a===0)return;
  const offset=(y0*layer.width+x0)*4,d=layer.image.data;
  if(a===255||d[offset+3]===0){d[offset]=sprite.pixels[srcOffset];d[offset+1]=sprite.pixels[srcOffset+1];d[offset+2]=sprite.pixels[srcOffset+2];d[offset+3]=a;return}
  const sa=a/255,da=d[offset+3]/255,oa=sa+da*(1-sa),dw=da*(1-sa);
  d[offset]=Math.round((sprite.pixels[srcOffset]*sa+d[offset]*dw)/oa);
  d[offset+1]=Math.round((sprite.pixels[srcOffset+1]*sa+d[offset+1]*dw)/oa);
  d[offset+2]=Math.round((sprite.pixels[srcOffset+2]*sa+d[offset+2]*dw)/oa);
  d[offset+3]=Math.round(oa*255)
}
function drawSprite(){
  x.clearRect(0,0,c.width,c.height);
  x.fillStyle="#000";x.fillRect(0,0,c.width,c.height);
  const orderedLayers=[...layers.values()].sort((a,b)=>a.type-b.type||a.id-b.id);
  for(const layer of orderedLayers){
    if(!layer.image)continue;
    layer.image.data.fill(0);
    const ordered=[...objects.values()].filter(o=>o.layer===layer.id).sort((a,b)=>a.z-b.z||a.y-b.y||a.id-b.id);
    for(const object of ordered){
      const sprite=sprites.get(object.spriteId);
      if(!sprite)continue;
      const sx0=Math.max(0,-object.x),sy0=Math.max(0,-object.y),sx1=Math.min(sprite.width,layer.width-object.x),sy1=Math.min(sprite.height,layer.height-object.y);
      for(let sy=sy0;sy<sy1;sy++)for(let sx=sx0;sx<sx1;sx++)putPixel(layer,object.x+sx,object.y+sy,sprite,(sy*sprite.width+sx)*4)
    }
    layer.ctx.putImageData(layer.image,0,0);
    x.drawImage(layer.canvas,0,0)
  }
  drawReticle();
  n("")
}
function parseSprite(bytes){
  if(!spriteMode){spriteMode=true;l=255}
  sawFrame=true;
  let offset=0;
  while(offset<bytes.length){
    const type=bytes[offset++];
    if(type===0x01){
      const id=readU16(bytes,offset),width=readU16(bytes,offset+2),height=readU16(bytes,offset+4);
      offset+=6;
      const snappy=trySnappySprite(bytes,offset,bytes.length-offset,width,height);
      if(snappy){sprites.set(id,{width,height,pixels:snappy.pixels,label:snappy.label});offset=snappy.offset}
      else{sprites.set(id,{width,height,pixels:rawSprite(bytes,offset,width,height),label:""});offset+=width*height}
    }else if(type===0x02){
      const id=readU16(bytes,offset),ox=readI16(bytes,offset+2),oy=readI16(bytes,offset+4),z=readI16(bytes,offset+6),layer=bytes[offset+8],spriteId=readU16(bytes,offset+9);
      objects.set(id,{id,x:ox,y:oy,z,layer,spriteId});offset+=11
    }else if(type===0x03){objects.delete(readU16(bytes,offset));offset+=2}
    else if(type===0x04){objects.clear()}
    else if(type===0x05){viewport(bytes[offset],readU16(bytes,offset+1),readU16(bytes,offset+3));offset+=5}
    else if(type===0x06){const layer=ensureLayer(bytes[offset]);layer.type=bytes[offset+1];layer.flags=bytes[offset+2];offset+=3}
    else if(type===0x07){offset+=2}
    else{throw new Error("Unknown sprite packet type "+type)}
  }
  drawSprite()
}
function drawPixels(bytes){
  spriteMode=false;sizeCanvas(128,128);
  const q=pixelImage.data;let j=0,o,value;
  for(let idx=0;idx<8192;idx++){
    value=bytes[idx];o=(value&15)*4;q[j++]=p[o++];q[j++]=p[o++];q[j++]=p[o++];q[j++]=255;
    o=(value>>4)*4;q[j++]=p[o++];q[j++]=p[o++];q[j++]=p[o++];q[j++]=255
  }
  x.putImageData(pixelImage,0,0);n("")
}
(function connect(){
  n("connecting...");w=new WebSocket(a);w.binaryType="arraybuffer";l=255;
  w.onopen=()=>n("");
  w.onmessage=e=>{
    const bytes=new Uint8Array(e.data);
    sawFrame=false;
    try{if(bytes.length===8192&&!spriteMode)drawPixels(bytes);else parseSprite(bytes)}
    catch(err){console.error(err);n("bad packet");w.close()}
    if(sawFrame)controlsTick();
  };
  const q=w;
  q.onclose=q.onerror=()=>{
    if(w!==q)return;
    if(r){n("reconnecting...");if(!t)t=setTimeout(()=>{t=0;connect()},r*1000)}
    else n("disconnected...")
  }
})();
/* ================= Season 2 human-seat controls =====================
   WASD move . mouse aim . LMB fire . Space item . 1-6 ping . RMB wheel hook

   Every binding below resolves to a button a POLICY could also press. The
   engine's whole per-tick action space is eight bits (spriteprotocol.nim
   InputState) plus a shout string, and player_controls.js documents which
   bit each key owns. Nothing here can express an action a bot cannot.

   The aim is DEAD-RECKONED because that is the most PRECISE channel this
   client has. Whether the engine ALSO exposes it depends on your lineage --
   self-aim rendering differs across branches in flight (TRUE on main and the
   takeover base, fuzzed on 970e948), so verify rather than inherit this
   sentence. Either way the sprite channel is quantized to +/-8 brads, past the
   fire tolerance, while integrating our own commands measures <=2.
==================================================================== */
const CC=CtfControls;
let mouseX=0,mouseY=0,haveMouse=false,lmb=false;
let estAim=0,aimSeeded=false,selfPos=null,selfTeam=null;
let committedRotate=null,emittedAttack=false,tickMask=0,wasSeated=false;
let mapW=0,mapH=0,tickCount=0,lastPingTick=-999,pingNote="";

/* The ping wheel is a SEPARATE lane. We own only the seam: swallow the
   browser context menu, hand the wheel the map cell under the pointer, and
   let it commit any standard ping through sendPing(). Replace these two
   hooks; nothing else in this file needs to change. */
window.onPingWheelOpen=window.onPingWheelOpen||function(cell,pos){};
window.onPingWheelCommit=window.onPingWheelCommit||function(cell,pos){};

/* The self marker is a labelled sprite -- `self <color> <side>` (labels.nim
   LabelPrefixSelf). The map layer is served at scale 1 with its origin at
   (0,0), so object coordinates ARE map coordinates. */
function findSelf(){
  for(const o of objects.values()){
    const sp=sprites.get(o.spriteId);
    if(sp&&sp.label&&sp.label.startsWith("self ")){
      selfTeam=sp.label.split(" ")[1]||null;
      return {x:o.x+sp.width/2,y:o.y+sp.height/2};
    }
  }
  return null;
}
function toMap(ev){
  const r=c.getBoundingClientRect();
  return {x:(ev.clientX-r.left)*(c.width/Math.max(1,r.width)),
          y:(ev.clientY-r.top)*(c.height/Math.max(1,r.height))};
}
function cellUnderCursor(){
  return (haveMouse&&mapW&&mapH)?CC.chessCell(mouseX,mouseY,mapW,mapH):null;
}
function sendPing(digit){
  const text=CC.pingText(digit,cellUnderCursor());
  if(!text)return;
  /* applyShout rate-limits to one shout per second and drops the rest, so
     we mirror that locally to keep the HUD honest rather than pretend. */
  if(tickCount-lastPingTick<CC.SHOUT_COOLDOWN_TICKS){pingNote=text+" (held)";return}
  lastPingTick=tickCount;pingNote=text;chat(text);
}
function readKeys(){
  return {
    up:!z&&!!(k.KeyW||k.ArrowUp), down:!z&&!!(k.KeyS||k.ArrowDown),
    left:!z&&!!(k.KeyA||k.ArrowLeft), right:!z&&!!(k.KeyD||k.ArrowRight),
    rotate:committedRotate, fire:!z&&lmb, item:!z&&!!k.Space,
  };
}
/* Movement and item respond the instant a key moves, but the rotate and
   attack bits change ONLY on the tick clock: re-deciding them mid-tick would
   feed the server an extra rotate tick our dead reckoning never counted, and
   would burn the fire pulse early. */
function emitNow(){
  const keys=readKeys();
  const held=tickMask&(CC.BUTTON.b|CC.BUTTON.select|CC.BUTTON.attack);
  tickMask=held|CC.moveMask(keys)|CC.itemBit(keys.item);
  sendMask(tickMask);
}
/* One server frame == one applied sim tick. */
function controlsTick(){
  tickCount++;
  if(aimSeeded)estAim=CC.stepAim(estAim,committedRotate);
  selfPos=findSelf();
  /* Every fresh spawn re-seeds: the engine snaps aimBrads back to
     spawnAimBrads on EVERY respawn, so carrying the old estimate across a
     death would leave the gun permanently off the cursor. */
  const seatedNow=!!selfPos;
  if(seatedNow&&!wasSeated&&selfTeam){estAim=CC.reseedAim(estAim,true,false,selfTeam);aimSeeded=true}
  wasSeated=seatedNow;
  let rot=null;
  if(aimSeeded&&selfPos&&haveMouse&&!z){
    rot=CC.rotateButton(estAim,
      CC.bradsOfVector(Math.round(mouseX-selfPos.x),Math.round(mouseY-selfPos.y)));
  }
  committedRotate=rot;
  tickMask=CC.buildMask(readKeys(),{attack:emittedAttack});
  emittedAttack=(tickMask&CC.BUTTON.attack)!==0;
  sendMask(tickMask);
  drawHud();
}
/* Reticle: client-side only, never transmitted. It draws the aim we
   COMMANDED, so it reveals nothing this seat did not already know -- it is
   not an oracle and it does not unfuzz the render. */
function drawReticle(){
  if(selfPos&&aimSeeded){
    const a=estAim*Math.PI/(CC.AIM_BRADS_TURN/2),ux=Math.cos(a),uy=-Math.sin(a);
    x.strokeStyle="rgba(255,236,39,.5)";x.lineWidth=1;
    x.beginPath();x.moveTo(selfPos.x+ux*9,selfPos.y+uy*9);
    x.lineTo(selfPos.x+ux*88,selfPos.y+uy*88);x.stroke();
  }
  if(!haveMouse)return;
  x.strokeStyle=lmb?"rgba(255,0,77,.95)":"rgba(232,228,220,.85)";x.lineWidth=1;
  x.beginPath();
  x.moveTo(mouseX-5,mouseY+.5);x.lineTo(mouseX-1,mouseY+.5);
  x.moveTo(mouseX+2,mouseY+.5);x.lineTo(mouseX+6,mouseY+.5);
  x.moveTo(mouseX+.5,mouseY-5);x.lineTo(mouseX+.5,mouseY-1);
  x.moveTo(mouseX+.5,mouseY+2);x.lineTo(mouseX+.5,mouseY+6);
  x.stroke();
}
function drawHud(){
  const keys=readKeys(),on=v=>v?"on":"..";
  hud.innerHTML=
    '<b>move</b> '+on(keys.up)+'/'+on(keys.left)+'/'+on(keys.down)+'/'+on(keys.right)+
    '  <b>aim</b> '+(aimSeeded?estAim+"b":"--")+' '+(committedRotate||"park")+
    '  <b>fire</b> '+(lmb?"held":"..")+
    '  <b>item</b> '+on(keys.item)+
    (pingNote?'  <b>ping</b> '+pingNote:'');
}
addEventListener("mousemove",e=>{const m=toMap(e);mouseX=m.x;mouseY=m.y;haveMouse=true});
c.addEventListener("mousedown",e=>{
  if(e.button===0){lmb=true;e.preventDefault()}
  else if(e.button===2){e.preventDefault();window.onPingWheelOpen(cellUnderCursor(),toMap(e))}
});
addEventListener("mouseup",e=>{
  if(e.button===0)lmb=false;
  else if(e.button===2)window.onPingWheelCommit(cellUnderCursor(),toMap(e));
});
c.addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("blur",()=>{lmb=false});
requestAnimationFrame(function ui(){drawHud();requestAnimationFrame(ui)});
</script>
</body>
</html>
