<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coworld — Paintbot</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{display:flex;align-items:center;justify-content:center}
/* #viewport clips the world canvas to the screen; the canvas itself stays
   the whole map at native resolution (see the "SCALE UP, never reveal more
   world" note by fit()) and is panned/zoomed under it purely via CSS
   transform -- the pixel buffer this camera crops is identical either way. */
#viewport{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;left:0;top:0;transform-origin:0 0;image-rendering:pixelated;image-rendering:crisp-edges;will-change:transform}
/* Minimal kill feed (legibility audit #8): a real event stream this client
   already receives (the same damage-pop births that already drive hitstop/
   hitmarker/shake below) rendered as text -- last FEED_MAX lines, newest on
   top, auto-fading. A plain fixed-position DOM overlay rather than canvas
   text so it never pans/zooms with the world camera above. */
#feed{position:fixed;left:10px;bottom:44px;display:flex;flex-direction:column-reverse;gap:3px;pointer-events:none;font:600 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px}
#feed .fev{color:#e8e4dc;text-shadow:0 1px 2px #000,0 0 5px #000a;opacity:1;transition:opacity 1.4s linear}
#feed .fev.kill{color:#ff6a52}
#feed .fev.fade{opacity:0}
input{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);width:min(80vw,520px);box-sizing:border-box;background:#0008;color:#fff;border:1px solid #fff8;padding:8px 10px;font:18px monospace;outline:0;display:none}
#hud{display:none;position:fixed;left:10px;top:9px;color:#e8e4dc;background:#1a1714cc;padding:5px 9px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px;pointer-events:none;white-space:nowrap}
#hud b{color:#9a9184;font-weight:600}
#s{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#e8e8e8;background:#000;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:0;pointer-events:none}
/* Death state reuses #s/n()'s existing overlay plumbing, but unlike the
   connecting/reconnecting/disconnected states (nothing meaningful behind
   them -- opaque black is correct there), the match keeps visibly playing
   out while we're dead, so this variant tints instead of hiding it. */
#s.dead{background:#000a;align-items:flex-start;padding-top:20px;font-weight:600;text-shadow:0 1px 3px #000}
/* Damage-taken edge vignette (Maxwell, live 8/29: "i need damage effect,
   when i get damaged"). Deliberately the OPPOSITE shape of #splat below:
   edges only, center left clear so it never blinds the player mid-fight,
   and gone in a quarter-second rather than SPLAT's full held beat -- the
   two need to read as different events (still hurting vs. just died) even
   though both key off the same self-hit detection in handleDamagePopBirth.
   Intensity (opacity, via the --dmg CSS var triggerDamageFlash sets) scales
   with the pop's own "-<amount>" label text -- the same severity signal
   the floating damage number already shows, just felt as well as read. */
#dmgFlash{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;
  --dmg:.5;
  background:radial-gradient(ellipse at center,transparent 40%,rgba(210,20,20,calc(var(--dmg)*.85)) 100%);
  transition:opacity 260ms ease-out}
#dmgFlash.show{opacity:1;transition:opacity 30ms ease-out}
/* Big SPLAT-on-death stamp (Maxwell, live 8/29): the #s.dead toast above is
   the whole-match "you're down, waiting to respawn" state and stays exactly
   as-is; this is a separate, momentary flourish on TOP of it at the instant
   OUR OWN cog goes down, in the same kill-red already used for the kill
   feed/hitmarker above (#ff6a52 / rgba(255,60,40,*)) rather than a new
   color. A pure CSS-transition-driven class toggle (triggerSelfSplat()
   below flips classes on a timer, same idiom as #feed's fade above) -- not
   a canvas draw, so it never touches c.style.transform or the world camera
   and cannot be the source of any per-frame presentation churn there. */
#splat{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:55;opacity:0;transform:scale(1.35) rotate(-3deg);
  transition:opacity 700ms ease-in,transform 700ms ease-in}
#splat b{font:900 15vmin/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1vmin;
  color:#ff6a52;-webkit-text-stroke:.6vmin #1a0705;text-shadow:0 0 2vmin #000c}
#splat.show{opacity:1;transform:scale(1) rotate(-3deg);transition:opacity 70ms ease-out,transform 70ms cubic-bezier(.22,1.8,.36,1)}
/* Death card (Maxwell asks, live 8/29: "i need to see who killed me when i
   die" / "i need to see why i died"): killer identity + weapon + distance,
   rendered INSIDE the existing #s.dead overlay -- same element, same n()
   plumbing, no second overlay system. Only ever built once a private
   shot-feedback record for THIS death has actually arrived (the channel is
   config-gated engine-side, allowShotFeedback); with the channel silent the
   overlay renders exactly the plain text it always has. Hierarchy is
   typography/weight only -- the killer NAME is the headline, everything
   else steps down; no accent bars, no borders. */
#s .dcard{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;
  /* clears the HUD's top-center score strip (player_hud.js mounts above
     this overlay in DOM order) -- margin on the CARD only, so the plain
     channel-silent line keeps its exact historical position. */
  margin-top:30px}
#s .dcardBy{display:flex;align-items:baseline;gap:8px;font-weight:400;font-size:13px;color:#b9b3a9}
#s .dcardWho{font-weight:800;font-size:19px;letter-spacing:.5px;color:#fff}
#s .dcardChip{width:12px;height:12px;border-radius:2px;align-self:center;box-shadow:0 0 0 1px #000c}
#s .dcardDetail{font:600 12.5px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.3px;color:#b9b3a9}
#s .dcardFf{color:#e8a33d;font-weight:800}
#s .dcardState{margin-top:2px;font-size:14px;color:#e8e8e8}
#mute{position:fixed;right:10px;top:9px;color:#e8e4dc;background:#1a1714cc;border:1px solid #4a453c;padding:4px 8px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px;cursor:pointer;border-radius:3px;user-select:none}
#mute:hover{background:#2a2620cc}
/* Leave affordance ("way back to CTF" -- Maxwell, live 8/30): this file had
   ZERO navigation chrome -- no link out, anywhere -- which is fine when
   pbnf's play.html embeds us in its own sandboxed iframe (its own corner
   "Leave the field" button already owns that job end to end: it POSTs
   /api/field/leave and hands the guest an "Off the field" card with real
   doors back to /play and /lobbies -- see server/field.mjs, web/play.html
   in the pbnf-zerowait deploy repo). It is NOT fine standalone: a bare
   /client/player or /client/takeover load (no portal chrome at all, e.g. a
   direct link) left a human with genuinely no way back to anything once
   seated -- a dead end, not a hint, which the product law here treats as a
   failure outright. Shown ONLY when this document is its own top browsing
   context (see the `window.top===window.self` gate below) -- the portal's
   iframe is sandboxed WITHOUT allow-top-navigation, so a copy of this
   button rendered inside it could never actually navigate anywhere; hiding
   it there avoids a second, half-working "leave" competing with the one
   that already works. Same corner, same button language, same hover as
   #mute above -- one small utility cluster, not two separate systems. */
#leave{position:fixed;right:10px;top:36px;color:#e8e4dc;background:#1a1714cc;border:1px solid #4a453c;padding:4px 8px;font:11px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px;cursor:pointer;border-radius:3px;user-select:none}
#leave:hover{background:#2a2620cc}
/* Round-flip beat (BR only -- "it respawned me", diagnosed as a missing
   transition: BR elimination is permanent within a round -- lives forced to
   0, sim.nim -- so the ONLY way this file's existing seatedNow&&!wasSeated
   spawn edge can ever fire again after a real death is a fresh round. The
   death card already says so ("next round starts soon...") and then just
   vanishes the instant control returns, same frame the new cog can already
   move and fire -- nothing ever marked the boundary, so a new round reads
   as your last life continuing. This card marks it: a brief, unmissable,
   NON-blocking beat (pointer-events:none throughout -- WASD/mouse/fire work
   under it from frame one, never gated on it) that fades on its own,
   never a modal wait. No round NUMBER: the player stream carries none
   (sim_types.nim/server.nim checked), so this states only the one fact the
   client actually has -- a boundary just happened -- rather than inventing
   a count. Center screen like #splat above, but a calm informational card
   (warm dark panel, not a full-bleed color stamp) since this is a status
   notice, not a hit reaction -- typography carries the hierarchy (bold
   headline, plain subline), no icon, no border flourish. */
#roundFlip{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:52;opacity:0;transition:opacity 260ms ease-out}
#roundFlip.show{opacity:1;transition:opacity 90ms ease-out}
#roundFlip .rfCard{display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:12px 22px;background:#1a1714e6;border:1px solid #4a453c;border-radius:4px;
  box-shadow:0 6px 20px #000a;text-align:center}
#roundFlip .rfWho{font:800 15px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;
  text-transform:uppercase;color:#e8e4dc}
#roundFlip .rfSub{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.2px;color:#b9b3a9}
/* Quick-callout radial wheel: RMB-hold overlay for the six standard team
   pings (player_controls.js KEYMAP id "wheel", callout-spec.md sec.5). Sits
   above the canvas but never intercepts pointer events (pointer-events:none
   throughout) -- hit-testing is done in JS off tracked cursor coordinates,
   so aiming (driven purely by continuous mouse position, no button state)
   and the canvas's own mousedown/mouseup/contextmenu handling are both
   untouched. Fades in/out in well under 100ms. */
#wheel{position:fixed;left:0;top:0;width:0;height:0;pointer-events:none;
  opacity:0;transition:opacity 60ms ease-out;z-index:40}
#wheel.open{opacity:1}
#wheelRing{position:absolute;left:50%;top:50%;width:200px;height:200px;
  margin:-100px 0 0 -100px;border-radius:50%;
  border:3px solid #e8a33d;box-shadow:0 0 0 1px #000a,0 6px 22px #000a;
  background:radial-gradient(circle,#1a171466 0%,#1a171422 70%,transparent 72%)}
#wheelHub{position:absolute;left:50%;top:50%;width:12px;height:12px;
  margin:-6px 0 0 -6px;border-radius:50%;background:#e8a33d;
  box-shadow:0 0 0 2px #000a}
.wchip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  min-width:92px;max-width:124px;padding:6px 9px;text-align:center;
  background:#1a1714e6;border:2px solid #4a453c;border-left-width:5px;
  border-radius:7px;box-shadow:0 3px 10px #0009;
  font:800 13px/1.18 ui-monospace,SFMono-Regular,Menlo,monospace;
  letter-spacing:.4px;text-transform:uppercase;color:#e8e4dc;
  text-shadow:0 1px 2px #000c;transition:transform 60ms ease-out}
.wchip .sub{display:block;font-size:10px;font-weight:700;opacity:.75;
  letter-spacing:.3px;margin-top:1px}
.wchip.dim{opacity:.64}
.wchip.hover{transform:translate(-50%,-50%) scale(1.16);
  border-color:#fff;color:#161310;text-shadow:none;opacity:1;z-index:2}
</style>
</head>
<body>
<div id="viewport"><canvas id="c" width="128" height="128"></canvas></div>
<input id="i" maxlength="48" autocomplete="off" autocapitalize="off" spellcheck="false">
<div id="s">connecting...</div>
<div id="hud"></div>
<div id="wheel" aria-hidden="true"><div id="wheelRing"></div><div id="wheelHub"></div></div>
<div id="feed" aria-hidden="true"></div>
<div id="dmgFlash" aria-hidden="true"></div>
<div id="splat" aria-hidden="true"><b>SPLAT!</b></div>
<div id="roundFlip" aria-hidden="true"><div class="rfCard"><div class="rfWho">new round</div><div class="rfSub">you're back in it</div></div></div>
<button id="mute" type="button">sound: on</button>
<button id="leave" type="button" hidden>leave</button>
<script src="snappyjs.min.js"></script>
<script src="player_controls.js"></script>
<script>
const c=document.getElementById("c"),i=document.getElementById("i"),s=document.getElementById("s"),hud=document.getElementById("hud"),muteBtn=document.getElementById("mute"),feedEl=document.getElementById("feed"),dmgFlashEl=document.getElementById("dmgFlash"),splatEl=document.getElementById("splat"),roundFlipEl=document.getElementById("roundFlip"),leaveBtn=document.getElementById("leave"),x=c.getContext("2d");
/* Only offer it where it can actually work -- see #leave's own comment
   above for why the portal's embedded iframe (sandboxed, no
   allow-top-navigation) must stay on its own existing "Leave the field"
   button instead of this one. "/" is the real, already-live front door
   (Season 2 landing page: Free Play + Lobbies, each with its own BR/CTF
   pick) -- never a page this file invents or owns. */
if(window.top===window.self){
  leaveBtn.hidden=false;
  leaveBtn.onclick=()=>{location.href="/"};
}
const p=[0,0,0,255,194,195,199,255,255,241,232,255,255,0,77,255,255,119,168,255,95,87,79,255,171,82,54,255,255,163,0,255,255,236,39,255,126,37,83,255,0,135,81,255,0,228,54,255,29,43,83,255,131,118,156,255,41,173,255,255,255,204,170,255];
const u=new URL(location.href),m=location.host?((location.protocol=="https:"?"wss:":"ws:")+"//"+location.host):"ws://localhost:8080";
/* Reconnect interval in seconds. Used to default to 0 (off) unless a
   caller passed ?reconnect=N -- so any transient close (a server hiccup,
   a reset-dance blip) that hit a live human seat stranded it on
   "disconnected..." forever with no way back short of a manual page
   reload, even though the SAME identity/slot/token would happily be
   re-admitted a moment later. Defaults to 2s now; ?reconnect=0 still
   disables it explicitly for callers that want the old strand-on-close
   behavior. MaxReconnectAttempts bounds it -- a genuinely dead server
   must still resolve to "disconnected...", not retry forever. */
let a=u.searchParams.get("address")||m+"/player",g=(u.searchParams.get("joystick")|0)-1,
  r=u.searchParams.has("reconnect")?Math.max(0,+u.searchParams.get("reconnect")||0):2,
  reconnectAttempts=0;
const MaxReconnectAttempts=10;
let k={},l=255,w,z=0,t=0,sawFrame=false,pixelImage=x.createImageData(128,128),spriteMode=false,layers=new Map(),sprites=new Map(),objects=new Map();
/* Motion interpolation, ported from broadcast_core.js's updateInterpolation
   (same SNAP_DISTANCE, same learned packetInterval, same glide/snap rule):
   the sim advances ~24 discrete states/sec, so drawn as-is that is a 41ms
   staircase on a 60/120Hz display. Every object's dispX/dispY glides from
   wherever it was last drawn to the packet's x/y over one packet interval;
   a layer change or a jump past SNAP_DISTANCE (respawn/teleport) snaps
   instead of inventing motion the sim never had. This drives only the
   PIXEL DRAW -- aim/control math below still reads raw object.x/y so the
   glide can never perturb what gets sent to the server. */
let movingObjects=new Set(),packetInterval=1000/24,lastMotionAt=0,rafHandle=0;
const SNAP_DISTANCE=48;
/* Object-pool id range for the floating "-N"/"SPLAT" damage pops the server
   already streams (src/ctf/global.nim: DamagePopObjectBase=38000, one slot
   per concurrent pop, documented range 38000..38031). Hit feedback below
   watches this range rather than adding any new wire signal. */
const DAMAGE_POP_ID_MIN=38000, DAMAGE_POP_ID_MAX=38031;
/* Weapon state model. The server already tracks our REAL fireCooldown/
   fireWindup and streams it every tick as a fixed HUD object: object id
   5008 (global.nim SpritePlayerRemainingObjectId) on the bottom-left HUD
   layer, referencing one of two static sprites --
   5000 (SpritePlayerFireSpriteId, label "fire icon" = ready) or
   5001 (SpritePlayerFireShadowSpriteId, label "fire icon cooldown" =
   winding up or cooling down, global.nim:8787 `player.fireCooldown > 0 or
   player.fireWindup > 0`). This is per-player (viewerIndex=playerIndex),
   so unlike damage pops it is never fogged and never anyone else's state
   -- it is ALWAYS our own gun. Tracking which sprite is currently placed
   there gives a ground-truth "can I fire right now" signal, with zero new
   wire surface: the same idiom as the damage-pop label watch above, just
   a different fixed id.
   The ready->not-ready EDGE is the moment a shot was just accepted (the
   engine starts the windup on the same tick as the input rising edge,
   sim.nim applyInput) -- long before the bullet travels and any resulting
   damage pop could round-trip back to us. That edge is the honest "I just
   fired" moment this client was missing everywhere: the fire SFX (used to
   play on every mousedown/held-click regardless of cooldown -- "the
   shooting sound needs to only happen when i actually fire off a shot")
   and the "did I land that hit" gate below (used to check `lmb` -- whether
   the mouse was STILL held the instant the hit-pop packet arrived -- but a
   tap-click releases lmb long before windup + travel + round-trip
   latency completes, so a normal tap-fire kill/hit almost never satisfied
   it). Both now key off lastFireConfirmedAt instead. */
const FIRE_ICON_OBJECT_ID=5008, FIRE_ICON_SPRITE_READY=5000, FIRE_ICON_SPRITE_COOLDOWN=5001;
let fireReady=null,lastFireConfirmedAt=0;
/* Published for the HUD lane (client/player_hud.js) to read a real
   cooldown indicator from, rather than re-deriving this itself:
   `ready` mirrors the server's own fire-icon sprite (true/false once
   observed, null before the first HUD packet), `lastFireAt` is the
   performance.now() timestamp of the last confirmed ready->cooldown
   edge (0 = never fired this session). Exact cooldown/windup TICK
   durations are not on the player wire (only the boolean state is), so
   there is no duration/percentage field here -- a filling cooldown bar
   would need either a wire addition or a config-based estimate, same
   shape as fitVisionScale()'s assumedGunRangePx below. */
function publishWeaponState(){window.weaponState={ready:fireReady,lastFireAt:lastFireConfirmedAt}}
function noteFireIconObject(spriteId,nowT){
  const ready=spriteId===FIRE_ICON_SPRITE_READY?true:spriteId===FIRE_ICON_SPRITE_COOLDOWN?false:null;
  if(ready===null)return; // some other sprite momentarily at this id (shouldn't happen) -- ignore rather than guess
  if(fireReady===true&&ready===false){
    lastFireConfirmedAt=nowT;
    playFire(); // the real "a shot just left the gun" edge -- see the fire-sound comment near mousedown below
  }
  fireReady=ready;
  publishWeaponState();
}
const textDecoder=new TextDecoder("utf-8");
/* ---- Minimal WebAudio SFX: fire / hit-taken / hit-dealt / kill-confirm ----
   No binary assets -- short oscillator/noise bursts a few frames long. The
   AudioContext is created lazily on the first real user gesture (autoplay
   policy); mute is one boolean gated through a single master gain node. */
let audioCtx=null,masterGain=null,muted=false,noiseBuffer=null;
function ensureAudio(){
  if(audioCtx)return;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audioCtx=new AC();
  masterGain=audioCtx.createGain();
  masterGain.gain.value=muted?0:0.35;
  masterGain.connect(audioCtx.destination);
  const len=Math.floor(audioCtx.sampleRate*0.3);
  noiseBuffer=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=noiseBuffer.getChannelData(0);
  for(let j=0;j<len;j++)d[j]=Math.random()*2-1;
}
function setMuted(v){
  muted=v;
  if(masterGain)masterGain.gain.value=muted?0:0.35;
  if(muteBtn)muteBtn.textContent=muted?"sound: off":"sound: on";
}
function playTone(freq,dur,type,gainPeak,glideTo){
  if(!audioCtx)return;
  const osc=audioCtx.createOscillator(),g=audioCtx.createGain(),t0=audioCtx.currentTime;
  osc.type=type||"square";osc.frequency.setValueAtTime(freq,t0);
  if(glideTo)osc.frequency.exponentialRampToValueAtTime(Math.max(1,glideTo),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(gainPeak,t0+0.005);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  osc.connect(g);g.connect(masterGain);
  osc.start(t0);osc.stop(t0+dur+0.02);
}
function playNoise(dur,gainPeak,filterFreq){
  if(!audioCtx||!noiseBuffer)return;
  const src=audioCtx.createBufferSource();src.buffer=noiseBuffer;
  const filt=audioCtx.createBiquadFilter();filt.type="bandpass";filt.frequency.value=filterFreq||1200;
  const g=audioCtx.createGain(),t0=audioCtx.currentTime;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.linearRampToValueAtTime(gainPeak,t0+0.003);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  src.connect(filt);filt.connect(g);g.connect(masterGain);
  src.start(t0);src.stop(t0+dur+0.02);
}
function playFire(){playNoise(.05,.5,2600);playTone(180,.045,"square",.18,90)}
function playHitTaken(){playTone(160,.12,"sawtooth",.3,70);playNoise(.08,.25,500)}
function playHitDealt(){playTone(920,.06,"square",.25,1400)}
function playKillConfirm(){playTone(700,.05,"square",.28,1500);setTimeout(()=>playTone(1050,.09,"square",.24,1700),55)}
muteBtn.onclick=e=>{e.preventDefault();e.stopPropagation();ensureAudio();setMuted(!muted);c.focus()};
a=(a=>{try{let v=new URL(a,location.href);if(v.protocol=="http:")v.protocol="ws:";if(v.protocol=="https:")v.protocol="wss:";if(v.pathname=="/")v.pathname="/player";for(let q of["name","token","slot"]){let h=u.searchParams.get(q);if(h!==null)v.searchParams.set(q,h)}return v+""}catch(e){return a}})(a);
function n(o){s.textContent=o;s.style.display=o?"flex":"none"}
/* SCALE UP, never reveal more world: c.width/c.height are the pixel buffer
   the SERVER decided to send (the map layer's native resolution) -- fit()
   only ever changes the CSS size those same pixels are displayed at. Every
   player sees the same board regardless of monitor; a bigger screen just
   gets bigger pixels, never a wider camera.
   This used to floor() the scale to an integer once raw>=1, which keeps
   pixels perfectly square but wastes most of the screen on anything under
   2x the native resolution -- a 1920x1080 laptop against a 1235x659 board
   (raw=1.55) rendered at literal 1x, 64% width / 61% height, because 1.55
   floors to 1. Canvas already carries image-rendering:pixelated, so a
   fractional scale still reads as crisp blocky pixels (just not perfectly
   uniform in size) -- a fair trade for filling the screen. */
/* fit() now only sets the canvas element's own intrinsic CSS box to match
   its pixel buffer 1:1 -- the actual on-screen scale/pan is a separate CSS
   transform applied by updateCamera() (controls section below), which zooms
   to the seated player instead of always fitting the whole map. Kept as its
   own function (rather than folded into updateCamera) because it also needs
   to re-run whenever the canvas's pixel buffer itself is resized. */
function fit(){c.style.width=c.width+"px";c.style.height=c.height+"px"}
/* camInited/cameraTransformDirty are marked, not applied: the actual
   c.style.transform write happens inside updateCamera(), and that must only
   ever run from the rAF-gated draw tick (see updateCamera's own header
   comment) -- this function is called synchronously from viewport()
   mid-message, so calling updateCamera() here directly would be exactly the
   off-beat presentation write that comment warns about. scheduleDraw()

    }

  w.onmessage=e=>{

       recognize -- a text frame still can never reach the Uint8Array path,
       and a silent channel leaves this handler doing exactly what it did
       before the consumer existed: nothing. */
    if(typeof e.data==="string"){handleTextFrame(e.data);return;}

    try{if(bytes.length===8192&&!spriteMode)drawPixels(bytes);else parseSprite(bytes)}

function triggerHitmarker(isKill){hitmarkerUntil=performance.now()+HITMARKER_MS;hitmarkerIsKill=isKill;scheduleDraw()}
/* Damage-taken vignette. Same CSS-transition class-toggle idiom as
   triggerSelfSplat below, just a different shape (see #dmgFlash's own
   comment). DMG_FLASH_HOLD_MS is the brief full-intensity beat before
   #dmgFlash's own 260ms decay transition takes over -- not a canvas draw,
   so (like #splat) this can never be the source of any per-frame
   c.style.transform churn. Amount comes straight off the same "-<amount>"
   damage-pop label the floating number already renders (damagePopBucket
   in global.nim buckets it to 1/2/3/6) -- not a new signal, just felt as
   well as read. */
const DMG_FLASH_HOLD_MS=80;
let dmgFlashHideTimer=0;
function triggerDamageFlash(amount){
  if(!dmgFlashEl)return;
  const severity=Math.max(.35,Math.min(1,(amount||1)/4));
  dmgFlashEl.style.setProperty("--dmg",severity.toFixed(2));
  clearTimeout(dmgFlashHideTimer);
  dmgFlashEl.classList.remove("show");
  void dmgFlashEl.offsetWidth; // force reflow so re-triggering mid-decay restarts the transition
  dmgFlashEl.classList.add("show");
  dmgFlashHideTimer=setTimeout(()=>{dmgFlashEl.classList.remove("show")},DMG_FLASH_HOLD_MS);
}
function handleDamagePopBirth(px,py,spriteId){
  const sp=sprites.get(spriteId);
  if(!sp||!sp.label||!sp.label.endsWith(" stage 0"))return;
  /* Server label format: "damage pop <color> SPLAT stage <n>" for a kill,
     "damage pop <color> -<amount> stage <n>" for a plain hit (global.nim
     addDamagePops). This used to check " KO ", a substring the server has
     never actually sent -- isKill could never be true client-side, so the
     kill hitmarker and playKillConfirm() were dead code and every kill
     misread as a plain hit (stakes audit cycle 1, criterion 8 bonus find). */
  const isKill=sp.label.indexOf(" SPLAT ")!==-1;
  pushFeedEvent(sp.label.split(" ")[2],isKill);
  if(selfPos){
    const sdx=px-selfPos.x,sdy=py-selfPos.y;
    if(sdx*sdx+sdy*sdy<=SELF_HIT_RADIUS*SELF_HIT_RADIUS){
      triggerShake();playHitTaken();
      /* Skip the vignette on the hit that kills us -- #splat (triggered
         separately, off the seatedNow death edge in controlsTick) already
         owns that moment, and the two stacking would be visual noise on
         top of each other rather than two distinct, readable events. */
      if(!isKill)triggerDamageFlash(Math.abs(parseInt(sp.label.split(" ")[3],10))||1);
      return;
    }
  }
  if(selfPos&&lastFireConfirmedAt&&performance.now()-lastFireConfirmedAt<=SELF_FIRE_CREDIT_MS){
    const edx=px-selfPos.x,edy=py-selfPos.y,engageRange=engageRangePx();
    if(edx*edx+edy*edy<=engageRange*engageRange){
      /* Wire-first dedupe: when the authoritative shot-feedback channel
         (consumer block below) already confirmed this same event a moment
         ago, don't fire the heuristic feedback a second time -- one event,
         one confirm. A kill still UPGRADES over a plain-hit confirm.
         Channel silent (allowShotFeedback off, or not a takeover socket):
         lastWireFeedbackAt stays 0 and the guard below can never suppress,
         so this branch behaves exactly as it did before the channel. */
      const nowT=performance.now();
      if(lastWireFeedbackAt&&nowT-lastWireFeedbackAt<=SHOT_FEEDBACK_DEDUPE_MS&&(lastWireFeedbackKill||!isKill))return;
      lastPopFeedbackAt=nowT;lastPopFeedbackKill=isKill;
      triggerHitstop();triggerHitmarker(isKill);
      if(isKill)playKillConfirm();else playHitDealt();
    }
  }
}
/* ============ Private shot-feedback channel (consumer) ==============
   Engine half: the config-gated (GameConfig.allowShotFeedback, default
   OFF) shooter/victim combat-outcome channel -- a JSON TextMessage on the
   TAKEOVER socket only, one object per tick with anything to say:
     { "shotsLanded": [{kill,friendlyFire,weapon,distance,victimTeam,
                        victimColor}...],
       "hitsTaken":   [{kill,friendlyFire,weapon,distance,killerTeam,
                        killerColor}...] }
   weapon is "gun"|"spray"|"grenade"; identities are WORDS (team name +
   player color name), never RGB; delivered UNFOGGED to the two direct
   participants of each event only. Never sent at all on a tick with
   nothing to say, and never sent anywhere when the gate is off -- so every
   line below is provably inert on today's live config.

   Two consumers, both feeding surfaces that already exist:
   - hitsTaken kill records -> the death card inside the existing #s.dead
     overlay ("who killed me" / "why i died": killer + weapon + distance +
     friendly-fire), rendered by renderDeathOverlay from drawSprite's
     existing per-frame status call.
   - shotsLanded -> the EXISTING hitstop/hitmarker/kill-confirm path, so a
     hit the damage-pop heuristic could never see (fogged/occluded victim:
     a grenade corner-kill, a windup shot after the target broke LOS) now
     confirms like any visible one. Deduped both ways against the pop
     heuristic above so one event never confirms twice.
==================================================================== */
const SHOT_FEEDBACK_DEDUPE_MS=250;
/* How far apart (ms) a fatal hitsTaken record and our own seated->unseated
   death edge may land and still be the same death: same tick in practice
   (the server sends both in one frame pass), sized generously for jitter.
   Both orders happen -- the JSON can beat the sprite frame or trail it --
   so the check is a window around diedAt, not an ordering. */
const DEATH_ATTRIB_MS=3000;
let lastPopFeedbackAt=0,lastPopFeedbackKill=false;
let lastWireFeedbackAt=0,lastWireFeedbackKill=false;
let deathInfo=null,diedAt=0,deathCardKey="";
const shotFeedbackCounts={framesSeen:0,shotsLanded:0,hitsTaken:0,killsConfirmed:0,dedupedConfirms:0};
/* Published for the HUD lane and for scripted verification, same idiom as
   publishWeaponState above: read-only mirror, never consumed here. */
function publishShotFeedback(){
  window.shotFeedback={
    channelLive:shotFeedbackCounts.framesSeen>0,
    framesSeen:shotFeedbackCounts.framesSeen,
    shotsLanded:shotFeedbackCounts.shotsLanded,
    hitsTaken:shotFeedbackCounts.hitsTaken,
    killsConfirmed:shotFeedbackCounts.killsConfirmed,
    dedupedConfirms:shotFeedbackCounts.dedupedConfirms,
    lastDeath:deathInfo?{team:deathInfo.team,color:deathInfo.color,
      weapon:deathInfo.weapon,distance:deathInfo.distance,
      friendlyFire:deathInfo.friendlyFire,killerX:deathInfo.killerX,
      killerY:deathInfo.killerY,killerAlive:deathInfo.killerAlive}:null
  };
}
/* Shared attribution gate: a fatal record only belongs to THIS death while
   it lands within DEATH_ATTRIB_MS of diedAt (see that const's own comment
   for why the check is a window, not an ordering). renderDeathOverlay, the
   killcam camera override, and the killcam marker all need the identical
   answer to "is deathInfo trustworthy right now", so this is the one place
   that decides it -- three separate re-derivations of the same window would
   be three chances for them to disagree. */
function attributedDeathInfo(){
  return (deathInfo&&Math.abs(deathInfo.at-diedAt)<=DEATH_ATTRIB_MS)?deathInfo:null;
}
/* Killcam hold: how long after diedAt the camera stays panned on the
   killer's last position (see updateCamera/drawKillcamMarker below).
   Comfortably inside DEATH_ATTRIB_MS so the attribution gate never lapses
   mid-pan -- the killcam window is always the tighter of the two. */
const KILLCAM_HOLD_MS=2400;
function killcamInfo(){
  if(selfPos)return null; // only while actually dead -- see updateCamera's own seated-first check
  const info=attributedDeathInfo();
  if(!info||info.killerX===null||info.killerY===null)return null;
  if(performance.now()-diedAt>=KILLCAM_HOLD_MS)return null;
  return info;
}
/* PlayerColorNames -> retro palette index (sim_types.nim PlayerColors /
   PlayerColorNames, the same 16-entry palette as `p` at the top of this
   file): turns the color WORD the wire carries (colors are words, never
   RGB) into the killer's real on-field hue for the death-card chip. An
   unknown word simply gets no chip -- never a guessed color. */
const PLAYER_COLOR_INDEX={red:3,orange:7,yellow:8,"light blue":14,pink:4,
  lime:11,blue:13,"pale blue":15,gray:1,white:2,"dark brown":5,brown:6,
  "dark teal":9,green:10,"dark navy":12,black:0};
function colorWordCss(word){
  const idx=PLAYER_COLOR_INDEX[String(word||"").toLowerCase()];
  if(idx===undefined)return null;
  const o=idx*4;
  return "rgb("+p[o]+","+p[o+1]+","+p[o+2]+")";
}
function handleTextFrame(text){
  /* Defense in depth on top of the frame-type guard: the channel's payload
     is a JSON OBJECT (first byte always '{' by contract). Anything else,
     or anything that fails to parse, is ignored exactly as every text
     frame was before this consumer existed. */
  if(!text||text[0]!=="{")return;
  let msg;
  try{msg=JSON.parse(text)}catch(err){return}
  if(!msg||typeof msg!=="object")return;
  const landed=Array.isArray(msg.shotsLanded)?msg.shotsLanded:null;
  const taken=Array.isArray(msg.hitsTaken)?msg.hitsTaken:null;
  if(!landed&&!taken)return;
  handleShotFeedback(landed||[],taken||[]);
}
function handleShotFeedback(landed,taken){
  const nowT=performance.now();
  shotFeedbackCounts.framesSeen++;
  shotFeedbackCounts.shotsLanded+=landed.length;
  shotFeedbackCounts.hitsTaken+=taken.length;
  /* Victim half: a fatal record is the death card's data source. Last one
     wins if several land in one message (a simultaneous trade can only
     kill us once). Non-fatal hitsTaken add nothing here: our own hit pop
     is at our own position and never fogged from us, so the existing
     shake/vignette path already covers it. */
  for(const h of taken){
    if(h&&h.kill===true){
      /* killerX/killerY/killerAlive (killcam, GVNEXT): present ONLY on a
         fatal hitsTaken entry -- never on a non-fatal one, never on any
         shotsLanded entry -- that narrowing is the wallhack guard on the
         engine side, so read them defensively (typeof, never assumed) and
         let their absence (an older server, or simply "not this record
         shape") fall through to exactly today's card/camera, no pan, no
         marker. killerAlive is evaluated at DELIVERY time, so a mutual
         trade (the killer also died before this packet arrived) reads as
         false here -- see drawKillcamMarker/updateCamera below for why that
         case gets its own label instead of silently panning at nothing. */
      deathInfo={team:String(h.killerTeam||""),color:String(h.killerColor||""),
        weapon:String(h.weapon||""),distance:Math.max(0,h.distance|0),
        friendlyFire:h.friendlyFire===true,at:nowT,
        killerX:typeof h.killerX==="number"?h.killerX:null,
        killerY:typeof h.killerY==="number"?h.killerY:null,
        killerAlive:typeof h.killerAlive==="boolean"?h.killerAlive:null};
    }
  }
  /* Shooter half: feed the one feedback path that exists. One confirm per
     message (a spray landing on three cogs is one trigger pull), kill
     outranks hit, and a friendly-fire kill confirms as a plain hit --
     truthful "it landed", no celebration chime for splatting a teammate. */
  if(landed.length){
    const realKill=landed.some(sh=>sh&&sh.kill===true&&sh.friendlyFire!==true);
    if(lastPopFeedbackAt&&nowT-lastPopFeedbackAt<=SHOT_FEEDBACK_DEDUPE_MS&&(lastPopFeedbackKill||!realKill)){
      shotFeedbackCounts.dedupedConfirms++;
    }else{
      lastWireFeedbackAt=nowT;lastWireFeedbackKill=realKill;
      if(realKill)shotFeedbackCounts.killsConfirmed++;
      triggerHitstop();triggerHitmarker(realKill);
      if(realKill)playKillConfirm();else playHitDealt();
    }
  }
  publishShotFeedback();
  if(isDead)scheduleDraw(); // a card datum trailing the death edge repaints now, not at the next packet
}
function deathStatusLine(){
  return cameraContext==="br"?
    "wiped out -- you're done for this round. next round starts soon...":
    "you're down -- waiting to respawn...";
}
function renderDeathOverlay(){
  if(!isDead){deathCardKey="";n("");return}
  const line=deathStatusLine();
  const info=attributedDeathInfo();
  if(!info){deathCardKey="";n(line);return}
  /* Rebuild only when the card's content actually changes; the DOM check
     covers any interleaved n() call (reconnect text etc.) having wiped the
     card while the key still claimed it was up. */
  const key=line+"|"+info.at+"|"+info.team+"|"+info.color+"|"+info.weapon+"|"+info.distance+"|"+info.friendlyFire+"|"+info.killerAlive;
  if(key===deathCardKey&&s.firstElementChild&&s.firstElementChild.className==="dcard")return;
  deathCardKey=key;
  s.textContent="";
  const card=document.createElement("div");card.className="dcard";
  const by=document.createElement("div");by.className="dcardBy";
  const verb=document.createElement("span");verb.textContent="splatted by";
  by.appendChild(verb);
  const chipColor=colorWordCss(info.color);
  if(chipColor){
    const chip=document.createElement("span");chip.className="dcardChip";
    chip.style.background=chipColor;by.appendChild(chip);
  }
  const who=document.createElement("span");who.className="dcardWho";
  who.textContent=(info.team||info.color||"unknown").toUpperCase();
  by.appendChild(who);
  card.appendChild(by);
  const det=document.createElement("div");det.className="dcardDetail";
  det.textContent=info.weapon+" \u00b7 "+info.distance+" px";
  if(info.friendlyFire){
    const ff=document.createElement("span");ff.className="dcardFf";
    ff.textContent="friendly fire";
    det.appendChild(document.createTextNode(" \u00b7 "));det.appendChild(ff);
  }
  /* Mutual trade (killcam, GVNEXT): killerAlive is only ever a real
     true/false once the engine sends killer coords at all (see the
     deathInfo capture above) -- strict `=== false`, never falsy, so an
     older server (the field simply absent, killerAlive stays null) renders
     the exact same card it always has, no new claim it can't back up. Said
     here AND at the killer's own panned position (drawKillcamMarker) --
     the card is the one place guaranteed to be seen even if a player never
     looks toward the pan. */
  if(info.killerAlive===false){
    const tr=document.createElement("span");tr.className="dcardFf";
    tr.textContent="traded -- they went down too";
    det.appendChild(document.createTextNode(" \u00b7 "));det.appendChild(tr);
  }
  card.appendChild(det);
  const st=document.createElement("div");st.className="dcardState";st.textContent=line;
  card.appendChild(st);
  s.appendChild(card);
  s.style.display="flex";
}
/* Drawn at the crosshair (where the player is already looking), not at the
   hit's world position -- reads instantly without competing with the
   reticle. Bigger + red for a kill, smaller + white for a plain hit. */
function drawHitmarker(nowT){
  if(nowT>=hitmarkerUntil)return;
  const remain=(hitmarkerUntil-nowT)/HITMARKER_MS;
  const mx=haveMouse?mouseX:c.width/2,my=haveMouse?mouseY:c.height/2;
  x.save();
  x.globalAlpha=Math.max(0,Math.min(1,remain));
  x.strokeStyle=hitmarkerIsKill?"rgba(255,60,40,.95)":"rgba(255,255,255,.9)";
  x.lineWidth=hitmarkerIsKill?1.6:1.1;
  const sz=hitmarkerIsKill?7:5;
  x.beginPath();
  x.moveTo(mx-sz,my-sz);x.lineTo(mx+sz,my+sz);
  x.moveTo(mx+sz,my-sz);x.lineTo(mx-sz,my+sz);
  x.stroke();
  x.restore();
}
/* Fire sound: used to play once on every mousedown edge PLUS a repeat every
   160ms while held ("the shooting sound needs to only happen when i
   actually fire off a shot. not everytime i click" -- a click landing
   during our own cooldown played the exact same sound as one that actually
   fired). Now driven entirely off the ready->cooldown edge on the real
   fire-icon HUD watch (noteFireIconObject above): playFire() lives there,
   fires exactly once per shot the engine actually accepted, and needs no
   loop/timer here at all. A click that lands on cooldown is now silent
   rather than lying about it (no distinct "denied" cue yet -- silence was
   judged safer than inventing a new sound without direction). */
addEventListener("mousemove",e=>{const m=toMap(e);mouseX=m.x;mouseY=m.y;haveMouse=true;sendDirectAim(mouseX,mouseY)});
c.addEventListener("mousedown",e=>{
  if(e.button===0){
    lmb=true;e.preventDefault();
    if(selfPos)ensureAudio(); // first real user gesture unlocks WebAudio; playFire() itself fires off the HUD edge, not from here
  }
  else if(e.button===2){e.preventDefault();window.onPingWheelOpen(cellUnderCursor(),toMap(e),{x:e.clientX,y:e.clientY})}
});
addEventListener("mouseup",e=>{
  if(e.button===0){lmb=false}
  else if(e.button===2)window.onPingWheelCommit(cellUnderCursor(),toMap(e),{x:e.clientX,y:e.clientY});
});
c.addEventListener("contextmenu",e=>e.preventDefault());
addEventListener("blur",()=>{lmb=false;closeWheel()});
/* ---- Seam probe (?seamprobe=1 only) -----------------------------------
   Maxwell sees flashing horizontal bars in LIVE play that his OWN
   screenshots never catch, and neither did two prior instrumented scans
   (field report 8/29). Working theory: a SCAN-OUT artifact -- display
   tearing from a presentation update landing off the vsync beat -- which
   by definition cannot show up in any frame-buffer capture, screenshot or
   otherwise, because those all read the CANVAS'S OWN BACKING STORE (what
   we drew), not what the GPU actually scanned out to the physical
   display. This probe reads that same backing store via getImageData, so
   it CANNOT see scan-out tearing either. What it CAN do is rule the
   *buffer* in or out: catch a genuine bug where our own drawn pixels
   momentarily contain a dark full-width row, as distinct from a
   presentation-layer artifact downstream of what was drawn. A clean run
   here is expected and does NOT contradict what Maxwell sees on his
   actual display -- see updateCamera()'s whole-map branch above for the
   other half of this investigation (a control arm: whole-map never
   rewrites the camera transform mid-scene, so if the bars persist there
   too, they can't be this camera's per-frame CSS churn).

   NULL-ARM: on a static scene (nothing changes frame to frame -- e.g. the
   pre-connect black canvas, or a paused game) every sampled row's EMA
   baseline converges to its own steady brightness, so current never drops
   SEAM_DROP_RATIO below it and __seamLog stays empty. A probe that fired
   on a static scene would be measuring its own noise, not signal --
   verify by loading with ?seamprobe=1 and checking window.__seamLog.length
   stays 0 before ever connecting/moving.

   Zero cost when the flag is absent: this entire block, including the rAF
   loop, only exists inside the `if`. */
const SEAMPROBE=u.searchParams.get("seamprobe")==="1";
if(SEAMPROBE){
  window.__seamLog=[];
  const SEAM_ROWS=6,SEAM_BASELINE_EMA=0.1,SEAM_DROP_RATIO=0.35,SEAM_MIN_BASELINE=20,SEAM_LOG_MAX=200;
  let seamBaseline=null,seamLastT=performance.now();
  const seamRowY=i=>Math.max(0,Math.min(c.height-1,Math.round((i+1)*c.height/(SEAM_ROWS+1))));
  function seamRowBrightness(y){
    const band=x.getImageData(0,y,c.width,1).data;
    let sum=0;
    for(let px=0;px<band.length;px+=4)sum+=band[px]+band[px+1]+band[px+2];
    return sum/(band.length/4)/3; // 0..255 average brightness across the full-width row
  }
  function seamTick(now){
    requestAnimationFrame(seamTick);
    if(c.width<2||c.height<SEAM_ROWS+2)return;
    if(!seamBaseline)seamBaseline=new Array(SEAM_ROWS).fill(-1);
    const flagged=[];
    for(let i=0;i<SEAM_ROWS;i++){
      const y=seamRowY(i),b=seamRowBrightness(y);
      if(seamBaseline[i]<0){seamBaseline[i]=b;continue}
      if(seamBaseline[i]>SEAM_MIN_BASELINE&&b<seamBaseline[i]*SEAM_DROP_RATIO)flagged.push(y);
      seamBaseline[i]=seamBaseline[i]*(1-SEAM_BASELINE_EMA)+b*SEAM_BASELINE_EMA;
    }
    if(flagged.length){
      const entry={t:now,rows:flagged,duration:now-seamLastT};
      window.__seamLog.push(entry);
      if(window.__seamLog.length>SEAM_LOG_MAX)window.__seamLog.shift();
      console.log("[seamprobe]",entry);
    }
    seamLastT=now;
  }
  requestAnimationFrame(seamTick);
}
requestAnimationFrame(function ui(){drawHud();requestAnimationFrame(ui)});
</script>
