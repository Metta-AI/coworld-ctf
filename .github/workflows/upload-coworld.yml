name: Upload Coworld

# Builds the game and baseline-bot images via compose.yaml and
# uploads a new ctf version to Softmax (https://softmax.com/api) after the
# test workflow ("Github Actions") passes on main — a red test run blocks the
# upload. (Paintbot — the doubles variant — has its own lockstep upload in
# upload-coworld-paintbot.yml.) The version is the HIGHEST EXISTING ctf
# registry row with the patch bumped (tools/ci/next_coworld_version.py),
# unless an explicit version is passed via workflow_dispatch. Do NOT use
# `coworld next-version` here: it is canonical-based, so an orphan
# non-canonical row from a half-failed publish wedges every later publish
# with 409s (seven in a row overnight 2026-07-30/31 on orphan ctf:0.7.128).
#
# Auth: the SOFTMAX_TOKEN repo secret — the non-expiring "coworld-ctf-ci"
# user credential (softmax.com/observatory/credentials). If it is ever
# revoked, mint a new credential on that page and run:
#   gh secret set SOFTMAX_TOKEN --repo Metta-AI/coworld-ctf

on:
  workflow_run:
    workflows: ["Github Actions"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit game version (default: bump patch of latest uploaded ctf)"
        required: false

# One upload at a time; queued runs wait so version query/bump cannot race.
concurrency:
  group: upload-coworld
  cancel-in-progress: false

jobs:
  upload:
    # Manual dispatch always runs; workflow_run only after a green test run
    # AND only for a push to this repo's main. The event/repo checks matter:
    # the workflow_run `branches` filter matches the triggering run's HEAD
    # branch, so a fork PR whose source branch is named "main" would
    # otherwise fire this job — with repo secrets — on unreviewed fork code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: coworld-ctf
          # For workflow_run, build the exact SHA the tests certified.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Check the certified SHA is still main's HEAD
        id: freshness
        working-directory: coworld-ctf
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "stale=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin main
          latest=$(git rev-parse origin/main)
          certified="${{ github.event.workflow_run.head_sha }}"
          if [ "$latest" != "$certified" ]; then
            echo "::notice::Skipping upload: certified SHA $certified is not origin/main HEAD ($latest) — superseded or a re-run of an old run. Re-running an OLD test run must not republish old code as the newest version."
            echo "stale=1" >> "$GITHUB_OUTPUT"
          else
            echo "stale=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to Softmax
        if: steps.freshness.outputs.stale != '1'
        run: uvx --from "coworld[auth]==0.1.34" softmax set-token "${{ secrets.SOFTMAX_TOKEN }}"
      - name: Determine version
        if: steps.freshness.outputs.stale != '1'
        id: version
        env:
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
        run: |
          set -euo pipefail
          python3 coworld-ctf/tools/ci/test_next_coworld_version.py
          version="${{ inputs.version || '' }}"
          if [ -z "$version" ]; then
            version=$(python3 coworld-ctf/tools/ci/next_coworld_version.py ctf)
          fi
          echo "Uploading as ctf $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # `coworld resolve-and-upload` was removed from the coworld CLI; the
      # replacement is the two-step flow: `build` (compose build + manifest
      # hydration from the template) then `upload-coworld` (registry push +
      # hosted smoke certification).
      - name: Build, certify, and upload
        if: steps.freshness.outputs.stale != '1'
        working-directory: coworld-ctf
        run: |
          uvx --from "coworld[auth]==0.1.34" coworld build \
            --version "${{ steps.version.outputs.version }}" \
            --project . \
            --compose compose.yaml \
            --template coworld_manifest.json \
            --output build/coworld-package/coworld_manifest.json
          uvx --from "coworld[auth]==0.1.34" coworld upload-coworld \
            build/coworld-package/coworld_manifest.json \
            --timeout-seconds 900 \
            --wait-hosted-smoke \
            --hosted-smoke-timeout-seconds 1800
      - name: Verify upload
        if: steps.freshness.outputs.stale != '1'
        run: |
          set -euo pipefail
          uvx --from "coworld[auth]==0.1.34" coworld list --json --limit 500 > /tmp/coworlds-after.json
          python3 - "${{ steps.version.outputs.version }}" <<'EOF'
          import json, sys
          expected = sys.argv[1]
          rows = json.load(open("/tmp/coworlds-after.json"))
          for name in ("ctf",):
              match = [r for r in rows if r.get("name") == name and r.get("version") == expected]
              if not match:
                  raise SystemExit(f"uploaded {name} version {expected} not found on server")
              entry = match[0]
              if not entry.get("canonical"):
                  raise SystemExit(
                      f"{name}:{expected} uploaded but is not canonical; "
                      "the league will not advance. Hosted smoke certification likely did not pass."
                  )
              print(entry["id"], entry["name"], entry["version"], "canonical")
          EOF
