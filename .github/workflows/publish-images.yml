name: Publish images

# Builds and pushes the game and baseline-bot images to GHCR.
# Manual (workflow_dispatch) or on a version tag, so ordinary pushes to main
# do not republish images. The manifest references:
#   ghcr.io/metta-ai/coworld-ctf           (game)
#   ghcr.io/metta-ai/coworld-ctf-baseline  (baseline bot)
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # workflow_run can't key on a tag ref, so nothing today stops a `v*` tag
  # pushed at an untested (or red) commit from publishing straight to GHCR.
  # This asks the API directly: is there a SUCCESSFUL "Github Actions" run
  # (build.yml) recorded at this exact SHA? Manual workflow_dispatch skips
  # the check entirely — that path stays available for a hand-publish.
  verify-ci:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require a passing "Github Actions" run at this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="${{ github.sha }}"
          count=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$sha&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "Github Actions" and .conclusion == "success")] | length')
          if [ "$count" -eq 0 ]; then
            echo "::error::No successful \"Github Actions\" run found for $sha — refusing to publish an untested tag. Tag a commit that already has a green CI run on origin/main, or use workflow_dispatch to publish manually."
            exit 1
          fi
          echo "OK: found $count successful Github Actions run(s) for $sha."

  publish:
    needs: [verify-ci]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.verify-ci.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: coworld-ctf
            dockerfile: Dockerfile
          - image: coworld-ctf-baseline
            dockerfile: players/baseline/Dockerfile
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/metta-ai/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
