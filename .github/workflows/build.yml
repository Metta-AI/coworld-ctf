name: Github Actions
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libevdev-dev
      - uses: treeform/setup-nim-action@v6
      - run: nimby sync nimby.lock -g
      # Reuse compiled C objects across runs: the release build of the deps
      # (pixie et al.) dominates the compile step and rarely changes. The key
      # includes the commit so every run saves a fresh cache; restore falls
      # back to the newest cache for the same dependency lock.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/nim
          key: nimcache-${{ runner.os }}-${{ hashFiles('nimby.lock') }}-${{ github.sha }}
          restore-keys: |
            nimcache-${{ runner.os }}-${{ hashFiles('nimby.lock') }}-
      - run: nim check src/ctf.nim
      - name: Compile test shards (release)
        run: |
          for i in 1 2 3 4; do
            nim c -d:release --hints:off -o:shard_$i tests/shard_$i.nim &
            eval "pid_$i=\$!"
          done
          fail=0
          for i in 1 2 3 4; do
            eval "wait \$pid_$i" || fail=1
          done
          exit $fail
      - name: Run test shards in parallel
        run: |
          for i in 1 2 3 4; do
            ./shard_$i > shard_$i.log 2>&1 &
            eval "pid_$i=\$!"
          done
          fail=0
          for i in 1 2 3 4; do
            eval "wait \$pid_$i" || fail=1
          done
          for i in 1 2 3 4; do
            echo "::group::shard $i"
            cat shard_$i.log
            echo "::endgroup::"
          done
          exit $fail
