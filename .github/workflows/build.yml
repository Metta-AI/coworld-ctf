# NOTE: the upload workflow (upload-coworld-paintbot.yml) triggers via workflow_run
# on this workflow's NAME. Renaming "Github Actions" silently stops all
# league uploads — update that file in the same commit if you rename it.
#
# EVERYTHING HERE RUNS INSIDE caos. The jobs below install nix, enter the repo's
# dev shell (which pins caos through flake.lock), bring a stack up and call a
# tool. What that buys over the previous nimby-plus-cache setup:
#
#   - one compile. `run-tool build` produces the SHIPPED binaries with the
#     shipped flags, and build-game-image layers exactly those. CI used to
#     compile the game to test it and the upload compiled it again to ship it.
#   - caching that is content-addressed rather than key-guessed. The old
#     actions/cache key was nimby.lock plus the commit sha, so every push saved
#     a fresh copy and restored a near-miss; caos keys each job on its actual
#     inputs, so an untouched module does not recompile and an untouched test
#     does not re-run.
#   - the same tools a person runs locally. A red CI job reproduces with the
#     one command in its step.
#
# RUNNERS ARE amd64 ON PURPOSE. Both image tools assert that the binary they
# layer matches the base's architecture (caos-tools/lib/image.sh), and the
# pinned emsdk image is amd64-only, so the wasm job cannot run anywhere else.
name: Github Actions
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  # Fast, isolated job: it doesn't touch the caos jobs below, so a GameVersion
  # collision fails CI in seconds without slowing them down. See
  # tools/ci/check_gameversion.sh for what it actually compares — not the
  # number (a colliding branch and its base can both read e.g. "42") but the
  # rule headline the number is attached to.
  #
  # NOT a caos tool, and it should not become one: it compares this tree
  # against the PR's BASE, and a caos job is handed a tree with no git history
  # to compare against.
  gameversion-tripwire:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: GameVersion is not a number the base already spent
        run: |
          git fetch --no-tags --depth=1 origin '${{ github.base_ref }}'
          tools/ci/check_gameversion.sh FETCH_HEAD

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v16
      # caos moves objects over git, so the stack has to be a remote. The URL
      # is the one caosd publishes; CAOS_SERVER_URL alone is not enough.
      - name: Point this checkout at the stack
        run: git remote add caos http://localhost:9090
      - name: Bring the caos stack up
        run: nix develop --command caosd up
      # Two tools, one stack. `build` compiles what ships; `test` builds the
      # suite from the same tree and fans it out one job per module.
      - name: build
        run: nix develop --command caos-cli run-tool build
      - name: test
        run: nix develop --command caos-cli run-tool test

  # The static replay viewer ships as wasm32: Nim `int` is 32 bits there
  # (overflow checks trap on math that is silently fine on 64-bit native)
  # and the address space ends at 2 GB. The native suite above can never
  # catch that class of bug — twice it reached prod and every hosted replay
  # hung on "WARMING UP" (PR #189). This job builds the EXACT bundle the
  # observatory serves — the same caos tool tools/build_replay_viewer.sh calls
  # at upload time, so there is one bundle rather than two — and loads and
  # steps real fixture replays inside the wasm runtime.
  wasm-replay-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Point this checkout at the stack
        run: git remote add caos http://localhost:9090
      - name: Bring the caos stack up
        run: nix develop --command caosd up
      - name: test-viewer
        run: nix develop --command caos-cli run-tool test-viewer
