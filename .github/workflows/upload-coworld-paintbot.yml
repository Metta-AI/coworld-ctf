name: Upload Coworld

# Builds the game/player images and uploads one paintbot Coworld version after
# the test workflow ("Github Actions") passes on main. That Coworld serves both
# the Paintbot and CTF leagues: existing Paintbot variant ids stay unchanged,
# The published manifest now exposes only battle-royale-s2; deprecated CTF
# variants are preserved in deprecated_variants_paintbot.json, not uploaded.
#
# Auth: the SOFTMAX_TOKEN repo secret for the coworld-ctf-ci user credential.

on:
  workflow_run:
    workflows: ["Github Actions"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit game version (default: bump patch of latest uploaded paintbot)"
        required: false

# One upload at a time; queued runs wait so version query/bump cannot race.
concurrency:
  group: upload-coworld-paintbot
  cancel-in-progress: false

jobs:
  upload:
    # Manual dispatch always runs; workflow_run only after a green test run
    # AND only for a push to this repo's main. The event/repo checks matter:
    # the workflow_run `branches` filter matches the triggering run's HEAD
    # branch, so a fork PR whose source branch is named "main" would
    # otherwise fire this job — with repo secrets — on unreviewed fork code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: coworld-ctf
          # For workflow_run, build the exact SHA the tests certified.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Check the certified SHA is still main's HEAD
        id: freshness
        working-directory: coworld-ctf
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "stale=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --quiet origin main
          latest=$(git rev-parse origin/main)
          certified="${{ github.event.workflow_run.head_sha }}"
          if [ "$latest" != "$certified" ]; then
            echo "::notice::Skipping upload: certified SHA $certified is not origin/main HEAD ($latest) — superseded or a re-run of an old run."
            echo "stale=1" >> "$GITHUB_OUTPUT"
          else
            echo "stale=0" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to Softmax
        if: steps.freshness.outputs.stale != '1'
        run: uvx --from "coworld[auth]==0.1.43" softmax set-token "${{ secrets.SOFTMAX_TOKEN }}"
      - name: Determine version
        if: steps.freshness.outputs.stale != '1'
        id: version
        env:
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
        run: |
          set -euo pipefail
          python3 coworld-ctf/tools/ci/test_next_coworld_version.py
          version="${{ inputs.version || '' }}"
          if [ -z "$version" ]; then
            version=$(python3 coworld-ctf/tools/ci/next_coworld_version.py paintbot)
          fi
          echo "Uploading as paintbot $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build, certify, and upload
        if: steps.freshness.outputs.stale != '1'
        working-directory: coworld-ctf
        run: |
          uvx --from "coworld[auth]==0.1.43" coworld build \
            --version "${{ steps.version.outputs.version }}" \
            --project . \
            --compose compose.yaml \
            --template coworld_manifest_paintbot.json \
            --output build/coworld-package/coworld_manifest.json
          uvx --from "coworld[auth]==0.1.43" coworld upload-coworld \
            build/coworld-package/coworld_manifest.json \
            --timeout-seconds 900 \
            --wait-hosted-smoke \
            --hosted-smoke-timeout-seconds 1800 \
            --wait-certification \
            --certification-timeout-seconds 1800
      - name: Verify upload
        if: steps.freshness.outputs.stale != '1'
        # Canonical promotion is asynchronous: it lands some minutes after the
        # hosted smoke and certification the upload already waited for (run
        # 33582260538 checked 0.7.281 at once, found it not canonical, and
        # failed; the version was promoted six minutes later). So poll: the
        # version must appear promptly, and then it gets up to fifteen
        # minutes to become canonical before this counts as a failure.
        run: |
          set -euo pipefail
          python3 - "${{ steps.version.outputs.version }}" <<'EOF'
          import json, subprocess, sys, time
          expected = sys.argv[1]
          deadline = time.monotonic() + 15 * 60
          poll_seconds = 30
          while True:
              rows = json.loads(subprocess.check_output([
                  "uvx", "--from", "coworld[auth]==0.1.43", "coworld", "list",
                  "--json", "--limit", "500"]))
              match = [r for r in rows
                       if r.get("name") == "paintbot" and r.get("version") == expected]
              if match and match[0].get("canonical"):
                  entry = match[0]
                  print(entry["id"], entry["name"], entry["version"], "canonical")
                  break
              state = "not found on server" if not match else "uploaded, not yet canonical"
              if time.monotonic() >= deadline:
                  raise SystemExit(
                      f"paintbot:{expected} {state} after 15 minutes; "
                      "the league will not advance. Hosted smoke or certification "
                      "likely did not pass, or promotion is stuck.")
              print(f"paintbot:{expected} {state}; waiting {poll_seconds}s", flush=True)
              time.sleep(poll_seconds)
          EOF
