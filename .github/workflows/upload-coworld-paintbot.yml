name: Upload Coworld

# Builds the game/player images and uploads one paintbot Coworld version after
# the test workflow ("Github Actions") passes on main. That Coworld serves both
# the Paintbot and CTF leagues: existing Paintbot variant ids stay unchanged,
# The published manifest now exposes only battle-royale-s2; deprecated CTF
# variants are preserved in deprecated_variants_paintbot.json, not uploaded.
#
# Auth: the SOFTMAX_TOKEN repo secret for the coworld-ctf-ci user credential.

on:
  workflow_run:
    workflows: ["Github Actions"]
    types: [completed]
    branches: [ main ]
  # CATCH-UP. A commit only publishes if it is still main's HEAD when its own
  # test run finishes; anything superseded mid-CI is skipped and free-rides on
  # the NEXT commit's upload. That converges only while merges keep coming, so
  # the last merge before a quiet spell can sit built-but-unpublished
  # indefinitely — on 2026-09-08 a viewer change was merged at 16:47 and did
  # not reach the site until 18:32, when an unrelated PR landed and carried it.
  # This sweep publishes main's HEAD whenever it is green and untagged, so the
  # worst case is one hour rather than "until someone else merges".
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit game version (default: bump patch of latest uploaded paintbot)"
        required: false

# One upload at a time; queued runs wait so version query/bump cannot race.
concurrency:
  group: upload-coworld-paintbot
  cancel-in-progress: false

jobs:
  upload:
    # Manual dispatch always runs; workflow_run only after a green test run
    # AND only for a push to this repo's main. The event/repo checks matter:
    # the workflow_run `branches` filter matches the triggering run's HEAD
    # branch, so a fork PR whose source branch is named "main" would
    # otherwise fire this job — with repo secrets — on unreviewed fork code.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # `contents: write` is for the paintbot-v* tag the publish step pushes —
    # that tag IS the published-version -> source-commit map everything else
    # here reads.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          path: coworld-ctf
          # Full history + tags: the decision step below needs to see every
          # paintbot-v* tag to know what has already been published.
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      # WHAT TO PUBLISH, AND WHETHER TO PUBLISH AT ALL.
      #
      # This used to just ask "is the certified SHA still main's HEAD?" and
      # skip if not. Correct as far as it went — never publish a superseded
      # build — but a skipped commit had no other route to the site, so it
      # only ever shipped when a LATER commit landed and stayed HEAD through
      # its own test run. Quiet spell after a merge = merged code that is not
      # live, with a green "Upload Coworld" run next to it saying success.
      #
      # So: always target main's HEAD rather than the SHA that happened to
      # trigger this run, and gate on the two things that actually matter —
      # HEAD's tests are green, and HEAD is not already published. Any
      # trigger (workflow_run, the hourly sweep, a manual dispatch) then
      # converges on the same answer, and re-runs are harmless.
      - name: Resolve the publish target
        id: freshness
        working-directory: coworld-ctf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin main
          head=$(git rev-parse origin/main)
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          echo "main HEAD is $head"

          # ALREADY PUBLISHED? Every successful upload below tags the exact
          # commit it built, so the tags are the published -> source map.
          # A manual dispatch may override this deliberately (re-publishing
          # the same tree as a new version is a legitimate thing to want).
          existing=$(git tag --points-at "$head" --list 'paintbot-v*' | head -1)
          if [ -n "$existing" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "::notice::main HEAD $head is already published as ${existing#paintbot-v}; nothing to do."
            echo "stale=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # GREEN? The workflow_run path used to get this for free by building
          # the certified SHA. Now that every path targets HEAD -- including
          # the sweep and manual dispatch, neither of which certifies anything
          # -- HEAD's own test run has to be checked explicitly. Publishing a
          # red main would put a broken engine on the ladder.
          conclusion=$(gh run list --workflow "Github Actions" --branch main \
            --commit "$head" --limit 1 --json conclusion --jq '.[0].conclusion // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "::notice::Skipping upload: main HEAD $head has test conclusion '$conclusion', not success. A later run will pick it up once it is green."
            echo "stale=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Build the tree we just vouched for, not the one this run was
          # triggered by -- they differ whenever main moved during CI.
          git checkout --quiet --detach "$head"
          echo "stale=0" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to Softmax
        if: steps.freshness.outputs.stale != '1'
        run: uvx --from "coworld[auth]==0.1.43" softmax set-token "${{ secrets.SOFTMAX_TOKEN }}"
      - name: Determine version
        if: steps.freshness.outputs.stale != '1'
        id: version
        env:
          SOFTMAX_TOKEN: ${{ secrets.SOFTMAX_TOKEN }}
        run: |
          set -euo pipefail
          python3 coworld-ctf/tools/ci/test_next_coworld_version.py
          version="${{ inputs.version || '' }}"
          if [ -z "$version" ]; then
            version=$(python3 coworld-ctf/tools/ci/next_coworld_version.py paintbot)
          fi
          echo "Uploading as paintbot $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build, certify, and upload
        if: steps.freshness.outputs.stale != '1'
        working-directory: coworld-ctf
        run: |
          # Stamp the game image's engine so its recordings carry
          # "engineStamp" (compose.yaml forwards this to the Dockerfile).
          export SIM_SOURCES_STAMP="$(tools/sim_sources_stamp.sh)"
          echo "engine stamp: $SIM_SOURCES_STAMP"
          uvx --from "coworld[auth]==0.1.43" coworld build \
            --version "${{ steps.version.outputs.version }}" \
            --project . \
            --compose compose.yaml \
            --template coworld_manifest_paintbot.json \
            --output build/coworld-package/coworld_manifest.json
          uvx --from "coworld[auth]==0.1.43" coworld upload-coworld \
            build/coworld-package/coworld_manifest.json \
            --timeout-seconds 900 \
            --wait-hosted-smoke \
            --hosted-smoke-timeout-seconds 1800 \
            --wait-certification \
            --certification-timeout-seconds 1800
      # THE PUBLISHED -> SOURCE-COMMIT MAP. The manifest's source_url points at
      # tree/main, a moving branch, so a published version has never recorded
      # which commit it was built from -- you could not answer "is this
      # version's engine the one with fix X?" without guessing from
      # timestamps. This tag answers it exactly, and the gate above reads it
      # to avoid publishing the same tree twice.
      #
      # It is tagged after the UPLOAD, not after the canonical-promotion check
      # below, and so means "this tree was uploaded as this version" rather
      # than "this version went canonical". Deliberate: if promotion is stuck,
      # the tree is already spent as that version and rebuilding it hourly
      # under new version numbers would bury the real failure under a pile of
      # dead versions. A failed Verify step is meant to be read by a human.
      - name: Tag the published commit
        if: steps.freshness.outputs.stale != '1'
        working-directory: coworld-ctf
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="paintbot-v${{ steps.version.outputs.version }}"
          sha="${{ steps.freshness.outputs.sha }}"
          git tag -f "$tag" "$sha"
          git push --force origin "refs/tags/$tag"
          echo "::notice::$tag -> $sha"

      - name: Verify upload
        if: steps.freshness.outputs.stale != '1'
        # Canonical promotion is asynchronous: it lands some minutes after the
        # hosted smoke and certification the upload already waited for (run
        # 33582260538 checked 0.7.281 at once, found it not canonical, and
        # failed; the version was promoted six minutes later). So poll: the
        # version must appear promptly, and then it gets up to fifteen
        # minutes to become canonical before this counts as a failure.
        run: |
          set -euo pipefail
          python3 - "${{ steps.version.outputs.version }}" <<'EOF'
          import json, subprocess, sys, time
          expected = sys.argv[1]
          deadline = time.monotonic() + 15 * 60
          poll_seconds = 30
          while True:
              rows = json.loads(subprocess.check_output([
                  "uvx", "--from", "coworld[auth]==0.1.43", "coworld", "list",
                  "--json", "--limit", "500"]))
              match = [r for r in rows
                       if r.get("name") == "paintbot" and r.get("version") == expected]
              if match and match[0].get("canonical"):
                  entry = match[0]
                  print(entry["id"], entry["name"], entry["version"], "canonical")
                  break
              state = "not found on server" if not match else "uploaded, not yet canonical"
              if time.monotonic() >= deadline:
                  raise SystemExit(
                      f"paintbot:{expected} {state} after 15 minutes; "
                      "the league will not advance. Hosted smoke or certification "
                      "likely did not pass, or promotion is stuck.")
              print(f"paintbot:{expected} {state}; waiting {poll_seconds}s", flush=True)
              time.sleep(poll_seconds)
          EOF
