name: Upload Coworld Paintbot

# Builds the same game/player images as upload-coworld.yml but pairs them with
# the Paintbot commissioner (RULESET_STRATEGY_CONFIG_NAME=ctf_doubles:
# each 8-seat parity team split between two policies, 4 policies per episode) and
# uploads a new paintbot version to Softmax on every push to main, keeping the
# Paintbot league's game rules in lockstep with the singles league. (The league
# was named ctf-doubles before 2026-07-30; the commissioner runnable id keeps
# the old name on purpose - the league seed references it.)
#
# Auth: the same SOFTMAX_TOKEN repo secret as upload-coworld.yml.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit game version (default: bump patch of latest uploaded paintbot)"
        required: false

# One upload at a time; queued runs wait so version query/bump cannot race.
concurrency:
  group: upload-coworld-paintbot
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: coworld-ctf
      # Commissioner build context; compose.paintbot.yaml expects it as a sibling dir.
      - uses: actions/checkout@v5
        with:
          repository: Metta-AI/coworld-tools
          path: coworld-tools
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to Softmax
        run: uvx --from "coworld[auth]==0.1.34" softmax set-token "${{ secrets.SOFTMAX_TOKEN }}"
      - name: Determine version
        id: version
        run: |
          set -euo pipefail
          version="${{ inputs.version || '' }}"
          if [ -z "$version" ]; then
            version=$(uvx --from "coworld[auth]==0.1.34" coworld next-version paintbot)
          fi
          echo "Uploading as paintbot $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build, certify, and upload
        working-directory: coworld-ctf
        env:
          COMMISSIONER_CONTEXT: ../coworld-tools/commissioners
        run: |
          uvx --from "coworld[auth]==0.1.34" coworld build \
            --version "${{ steps.version.outputs.version }}" \
            --project . \
            --compose compose.paintbot.yaml \
            --template coworld_manifest_paintbot.json \
            --output build/coworld-package/coworld_manifest.json
          uvx --from "coworld[auth]==0.1.34" coworld upload-coworld \
            build/coworld-package/coworld_manifest.json \
            --timeout-seconds 900 \
            --wait-hosted-smoke \
            --hosted-smoke-timeout-seconds 1800
      - name: Verify upload
        run: |
          set -euo pipefail
          uvx --from "coworld[auth]==0.1.34" coworld list --json --limit 500 > /tmp/coworlds-after.json
          python3 - "${{ steps.version.outputs.version }}" <<'EOF'
          import json, sys
          expected = sys.argv[1]
          rows = json.load(open("/tmp/coworlds-after.json"))
          match = [r for r in rows if r.get("name") == "paintbot" and r.get("version") == expected]
          if not match:
              raise SystemExit(f"uploaded version {expected} not found on server")
          entry = match[0]
          if not entry.get("canonical"):
              raise SystemExit(
                  f"paintbot:{expected} uploaded but is not canonical; "
                  "the league will not advance. Hosted smoke certification likely did not pass."
              )
          print(entry["id"], entry["name"], entry["version"], "canonical")
          EOF
