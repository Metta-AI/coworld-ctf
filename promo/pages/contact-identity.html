<!doctype html><html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#3a3a3a;font-family:monospace}
  .frame{width:1500px;padding:14px;display:flex;flex-direction:column;gap:12px}
  .row{display:flex;gap:12px;align-items:flex-start}
  .cell{background:#555;padding:5px}
  .cell img{display:block;background:
     linear-gradient(45deg,#888 25%,transparent 25%,transparent 75%,#888 75%),
     linear-gradient(45deg,#888 25%,#666 25%,#666 75%,#888 75%);
     background-size:14px 14px;background-position:0 0,7px 7px}
  .cap{color:#fff;font-size:11px;padding:3px 0}
</style></head><body>
<div class="frame">
  <div class="row">
    <div class="cell"><div class="cap">wordmark 2400x800</div><img src="../out/wordmark.png" width="720"></div>
    <div class="cell"><div class="cap">wordmark-alpha (checkerboard)</div><img src="../out/wordmark-alpha.png" width="720"></div>
  </div>
  <div class="row">
    <div class="cell"><div class="cap">og-announce 1200x630</div><img src="../out/og-announce.png" width="470"></div>
    <div class="cell"><div class="cap">two-doors 1200x630</div><img src="../out/two-doors.png" width="470"></div>
    <div class="cell"><div class="cap">x-header 1500x500</div><img src="../out/x-header.png" width="500"></div>
  </div>
  <div class="row">
    <div class="cell"><div class="cap">social-square</div><img src="../out/social-square.png" width="330"></div>
    <div class="cell"><div class="cap">social-story</div><img src="../out/social-story.png" width="200"></div>
    <div class="cell"><div class="cap">icon-256</div><img src="../out/icon-256.png" width="256"></div>
    <div class="cell"><div class="cap">icon-128</div><img src="../out/icon-128.png" width="128"></div>
    <div class="cell"><div class="cap">64px</div><img src="../out/icon-128.png" width="64"></div>
  </div>
</div></body></html>
