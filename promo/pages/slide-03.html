<!doctype html><html><head><meta charset="utf-8">
<title>S2 deck — 03 pillar 1</title>
<link rel="stylesheet" href="../brand.css">
<link rel="stylesheet" href="../deck.css">
<style>
  .stage { justify-content: center; }
  .pillnum { font-family: var(--pix); font-size: 26px; color: var(--paper-dim);
             letter-spacing: 0.2em; margin-bottom: 22px; }
  h1 { font-size: 92px; font-weight: 700; line-height: 1.06; margin: 0 0 56px;
       max-width: 1400px; color: var(--paper); }
  h1 b { color: var(--amber); font-weight: 700; }
  .sames { display: flex; gap: 64px; border-top: 1px solid var(--line); padding-top: 34px; }
  .same { flex: 1; }
  .same .k { font-family: var(--pix); font-size: 40px; color: var(--amber); }
  .same .d { margin-top: 10px; font-size: 22px; color: var(--paper-dim); font-weight: 600; }
  .notdemo { margin-top: 50px; font-size: 30px; font-weight: 700; color: var(--paper); }
  .notdemo span { color: var(--amber); }
</style></head><body>
<div class="frame">
  <canvas id="splats"></canvas>
  <div class="deck-kicker">Pillar one</div>
  <div class="stage">
    <div class="pillnum">01</div>
    <h1>A human takes <b>a real seat.</b></h1>
    <div class="sames">
      <div class="same"><div class="k">ENGINE</div><div class="d">the same one the policies run on</div></div>
      <div class="same"><div class="k">24/S</div><div class="d">same tick rate, no slow-mo for humans</div></div>
      <div class="same"><div class="k">RULES</div><div class="d">same rules, same map, same kit</div></div>
      <div class="same"><div class="k">FOG</div><div class="d">same fog of war &mdash; you see what they see</div></div>
    </div>
    <div class="notdemo">This is <span>not a demo mode.</span> It's the League.</div>
  </div>
  <div class="deck-foot">
    <span>PAINTBOT &middot; SEASON 2</span>
    <span>03 / 10</span>
  </div>
</div>
<script src="../splats.js"></script>
<script>
paintSplats(document.getElementById('splats'), [
  { x:0.965, y:0.08,  k:'hit',    c:PB_RED,  st:0, px:16, a:.78, rot:2 },
  { x:0.03,  y:0.975, k:'hit',    c:PB_BLUE, st:1, px:7,  a:.65, rot:0 },
  { x:0.97,  y:0.975, k:'puddle', c:PB_BLUE, st:2, px:9,  a:.28, rot:1 }
], { w:1920, h:1080 });
</script></body></html>
