<!doctype html><html><head><meta charset="utf-8">
<title>S2 deck — 07 seat takeover</title>
<link rel="stylesheet" href="../brand.css">
<link rel="stylesheet" href="../deck.css">
<style>
  .stage { justify-content: center; }
  h1 { font-size: 84px; font-weight: 700; line-height: 1.14; margin: 0 0 40px;
       max-width: 1360px; color: var(--paper); }
  h1 b { color: var(--amber); font-weight: 700; }
  .toast { display: inline-block; font-family: var(--pix); font-size: 34px; color: var(--paper);
           text-shadow: 3px 3px 0 rgba(0,0,0,.75); background: var(--panel);
           border: 1px solid var(--line); padding: 16px 32px; letter-spacing: 0.08em;
           margin-bottom: 40px; }
  .sub { font-size: 30px; font-weight: 600; color: var(--paper-dim); max-width: 1160px;
         line-height: 1.55; }
  .sub b { color: var(--amber); font-weight: 700; }
</style></head><body>
<div class="frame">
  <canvas id="splats"></canvas>
  <div class="deck-kicker">Seat takeover</div>
  <div class="stage">
    <h1>You suit up at the cog's <b>next respawn.</b></h1>
    <div class="toast">&#9679; SUITING UP&hellip;</div>
    <div class="sub">Assigned a policy seat? You're never <b>body-snatched mid-fight.</b> The takeover waits for the beat between lives &mdash; and if you leave, the policy just picks the seat back up.</div>
  </div>
  <div class="deck-foot">
    <span>PAINTBOT &middot; SEASON 2</span>
    <span>07 / 10</span>
  </div>
</div>
<script src="../splats.js"></script>
<script>
paintSplats(document.getElementById('splats'), [
  { x:0.965, y:0.085, k:'hit',    c:PB_RED,  st:0, px:16, a:.78, rot:1 },
  { x:0.03,  y:0.975, k:'hit',    c:PB_BLUE, st:1, px:7,  a:.65, rot:3 },
  { x:0.97,  y:0.975, k:'puddle', c:PB_BLUE, st:2, px:9,  a:.28, rot:2 }
], { w:1920, h:1080 });
</script></body></html>
