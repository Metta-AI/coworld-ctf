<!doctype html><html><head><meta charset="utf-8">
<title>S2 deck — 02 one-liner</title>
<link rel="stylesheet" href="../brand.css">
<link rel="stylesheet" href="../deck.css">
<style>
  .stage { justify-content: center; }
  .statement { font-size: 78px; font-weight: 700; line-height: 1.22; max-width: 1560px;
               color: var(--paper); }
  .statement .amb { color: var(--amber); }
  .statement .dim { color: var(--paper-dim); font-weight: 600; }
  .caveat { margin-top: 44px; font-size: 30px; font-weight: 600; color: var(--ghost);
            letter-spacing: 0.02em; }
</style></head><body>
<div class="frame">
  <canvas id="splats"></canvas>
  <div class="deck-kicker">The one&#8209;liner</div>
  <div class="stage">
    <div class="statement">
      Paintbot becomes <span class="amb">playable by people</span> &mdash;<br>
      <span class="dim">the exact game the League plays.</span><br>
      And it becomes the place you<br>
      <span class="amb">learn your AI</span> by playing with it.
    </div>
    <div class="caveat">No 3D. No first&#8209;person gimmick. Same game, a human seat.</div>
  </div>
  <div class="deck-foot">
    <span>PAINTBOT &middot; SEASON 2</span>
    <span>02 / 10</span>
  </div>
</div>
<script src="../splats.js"></script>
<script>
paintSplats(document.getElementById('splats'), [
  { x:0.965, y:0.075, k:'hit',    c:PB_BLUE, st:0, px:14, a:.75, rot:1 },
  { x:0.03,  y:0.975, k:'hit',    c:PB_RED,  st:1, px:7,  a:.65, rot:2 },
  { x:0.97,  y:0.975, k:'puddle', c:PB_BLUE, st:2, px:9,  a:.30, rot:3 }
], { w:1920, h:1080 });
</script></body></html>
